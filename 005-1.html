<script>
const $ = id => document.getElementById(id);
const SURAH = 5;
const VERSES = [
  {
    "n": 1,
    "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَوْفُوا۟ بِٱلْعُقُودِ ۚ أُحِلَّتْ لَكُم بَهِيمَةُ ٱلْأَنْعَٰمِ إِلَّا مَا يُتْلَىٰ عَلَيْكُمْ غَيْرَ مُحِلِّى ٱلصَّيْدِ وَأَنتُمْ حُرُمٌ ۗ إِنَّ ٱللَّهَ يَحْكُمُ مَا يُرِيدُ",
    "ml": "സത്യവിശ്വാസികളേ, നിങ്ങള്‍ കരാറുകള്‍ നിറവേറ്റുക. (പിന്നീട്‌) നിങ്ങള്‍ക്ക് വിവരിച്ചുതരുന്നതൊഴിച്ചുള്ള ആട്‌, മാട്‌, ഒട്ടകം എന്നീ ഇനങ്ങളില്‍ പെട്ട മൃഗങ്ങള്‍ നിങ്ങള്‍ക്ക് അനുവദിക്കപ്പെട്ടിരിക്കുന്നു. എന്നാല്‍ നിങ്ങള്‍ ഇഹ്‌റാമില്‍ പ്രവേശിച്ചവരായിരിക്കെ വേട്ടയാടുന്നത് അനുവദനീയമാക്കരുത്‌. തീര്‍ച്ചയായും അല്ലാഹു അവന്‍ ഉദ്ദേശിക്കുന്നത് വിധിക്കുന്നു.",
    "tf": ""
  },
  {
    "n": 2,
    "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُحِلُّوا۟ شَعَٰٓئِرَ ٱللَّهِ وَلَا ٱلشَّهْرَ ٱلْحَرَامَ وَلَا ٱلْهَدْىَ وَلَا ٱلْقَلَٰٓئِدَ وَلَآ ءَآمِّينَ ٱلْبَيْتَ ٱلْحَرَامَ يَبْتَغُونَ فَضْلًۭا مِّن رَّبِّهِمْ وَرِضْوَٰنًۭا ۚ وَإِذَا حَلَلْتُمْ فَٱصْطَادُوا۟ ۚ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ أَن صَدُّوكُمْ عَنِ ٱلْمَسْجِدِ ٱلْحَرَامِ أَن تَعْتَدُوا۟ ۘ وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا۟ عَلَى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ",
    "ml": "സത്യവിശ്വാസികളേ, അല്ലാഹുവിന്‍റെ മതചിഹ്നങ്ങളെ നിങ്ങള്‍ അനാദരിക്കരുത്‌. പവിത്രമായ മാസത്തെയും (കഅ്ബത്തിങ്കലേക്ക് കൊണ്ടുപോകുന്ന) ബലിമൃഗങ്ങളെയും, (അവയുടെ കഴുത്തിലെ) അടയാളത്താലികളെയും നിങ്ങളുടെ രക്ഷിതാവിന്‍റെ അനുഗ്രഹവും പൊരുത്തവും തേടിക്കൊണ്ട് വിശുദ്ധ മന്ദിരത്തെ ലക്ഷ്യമാക്കിപ്പോകുന്ന തീര്‍ത്ഥാടകരെയും (നിങ്ങള്‍ അനാദരിക്കരുത്‌.) എന്നാല്‍ ഇഹ്‌റാമില്‍ നിന്ന് നിങ്ങള്‍ ഒഴിവായാല്‍ നിങ്ങള്‍ക്ക് വേട്ടയാടാവുന്നതാണ്‌. മസ്ജിദുല്‍ ഹറാമില്‍ നിന്ന് നിങ്ങളെ തടഞ്ഞു എന്നതിന്‍റെ പേരില്‍ ഒരു ജനവിഭാഗത്തോട് നിങ്ങള്‍ക്കുള്ള അമര്‍ഷം അതിക്രമം പ്രവര്‍ത്തിക്കുന്നതിന്ന് നിങ്ങള്‍ക്കൊരിക്കലും പ്രേരകമാകരുത്‌. പുണ്യത്തിലും ധര്‍മ്മനിഷ്ഠയിലും നിങ്ങള്‍ അന്യോന്യം സഹായിക്കുക. പാപത്തിലും അതിക്രമത്തിലും നിങ്ങള്‍ അന്യോന്യം സഹായിക്കരുത്‌. നിങ്ങള്‍ അല്ലാഹുവെ സൂക്ഷിക്കുക. തീര്‍ച്ചയായും അല്ലാഹു കഠിനമായി ശിക്ഷിക്കുന്നവനാകുന്നു.",
    "tf": ""
  },
  {
    "n": 3,
    "ar": "حُرِّمَتْ عَلَيْكُمُ ٱلْمَيْتَةُ وَٱلدَّمُ وَلَحْمُ ٱلْخِنزِيرِ وَمَآ أُهِلَّ لِغَيْرِ ٱللَّهِ بِهِۦ وَٱلْمُنْخَنِقَةُ وَٱلْمَوْقُوذَةُ وَٱلْمُتَرَدِّيَةُ وَٱلنَّطِيحَةُ وَمَآ أَكَلَ ٱلسَّبُعُ إِلَّا مَا ذَكَّيْتُمْ وَمَا ذُبِحَ عَلَى ٱلنُّصُبِ وَأَن تَسْتَقْسِمُوا۟ بِٱلْأَزْلَٰمِ ۚ ذَٰلِكُمْ فِسْقٌ ۗ ٱلْيَوْمَ يَئِسَ ٱلَّذِينَ كَفَرُوا۟ مِن دِينِكُمْ فَلَا تَخْشَوْهُمْ وَٱخْشَوْنِ ۚ ٱلْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِى وَرَضِيتُ لَكُمُ ٱلْإِسْلَٰمَ دِينًۭا ۚ فَمَنِ ٱضْطُرَّ فِى مَخْمَصَةٍ غَيْرَ مُتَجَانِفٍۢ لِّإِثْمٍۢ ۙ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ",
    "ml": "ശവം, രക്തം, പന്നിമാംസം, അല്ലാഹു അല്ലാത്തവരുടെ പേരില്‍ അറുക്കപ്പെട്ടത്‌, ശ്വാസം മുട്ടി ചത്തത്‌, അടിച്ചുകൊന്നത്‌, വീണുചത്തത്‌, കുത്തേറ്റ് ചത്തത്‌, വന്യമൃഗം കടിച്ചുതിന്നത് എന്നിവ നിങ്ങള്‍ക്ക് നിഷിദ്ധമാക്കപ്പെട്ടിരിക്കുന്നു. എന്നാല്‍ (ജീവനോടെ) നിങ്ങള്‍ അറുത്തത് ഇതില്‍ നിന്നൊഴിവാകുന്നു. പ്രതിഷ്ഠകള്‍ക്കുമുമ്പില്‍ ബലിയര്‍പ്പിക്കപ്പെട്ടതും (നിങ്ങള്‍ക്ക്‌) നിഷിദ്ധമാകുന്നു. അമ്പുകളുപയോഗിച്ച് ഭാഗ്യം നോക്കലും (നിങ്ങള്‍ക്ക് നിഷിദ്ധമാക്കപ്പെട്ടിരിക്കുന്നു.) അതൊക്കെ അധര്‍മ്മമാകുന്നു. ഇന്ന് സത്യനിഷേധികള്‍ നിങ്ങളുടെ മതത്തെ നേരിടുന്ന കാര്യത്തില്‍ നിരാശപ്പെട്ടിരിക്കുകയാണ്‌. അതിനാല്‍ അവരെ നിങ്ങള്‍ പേടിക്കേണ്ടതില്ല. എന്നെ നിങ്ങള്‍ പേടിക്കുക. ഇന്ന് ഞാന്‍ നിങ്ങള്‍ക്ക് നിങ്ങളുടെ മതം പൂര്‍ത്തിയാക്കി തന്നിരിക്കുന്നു. എന്‍റെ അനുഗ്രഹം നിങ്ങള്‍ക്ക് ഞാന്‍ നിറവേറ്റിത്തരികയും ചെയ്തിരിക്കുന്നു. മതമായി ഇസ്ലാമിനെ ഞാന്‍ നിങ്ങള്‍ക്ക് തൃപ്തിപ്പെട്ട് തന്നിരിക്കുന്നു. വല്ലവനും പട്ടിണി കാരണം (നിഷിദ്ധമായത്‌) തിന്നുവാന്‍ നിര്‍ബന്ധിതനാകുന്ന പക്ഷം അവന്‍ അധര്‍മ്മത്തിലേക്ക് ചായ്‌വുള്ളവനല്ലെങ്കില്‍ തീര്‍ച്ചയായും അല്ലാഹു ഏറെ പൊറുക്കുന്നവനും കരുണ കാണിക്കുന്നവനുമാകുന്നു.",

    "ml": "തങ്ങള്‍ക്ക് അനുവദിക്കപ്പെട്ടിട്ടുള്ളത് എന്തൊക്കെയാണെന്ന് അവര്‍ നിന്നോട് ചോദിക്കും. പറയുക: നല്ല വസ്തുക്കളെല്ലാം നിങ്ങള്‍ക്ക് അനുവദിക്കപ്പെട്ടിരിക്കുന്നു. അല്ലാഹു നിങ്ങള്‍ക്ക് നല്‍കിയ വിദ്യ ഉപയോഗിച്ച് നായാട്ട് പരിശീലിപ്പിക്കാറുള്ള രീതിയില്‍ നിങ്ങള്‍ പഠിപ്പിച്ചെടുത്ത ഏതെങ്കിലും വേട്ടമൃഗം നിങ്ങള്‍ക്ക് വേണ്ടി പിടിച്ച് കൊണ്ടുവന്നതില്‍ നിന്ന് നിങ്ങള്‍ തിന്നുകൊള്ളുക. ആ ഉരുവിന്‍റെ മേല്‍ നിങ്ങള്‍ അല്ലാഹുവിന്‍റെ നാമം ഉച്ചരിക്കുകയും ചെയ്യുക. നിങ്ങള്‍ അല്ലാഹുവെ സൂക്ഷിക്കുക. തീര്‍ച്ചയായും അല്ലാഹു അതിവേഗം കണക്ക് നോക്കുന്നവനാകുന്നു.",

    "ml": "എല്ലാ നല്ല വസ്തുക്കളും ഇന്ന് നിങ്ങള്‍ക്ക് അനുവദിക്കപ്പെട്ടിരിക്കുന്നു. വേദം നല്‍കപ്പെട്ടവരുടെ ഭക്ഷണം നിങ്ങള്‍ക്ക് അനുവദനീയമാണ്‌. നിങ്ങളുടെ ഭക്ഷണം അവര്‍ക്കും അനുവദനീയമാണ്‌. സത്യവിശ്വാസിനികളില്‍ നിന്നുള്ള പതിവ്രതകളായ സ്ത്രീകളും, നിങ്ങള്‍ക്ക് മുമ്പ് വേദം നല്‍കപ്പെട്ടവരില്‍ നിന്നുള്ള പതിവ്രതകളായ സ്ത്രീകളും - നിങ്ങള വര്‍ക്ക് വിവാഹമൂല്യം നല്‍കിക്കഴിഞ്ഞിട്ടുണ്ടെങ്കില്‍ - (നിങ്ങള്‍ക്ക് അനുവദിക്കപ്പെട്ടിരിക്കുന്നു.) നിങ്ങള്‍ വൈവാഹിക ജീവിതത്തില്‍ ഒതുങ്ങി നില്‍ക്കുന്നവരായിരിക്കണം. വ്യഭിചാരത്തില്‍ ഏര്‍പെടുന്നവരാകരുത്‌. രഹസ്യവേഴ്ചക്കാരെ സ്വീകരിക്കുന്നവരുമാകരുത്‌. സത്യവിശ്വാസത്തെ ആരെങ്കിലും തള്ളിക്കളയുന്ന പക്ഷം അവന്‍റെ കര്‍മ്മം നിഷ്ഫലമായിക്കഴിഞ്ഞു. പരലോകത്ത് അവന്‍ നഷ്ടം പറ്റിയവരുടെ കൂട്ടത്തിലായിരിക്കുകയും ചെയ്യും.",

    "ml": "സത്യവിശ്വാസികളേ, നിങ്ങള്‍ നമസ്കാരത്തിന് ഒരുങ്ങിയാല്‍, നിങ്ങളുടെ മുഖങ്ങളും, മുട്ടുവരെ രണ്ടുകൈകളും കഴുകുകയും, നിങ്ങളുടെ തല തടവുകയും നെരിയാണിവരെ രണ്ട് കാലുകള്‍ കഴുകുകയും ചെയ്യുക. നിങ്ങള്‍ ജനാബത്ത് (വലിയ അശുദ്ധി) ബാധിച്ചവരായാല്‍ നിങ്ങള്‍ (കുളിച്ച്‌) ശുദ്ധിയാകുക. നിങ്ങള്‍ രോഗികളാകുകയോ യാത്രയിലാകുകയോ ചെയ്താല്‍, അല്ലെങ്കില്‍ നിങ്ങളിലൊരാള്‍ മലമൂത്രവിസര്‍ജ്ജനം കഴിഞ്ഞ് വരികയോ, നിങ്ങള്‍ സ്ത്രീകളുമായി സംസര്‍ഗം നടത്തുകയോ ചെയ്തിട്ട് നിങ്ങള്‍ക്ക് വെള്ളം കിട്ടിയില്ലെങ്കില്‍ ശുദ്ധമായ ഭൂമുഖം തേടിക്കൊള്ളുക. എന്നിട്ട് അതുകൊണ്ട് നിങ്ങളുടെ മുഖവും കൈകളും തടവുക. നിങ്ങള്‍ക്ക് ഒരു ബുദ്ധിമുട്ടും വരുത്തിവെക്കണമെന്ന് അല്ലാഹു ഉദ്ദേശിക്കുന്നില്ല. എന്നാല്‍ നിങ്ങളെ ശുദ്ധീകരിക്കണമെന്നും, തന്‍റെ അനുഗ്രഹം നിങ്ങള്‍ക്ക് പൂര്‍ത്തിയാക്കിത്തരണമെന്നും അവന്‍ ഉദ്ദേശിക്കുന്നു. നിങ്ങള്‍ നന്ദിയുള്ളവരായേക്കാം.",

const SKEY = "quran-reader-settings";
const CHECKS = ["show-ar", "show-ml", "show-tf", "cont"];
let fontSize = 18, reciterId = "ghamdy";

function loadSettings() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } }
function saveSettings() {
  const s = loadSettings();
  Object.assign(s, { fontSize, reciterId, repeat: $("repeat").value });
  CHECKS.forEach(id => s[id] = $(id) ? $(id).checked : true);
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
}
function applySettings() {
  const s = loadSettings();
  if (s.fontSize) { fontSize = s.fontSize; document.documentElement.style.setProperty("--fs", fontSize + "px"); $("fs-label").textContent = fontSize; }
  CHECKS.forEach(id => { if ($(id) && id in s) $(id).checked = s[id]; });
  if (s.repeat) $("repeat").value = s.repeat;
}

const RECITERS = [
  { id: "ghamdy",   name: "സഅദ് അൽ ഗാമിദി",        base: "https://everyayah.com/data/Ghamadi_40kbps" },
  { id: "ayyoub",   name: "മുഹമ്മദ് അയ്യൂബ്",       base: "https://everyayah.com/data/Muhammad_Ayyoub_64kbps" },
  { id: "bafsar",   name: "അബ്ദുല്ല ബസ്ഫർ",        base: "https://everyayah.com/data/Abdullah_Basfar_64kbps" },
  { id: "hudhaify", name: "അലി ഹുദൈഫി",            base: "https://everyayah.com/data/Hudhaify_64kbps" },
  { id: "muaiqly",  name: "മാഹിർ അൽ മുഅയ്ഖ്‌ലി", base: "https://everyayah.com/data/Maher_AlMuaiqly_64kbps" },
  { id: "alili",    name: "അസീസ് അലീലി",           base: "https://everyayah.com/data/aziz_alili_128kbps" }
];

const pad3 = x => String(x).padStart(3, "0");
const currentReciter = () => RECITERS.find(r => r.id === reciterId) || RECITERS[0];
const audioUrl = n => currentReciter().base.replace(/\/*$/, "/") + pad3(SURAH) + pad3(n) + ".mp3";

function changeReciter(id) { reciterId = id; saveSettings(); }
function initReciters() {
  const sel = $("reciter");
  if(!sel) return;
  sel.innerHTML = RECITERS.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  const saved = loadSettings().reciterId;
  reciterId = (RECITERS.find(r => r.id === saved) || RECITERS[0]).id;
  sel.value = reciterId;
}

const KIND_NAME = { ar: "ആയത്ത്", ml: "സാരം", tf: "വിവരണം" };

function buildPage() {
  $("verses").innerHTML = VERSES.map(v => {
    const vNum = v.n;
    return `
    <div class="verse" id="verse-${vNum}">
      <div class="vhead"><span>ആയത്ത് ${SURAH}: ${pad3(vNum)}</span></div>
      <div class="item it-ar" id="item-ar-${vNum}"><div class="row rtl">
        <button class="play-btn" id="btn-ar-${vNum}" onclick="toggleItem('ar', ${vNum})">▶</button>
        <p class="text ar" lang="ar" dir="rtl">${v.ar}</p></div></div>
      ${v.ml ? `<div class="item it-ml" id="item-ml-${vNum}"><div class="row">
        <button class="play-btn" id="btn-ml-${vNum}" onclick="toggleItem('ml', ${vNum})">▶</button>
        <p class="text"><span class="tag">സാരം:</span>${v.ml}</p></div></div>` : ""}
      ${v.tf ? `<button class="small-btn tf-btn" id="tgl-${vNum}" onclick="toggleTafseer(${vNum})">വിവരണം</button>
        <div class="item it-tf hidden" id="item-tf-${vNum}"><div class="row">
        <button class="play-btn" id="btn-tf-${vNum}" onclick="toggleItem('tf', ${vNum})">▶</button>
        <p class="text"><span class="pl">${v.tf}</span></p></div></div>` : ""}
    </div>`;
  }).join("");
}

function changeFont(d) {
  fontSize = Math.min(40, Math.max(12, fontSize + d));
  document.documentElement.style.setProperty("--fs", fontSize + "px");
  $("fs-label").textContent = fontSize; saveSettings();
}

function setTafseerVisible(n, show) {
  const b = $("item-tf-" + n), t = $("tgl-" + n);
  if (!b) return; b.classList.toggle("hidden", !show); if (t) t.classList.toggle("open", show);
}

function toggleTafseer(n) {
  const willShow = $("item-tf-" + n).classList.contains("hidden");
  setTafseerVisible(n, willShow);
}

function applyDisplay() {
  const on = id => $(id) ? $(id).checked : true;
  document.body.classList.toggle("hide-ar", !on("show-ar"));
  document.body.classList.toggle("hide-ml", !on("show-ml"));
  document.body.classList.toggle("hide-tf", !on("show-tf"));
  VERSES.forEach(v => { if (v.tf) setTafseerVisible(v.n, on("show-tf")); });
  saveSettings();
}

let token = 0, activeKey = null, currentAudio = null, continuous = false, curLabel = "", curKind = "ml";

function mark(key) {
  clearMark(); activeKey = key;
  const btn = $("btn-" + key), item = $("item-" + key);
  if (btn) { btn.textContent = "■"; btn.classList.add("playing"); }
  if (item) { item.classList.add("reading"); item.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function clearMark() {
  if (!activeKey) return;
  const btn = $("btn-" + activeKey), item = $("item-" + activeKey);
  if (btn) { btn.textContent = "▶"; btn.classList.remove("playing"); }
  if (item) item.classList.remove("reading");
  activeKey = null;
}

function stopAll() {
  token++; continuous = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  clearMark();
  const masterBtn = $("master");
  if (masterBtn) { masterBtn.textContent = "കേൾക്കാം"; masterBtn.classList.remove("playing"); }
  if ($("status")) $("status").textContent = "";
}

function playArabic(n, my, done) {
  if (my !== token) return;
  const audio = new Audio();
  audio.preload = "auto"; currentAudio = audio;
  audio.onended = () => { if (my === token) done(); };
  audio.onerror = () => done();
  const rawUrl = audioUrl(n);
  if ($("status")) $("status").textContent = curLabel + " · " + currentReciter().name;
  Promise.resolve(typeof window.cachedSrc === 'function' ? window.cachedSrc(rawUrl) : rawUrl).then(u => {
    if (my !== token) return;
    audio.src = u;
    audio.play().catch(() => done());
  }).catch(() => done());
}

function speakMalayalam(text, my, done) {
  if (!text) { done(); return; }
  if (!window.speechSynthesis) { done(); return; }
  window.speechSynthesis.cancel();
  if ($("status")) $("status").textContent = curLabel;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ml-IN"; u.rate = 0.9;
  u.onend = () => { if (my === token) done(); };
  u.onerror = () => { if (my === token) done(); };
  window.speechSynthesis.speak(u);
}

function playItem(kind, n, my, done) {
  curKind = kind;
  curLabel = "ആയത്ത് " + n + " – " + KIND_NAME[kind];
  if ($("status")) $("status").textContent = curLabel;
  if (kind === "ar") {
    const total = +$("repeat").value || 1;
    const loop = k => {
      if (my !== token) return;
      playArabic(n, my, () => (k < total ? loop(k + 1) : done()));
    };
    loop(1);
  } else {
    const vObj = VERSES.find(v => v.n === n) || VERSES[0];
    if (vObj && vObj[kind]) {
      speakMalayalam(vObj[kind], my, done);
    } else {
      done();
    }
  }
}

function toggleItem(kind, n) {
  const key = kind + "-" + n;
  if (activeKey === key) { stopAll(); return; }
  stopAll();
  const my = token;
  mark(key);
  playItem(kind, n, my, () => { if (my === token) stopAll(); });
}

function fullQueue() {
  const kinds = ["ar", "ml", "tf"].filter(k => $("show-" + k) && $("show-" + k).checked);
  const queue = [];
  VERSES.forEach(v => kinds.forEach(k => { if (k !== "ar" && !v[k]) return; queue.push({ kind: k, n: v.n }); }));
  return queue;
}

function runQueue(queue, startWithBm) {
  const my = token;
  const masterBtn = $("master");
  masterBtn.textContent = "നിർത്തുക"; masterBtn.classList.add("playing");
  
  const step = i => {
    if (my !== token) return;
    if (i >= queue.length) { stopAll(); return; }
    const item = queue[i];
    mark(item.kind + "-" + item.n);
    if (item.kind === 'bm') {
      if (typeof playBismillah === 'function') {
        playBismillah(my, () => { if (my === token) step(i + 1); });
      } else {
        step(i + 1);
      }
    } else {
      playItem(item.kind, item.n, my, () => { if (my === token) step(i + 1); });
    }
  };
  step(0);
}

function toggleContinuous() {
  const masterBtn = $("master");
  if (masterBtn && masterBtn.classList.contains('playing')) {
    stopAll();
    return;
  }
  stopAll();
  continuous = true;
  const q = fullQueue();
  if (!q.length) { stopAll(); return; }
  
  const hasVerse1 = VERSES.length && VERSES[0].n === 1;
  const arChecked = $("show-ar") ? $("show-ar").checked : true;
  if (hasVerse1 && SURAH !== 1 && SURAH !== 9 && arChecked && typeof playBismillah === 'function') {
    runQueue([{ kind: 'bm', n: 0 }].concat(q), true);
  } else {
    runQueue(q, false);
  }
}

const controlsEl = $("controls"), optBtn = $("opt-toggle"), panelEl = $("panel");
function togglePanel(e) {
  e.stopPropagation();
  const isOpen = panelEl.style.display === 'block' || panelEl.classList.contains('open');
  if (isOpen) {
    panelEl.style.display = 'none';
    panelEl.classList.remove('open');
    if (controlsEl) controlsEl.classList.remove('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▾';
  } else {
    panelEl.style.display = 'block';
    panelEl.classList.add('open');
    if (controlsEl) controlsEl.classList.add('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▴';
  }
}

document.addEventListener('click', function(e) {
  if (controlsEl && !controlsEl.contains(e.target)) {
    panelEl.style.display = 'none';
    panelEl.classList.remove('open');
    controlsEl.classList.remove('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▾';
  }
});

document.addEventListener("DOMContentLoaded", () => {
  const bismiDiv = $("bismi-container");
  const hasVerse1 = VERSES.length && VERSES[0].n === 1;
  if (bismiDiv) {
    if (!hasVerse1 && SURAH !== 1 && SURAH !== 9) {
      bismiDiv.remove();
    }
  }
});

buildPage(); initReciters(); applySettings(); applyDisplay();
</script>
