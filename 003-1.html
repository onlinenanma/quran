<style>
:root{--fs:18px;--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--acc:#1d5240;--soft:rgba(212,175,55,.16)}

*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{overflow-x:hidden;font-family:"Noto Sans Malayalam",sans-serif;margin:0;padding:0 12px 40px;color:var(--ink);background:var(--paper);line-height:1.8}
body>*{max-width:1000px;margin-left:auto;margin-right:auto}
body>.hero{max-width:none;margin:0 -12px;text-align:center;color:#fff;padding:14px 0 16px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:500;line-height:1.4;margin-top:4px}
.controls{position:sticky;top:0;z-index:10;background:var(--card);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-top:-30px;margin-bottom:16px}
.banner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px}
.banner-row{display:flex;justify-content:center;align-items:center;gap:8px}
.panel{display:none;position:absolute;left:-2px;right:-2px;top:100%;background:var(--card);border:2px solid var(--gold);border-top:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.15);padding:14px 14px 6px;max-height:75vh;overflow-y:auto}
.controls.open .panel{display:block}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.ctl-title{font-size:13px;color:var(--muted);font-weight:600}
.opt{font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--green2)}
.opt-sel,.ai-ask input{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--acc);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.opt-btn,.small-btn{font-family:inherit;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:4px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.opt-btn.open,.small-btn.open{background:var(--green2);color:#fff;border-color:var(--green2)}
.main-btn{font-family:inherit;border:none;background:var(--green2);color:#fff;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.banner .main-btn{padding:7px 20px}
.main-btn.playing{background:#d93025}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fs-group{display:inline-flex;align-items:center;gap:4px}
#fs-label{font-size:13px;color:var(--muted);min-width:24px;text-align:center}
#status{width:100%;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
#status:empty{display:none}
.verse,.item{min-width:0}
.verse{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(12px,3vw,20px);margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed var(--gold)}
.item{padding:4px 6px;border-radius:10px;margin-bottom:4px;border:2px solid transparent;scroll-margin-top:90px}
.item.reading{background:var(--soft);border-color:var(--gold)}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.row.rtl{direction:rtl}
.play-btn{flex:0 0 32px;width:32px;height:32px;border:none;border-radius:50%;background-color:var(--green2);color:#fff;font-size:13px;line-height:32px;padding:0;margin-top:2px;cursor:pointer}
.play-btn.playing{background-color:#d93025}
.text{flex:1;min-width:0;margin:0;text-align:left;line-height:1.7;font-size:var(--fs);overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:12px;color:var(--muted);margin-right:4px}
.pl{white-space:pre-line}
.text.ar{font-size:calc(var(--fs) * 1.5);text-align:right;line-height:2;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}
@media(prefers-color-scheme:dark){.text.ar{color:var(--ink)}}
.hidden{display:none}
.tf-btn{display:block;margin:4px 0 6px 6px}
.it-tf{border-top:1px dashed var(--line);margin-top:2px}
body.hide-ar .it-ar{display:none}
body.hide-ml .it-ml{display:none}
body.hide-tf .it-tf,body.hide-tf .tf-btn{display:none}
.ai-box{margin:24px auto 0;padding:clamp(14px,3vw,22px);border:2px solid var(--gold);border-radius:12px;background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,.06)}
.ai-box h3{margin:16px 0 8px;font-size:calc(var(--fs) * 1.1);color:var(--acc);text-align:center}
.ai-box h3:first-child{margin-top:0}
.ai-box>.main-btn{display:block;margin:0 auto}
.ai-out{margin:10px 0;line-height:1.7;font-size:var(--fs);white-space:pre-line}
.ai-out:empty{display:none}
.q-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.q-btn{font-family:inherit;text-align:left;border:1px solid var(--line);border-top:3px solid var(--gold);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:calc(var(--fs) * .85);cursor:pointer}
.q-btn:hover,.q-btn:focus-visible{background:var(--green2);color:#fff;outline:none}
.ai-ask{display:flex;gap:6px;margin-top:8px}
.ai-ask input{flex:1;min-width:0;padding:8px;font-size:15px}
.quiz-q{margin:12px 0;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.quiz-q p{margin:0 0 6px;font-size:var(--fs)}
.quiz-opt{font-family:inherit;display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:calc(var(--fs) * .9);cursor:pointer}
.quiz-opt.right{background:#e6f4ea;border-color:#188038;color:#123528}
.quiz-opt.wrong{background:#fce8e6;border-color:#d93025;color:#5b1a14}
.quiz-exp{font-size:calc(var(--fs) * .8);color:var(--muted);margin-top:4px}

.topnav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:0 12px}
.topnav .back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.9rem, 3.2vw, 1.05rem);
  font-weight: 500;
  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}
</style>
</head>
