<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>സൂറത്ത് പട്ടിക</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Noto Sans Malayalam",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
 
.banner {
  text-align: center;
  color: #fff;
  padding: 14px 0 16px; /* Removed left/right padding so topnav reaches edges */
  background: 
    radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
    repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
    linear-gradient(160deg,var(--green),var(--green2));
  border-bottom: 4px solid var(--gold);
}
.topnav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-bottom: 8px;
  padding: 0 12px; /* Adds a tiny safe padding from the exact device edge */
}
.topnav .back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.95rem, 3.4vw, 1.1rem);
  font-weight: 500;
  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}
</style>
</head>
<body>
<header class="banner">
<div class="topnav">
  <a class="back" href="https://onlinenanma.github.io/quran/"><span style="font-size: 1.25em;">🏠</span> പ്രധാന താൾ</a>
  <a class="back" href="https://onlinenanma.github.io/quran/surah-index">സൂറത്തുകൾ <span style="font-size: 1.25em;">📖</span></a>
</div>
 
 <h1>സൂറത്തുകൾ</h1></header>

<main class="wrap">
  <input id="q" class="search" type="search" placeholder="സൂറത്ത് തിരയുക (പേര് / നമ്പർ)" aria-label="സൂറത്ത് തിരയുക" />
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>ഒന്നും കണ്ടെത്തിയില്ല</p>
</main>
<footer>© ഖുർആൻ സാരം</footer>

<script>
const BASE = 'https://onlinenanma.github.io/quran/';
const pad = n => String(n).padStart(3, '0');   // 1 -> 001
const SURAHS = [
["അൽ ഫാതിഹ","الفاتحة"],["അൽ ബഖറഃ","البقرة"],["ആലു ഇംറാൻ","آل عمران"],["അന്നിസാഅ്","النساء"],
["അൽ മാഇദഃ","المائدة"],["അൽ അൻആം","الأنعام"],["അൽ അഅ്റാഫ്","الأعراف"],["അൽ അൻഫാൽ","الأنفال"],
["അത്തൗബഃ","التوبة"],["യൂനുസ്","يونس"],["ഹൂദ്","هود"],["യൂസുഫ്","يوسف"],
["അർറഅ്ദ്","الرعد"],["ഇബ്റാഹീം","ഇബ്റാഹീം"],["അൽ ഹിജ്റ്","الحجر"],["അന്നഹ്ൽ","النحل"],
["അൽ ഇസ്റാഅ്","الإسراء"],["അൽ കഹ്ഫ്","الكهف"],["മർയം","മര്യമ്"],["ത്വാഹാ","طه"],
["അൽ അമ്പിയാഅ്","الأنبياء"],["അൽ ഹജ്ജ്","الحج"],["അൽ മുഅ്മിനൂൻ","المؤمنون"],["അന്നൂർ","النور"],
["അൽ ഫുർഖാൻ","الفرقان"],["അശ്ശുഅറാഅ്","الشعراء"],["അന്നംല്","النمل"],["അൽ ഖസ്വസ്വ്","القصص"],
["അൽ അൻകബൂത്ത്","العنكبوت"],["അർറൂം","الروم"],["ലുഖ്മാൻ","لقمان"],["അസ്സജ്ദഃ","السجدة"],
["അൽ അഹ്സാബ്","الأحزاب"],["സബഅ്","سبأ"],["ഫാത്വിർ","ഫاطر"],["യാസീൻ","يس"],
["അസ്സ്വാഫ്ഫാത്ത്","الصافات"],["സ്വാദ്","ص"],["അസ്സുമർ","الزمر"],["ഗാഫിർ","غافر"],
["ഫുസ്സിലത്ത്","فصلت"],["അശ്ശൂറാ","الشورى"],["അസ്സുഖ്റുഫ്","الزخرف"],["അദ്ദുഖാൻ","الدخان"],
["അൽ ജാസിയഃ","الجاثية"],["അൽ അഹ്ഖാഫ്","الأحقاف"],["മുഹമ്മദ്","محمد"],["അൽ ഫത്ഹ്","الفتح"],
["അൽ ഹുജുറാത്ത്","الحجرات"],["ഖാഫ്","ق"],["അദ്ദാരിയാത്ത്","الذاريات"],["അത്ത്വൂർ","الطور"],
["അന്നജ്മ്","النجم"],["അൽ ഖമർ","القمر"],["അർറഹ്മാൻ","الرحمن"],["അൽ വാഖിഅഃ","الواقعة"],
["അൽ ഹദീദ്","الحديد"],["അൽ മുജാദലഃ","المجادلة"],["അൽ ഹശ്ർ","الحشر"],["അൽ മുംതഹനഃ","الممتحنة"],
["അസ്സ്വഫ്ഫ്","الصف"],["അൽ ജുമുഅഃ","الجُمُعة"],["അൽ മുനാഫിഖൂൻ","المنافقون"],["അത്തഗാബുൻ","التغابن"],
["അത്ത്വലാഖ്","الطلاق"],["അത്തഹ്രീം","التحريم"],["അൽ മുൽക്","الملك"],["അൽ ഖലം","القلم"],
["അൽ ഹാഖ്ഖഃ","الحاقة"],["അൽ മആരിജ്","المعارج"],["നൂഹ്","نوح"],["അൽ ജിന്ന്","الجن"],
["അൽ മുസ്സമ്മിൽ","المزمل"],["അൽ മുദ്ദസ്സിർ","المدثر"],["അൽ ഖിയാമഃ","القيامة"],["അൽ ഇൻസാൻ","الإنسان"],
["അൽ മുർസലാത്ത്","المرسلات"],["അന്നബഅ്","النبأ"],["അന്നാസിആത്ത്","النازعات"],["അബസ","عبس"],
["അത്തക്വീർ","التكوير"],["അൽ ഇൻഫിത്വാർ","الانفطار"],["അൽ മുത്വഫ്ഫിഫീൻ","المطففين"],["അൽ ഇൻശിഖാഖ്","الانشقاق"],
["അൽ ബുറൂജ്","البروج"],["അത്ത്വാരിഖ്","الطارق"],["അൽ അഅ്ലാ","الأعلى"],["അൽ ഗാശിയഃ","الغاشية"],
["അൽ ഫജ്ർ","الفجر"],["അൽ ബലദ്","البلد"],["അശ്ശംസ്","الشمس"],["അല്ലൈൽ","الليل"],
["അള്ളുഹാ","الضحى"],["അൽ ഇൻശിറാഹ്","الشرح"],["അത്തീൻ","التين"],["അൽ അലഖ്","العلق"],
["അൽ ഖദ്ർ","القدر"],["അൽ ബയ്യിനഃ","البينة"],["അസ്സൽസലഃ","الزلزلة"],["അൽ ആദിയാത്ത്","العاديات"],
["അൽ ഖാരിഅഃ","القارعة"],["അത്തകാസുർ","التكاثر"],["അൽ അസ്ർ","العصر"],["അൽ ഹുമസഃ","الهمزة"],
["അൽ ഫീൽ","الفيل"],["ഖുറൈശ്","قريش"],["അൽ മാഊൻ","الماعون"],["അൽ കൗസർ","الكوثر"],
["അൽ കാഫിറൂൻ","الكافرون"],["അന്നസ്ർ","النصر"],["അൽ മസദ്","المسد"],["അൽ ഇഖ്ലാസ്","الإخلاص"],
["അൽ ഫലഖ്","الفلق"],["അന്നാസ്","الناس"]
];

const grid = document.getElementById('grid'), empty = document.getElementById('empty');
SURAHS.forEach(([ml, ar], i) => {
  const n = i + 1;
  const a = document.createElement('a');
  a.className = 'sr'; 
  a.href = BASE + pad(n); 
  
  a.target = '_parent';

  a.dataset.s = (n + ' ' + ml + ' ' + ar).toLowerCase();
  a.innerHTML = `<span class="no">${n}</span><span class="nm"><b>${ml}</b><span class="ar">${ar}</span></span>`;
  grid.appendChild(a);
});

document.getElementById('q').addEventListener('input', e => {
  const t = e.target.value.trim().toLowerCase(); let shown = 0;
  grid.querySelectorAll('.sr').forEach(a => {
    const ok = !t || a.dataset.s.includes(t); a.hidden = !ok; if (ok) shown++;
  });
  empty.hidden = shown > 0;
});
</script>
<script src="https://onlinenanma.github.io/quran/site.js" defer></script>
</body>
</html>
