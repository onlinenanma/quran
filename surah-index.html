<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>സൂറത്ത് പട്ടിക</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Noto Sans Malayalam",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
.banner{text-align:center;color:#fff;padding:14px 0 16px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.banner h1{font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:500;line-height:1.4;margin-top:4px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 12px 40px}
.search{display:block;width:100%;font-family:inherit;font-size:1rem;padding:11px 14px;margin-bottom:16px;border:2px solid var(--gold);border-radius:10px;background:var(--card);color:var(--ink)}
.search:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sr{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:10px}
.sr:hover,.sr:focus-visible{background:var(--green2);color:#fff;outline:none}
.no{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green2);color:#fff;font-weight:700;font-size:.85rem}
.sr:hover .no,.sr:focus-visible .no{background:var(--gold);color:var(--green)}
.nm{display:flex;flex-direction:column;min-width:0;line-height:1.4}
.nm b{font-weight:600;font-size:.95rem}
.nm .ar{font-family:"Noto Naskh Arabic",serif;font-size:1.05rem;color:var(--muted)}
.sr:hover .ar,.sr:focus-visible .ar{color:#fff}
.nm .mn{font-size:.8rem;color:var(--muted)}
.sr:hover .mn,.sr:focus-visible .mn{color:#fff}
.empty{text-align:center;color:var(--muted);padding:20px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}

.topnav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:0 12px}
.topnav .back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.95rem, 3.4vw, 1.1rem);
  font-weight: 500;
  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}
</style>
</head>
<body>
<header class="banner">
 <div class="topnav">
    <a class="back" href="https://quranmeaning.app/"><span style="font-size: 1.25em;">🏠</span>പ്രധാനതാൾ</a>
    <a class="back" href="https://quranmeaning.app/surah-index">സൂറത്തുകൾ<span style="font-size: 1.25em;">📖</span></a>
 </div>
 
 <h1>സൂറത്തുകൾ</h1>
</header>

<main class="wrap">
 <input id="q" class="search" type="search" placeholder="സൂറത്ത് തിരയുക (പേര് / നമ്പർ)" aria-label="സൂറത്ത് തിരയുക" />
 <div id="grid" class="grid"></div>
 <p id="empty" class="empty" hidden>ഒന്നും കണ്ടെത്തിയില്ല</p>
</main>
<footer>© ഖുർആൻ സാരം</footer>

<script>
const BASE = 'https://quranmeaning.app/';
const pad = n => String(n).padStart(3, '0');   // 1 -> 001
const SURAHS = [
["അൽ ഫാതിഹ","الفاتحة"],["അൽ ബഖറഃ","البقرة"],["ആലു ഇംറാൻ","آل عمران"],["അന്നിസാഅ്","النساء"],
["അൽ മാഇദഃ","المائدة"],["അൽ അൻആം","الأنعام"],["അൽ അഅ്റാഫ്","الأعراف"],["അൽ അൻഫാൽ","الأنفال"],
["അത്തൗബഃ","التوبة"],["യൂനുസ്","يونس"],["ഹൂദ്","هود"],["യൂസുഫ്","يوسف"],
["അർറഅ്ദ്","الرعد"],["ഇബ്റാഹീം","إبراهيم"],["അൽ ഹിജ്റ്","الحجر"],["അന്നഹ്ൽ","النحل"],
["അൽ ഇസ്റാഅ്","الإسراء"],["അൽ കഹ്ഫ്","الكهف"],["മർയം","مريم"],["ത്വാഹാ","طه"],
["അൽ അമ്പിയാഅ്","الأنبياء"],["അൽ ഹജ്ജ്","الحج"],["അൽ മുഅ്മിനൂൻ","المؤمنون"],["അന്നൂർ","النور"],
["അൽ ഫുർഖാൻ","الفرقان"],["അശ്ശുഅറാഅ്","الشعراء"],["അന്നംല്","النمل"],["അൽ ഖസ്വസ്വ്","القصص"],
["അൽ അൻകബൂത്ത്","العنكبوت"],["അർറൂം","الروم"],["ലുഖ്മാൻ","لقمان"],["അസ്സജ്ദഃ","السجدة"],
["അൽ അഹ്സാബ്","الأحزاب"],["സബഅ്","سبأ"],["ഫാത്വിർ","فاطر"],["യാസീൻ","يس"],
["അസ്സ്വാഫ്ഫാത്ത്","الصافات"],["സ്വാദ്","ص"],["അസ്സുമർ","الزمر"],["ഗാഫിർ","غافر"],
["ഫുസ്സിലത്ത്","فصلت"],["അശ്ശൂറാ","الشورى"],["അസ്സുഖ്റുഫ്","الزخرف"],["അദ്ദുഖാൻ","الدخان"],
["അൽ ജാസിയഃ","الجاثية"],["അൽ അഹ്ഖാഫ്","الأحقاف"],["മുഹമ്മദ്","محمد"],["അൽ ഫത്ഹ്","الفتح"],
["അൽ ഹുജുറാത്ത്","الحجرات"],["ഖാഫ്","ق"],["അദ്ദാരിയാത്ത്","الذاريات"],["അത്ത്വൂർ","الطور"],
["അന്നജ്മ്","النجم"],["അൽ ഖമർ","القمر"],["അർറഹ്മാൻ","الرحمن"],["അൽ വാഖിഅഃ","الواقعة"],
["അൽ ഹദീദ്","الحديد"],["അൽ മുജാദലഃ","المجادلة"],["അൽ ഹശ്ർ","الحشر"],["അൽ മുംതഹനഃ","الممتحنة"],
["അസ്സ്വഫ്ഫ്","الصف"],["അൽ ജുമുഅഃ","الجُمُعة"],["അൽ മുനാഫിഖൂൻ","المنافقون"],["അത്തഗാബുൻ","التغابن"],
["അത്ത്വലാഖ്","الطلاق"],["അത്തഹ്രീം","التحريم"],["അൽ മുൽക്","الملك"],["അൽ ഖലം","القلم"],
["അൽ ഹാഖ്ഖഃ","الحاقة"],["അൽ മആരിജ്","المعارج"],["നൂഹ്","نوح"],["അൽ ജിന്ന്","الجن"],
["അൽ മുസ്സമ്മിൽ","المزمل"],["അൽ മുദ്ദസ്സിർ","المدثر"],["അൽ ഖിയാമഃ","القيامة"],["അൽ ഇൻസാൻ","الإنسان"],
["അൽ മുർസലാത്ത്","المرسلات"],["അന്നബഅ്","النبأ"],["അന്നാസിആത്ത്","النازعات"],["അബസ","عبس"],
["അത്തക്വീർ","التكوير"],["അൽ ഇൻഫിത്വാർ","الانفطار"],["അൽ മുത്വഫ്ഫിഫീൻ","المطففين"],["അൽ ഇൻശിഖാഖ്","الانشقاق"],
["അൽ ബുറൂജ്","البروج"],["അത്ത്വാരിഖ്","الطارق"],["അൽ അഅ്ലാ","الأعلى"],["അൽ ഗാശിയഃ","الغاشية"],
["അൽ ഫജ്ർ","الفجر"],["അൽ ബലദ്","البلد"],["അശ്ശംസ്","الشمس"],["അല്ലൈൽ","الليل"],
["അള്ളുഹാ","الضحى"],["അൽ ഇൻശിറാഹ്","الشرح"],["അത്തീൻ","التين"],["അൽ അലഖ്","العلق"],
["അൽ ഖദ്ർ","القدر"],["അൽ ബയ്യിനഃ","البينة"],["അസ്സൽസലഃ","الزلزلة"],["അൽ ആദിയാത്ത്","العاديات"],
["അൽ ഖാരിഅഃ","القارعة"],["അത്തകാസുർ","التكاثر"],["അൽ അസ്ർ","العصر"],["അൽ ഹുമസഃ","الهمزة"],
["അൽ ഫീൽ","الفيل"],["ഖുറൈശ്","قريش"],["അൽ മാഊൻ","الماعون"],["അൽ കൗസർ","الكوثر"],
["അൽ കാഫിറൂൻ","الكافرون"],["അന്നസ്ർ","النصر"],["അൽ മസദ്","المسد"],["അൽ ഇഖ്ലാസ്","الإخلاص"],
["അൽ ഫലഖ്","الفلق"],["അന്നാസ്","الناس"]
];

const SURAH_LAT = ["Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const SURAH_EN = ["The Opening","The Cow","Family of Imran","The Women","The Table Spread","The Cattle","The Heights","The Spoils of War","The Repentance","Jonah","Hud","Joseph","The Thunder","Abraham","The Rocky Tract","The Bee","The Night Journey","The Cave","Mary","Ta-Ha","The Prophets","The Pilgrimage","The Believers","The Light","The Criterion","The Poets","The Ant","The Stories","The Spider","The Romans","Luqman","The Prostration","The Combined Forces","Sheba","The Originator","Ya-Sin","Those Ranged in Ranks","Sad","The Groups","The Forgiver","Explained in Detail","The Consultation","The Gold Adornments","The Smoke","The Crouching","The Wind-Curved Sandhills","Muhammad","The Victory","The Rooms","Qaf","The Winnowing Winds","The Mount","The Star","The Moon","The Most Merciful","The Inevitable","The Iron","The Pleading Woman","The Exile","The Woman to be Examined","The Ranks","The Congregation","The Hypocrites","The Mutual Loss and Gain","The Divorce","The Prohibition","The Sovereignty","The Pen","The Reality","The Ascending Stairways","Noah","The Jinn","The Enshrouded One","The Cloaked One","The Resurrection","The Human","The Emissaries","The Tidings","Those Who Drag Forth","He Frowned","The Overthrowing","The Cleaving","The Defrauding","The Splitting Open","The Mansions of the Stars","The Nightcomer","The Most High","The Overwhelming","The Dawn","The City","The Sun","The Night","The Morning Hours","The Relief","The Fig","The Clot","The Power","The Clear Proof","The Earthquake","The Courser","The Calamity","Competition","The Declining Day","The Traducer","The Elephant","Quraysh","Small Kindnesses","Abundance","The Disbelievers","The Divine Support","The Palm Fiber","Sincerity","The Daybreak","Mankind"];

/* Language chosen on the index page (Google Translate cookie /ml/xx or saved choice) */
let lang = 'ml';
try {
 const m = document.cookie.match(/(?:^|; )googtrans=([^;]*)/);
 const c = m ? decodeURIComponent(m[1]).match(/^\/[^/]+\/(.+)$/) : null;
 lang = (c && c[1]) || localStorage.getItem('quran-lang') || 'ml';
} catch (e) {}
lang = String(lang).toLowerCase();
if (lang === 'ml' || lang.indexOf('ml-') === 0) lang = 'ml';

const grid = document.getElementById('grid'), empty = document.getElementById('empty');
SURAHS.forEach(([ml, ar], i) => {
 const n = i + 1, lat = SURAH_LAT[i], en = SURAH_EN[i];
 const a = document.createElement('a');
 a.className = 'sr';
 a.href = BASE + pad(n);
 a.target = '_parent';

 let main, sub, extra = '';
 if (lang === 'ml') { main = ml; sub = ar; }
 else if (lang === 'ar') { main = ar; sub = lat; }
 else { main = lat; sub = ar; if (lang === 'en') extra = `<span class="mn">${en}</span>`; }

 /* names stay exactly as written, Google Translate must not alter them */
 if (lang !== 'ml') a.classList.add('notranslate');

 a.dataset.s = (n + ' ' + ml + ' ' + ar + ' ' + lat + ' ' + en).toLowerCase();
 a.innerHTML = `<span class="no">${n}</span><span class="nm"><b>${main}</b>${extra}<span class="ar">${sub}</span></span>`;
 grid.appendChild(a);
});

document.getElementById('q').addEventListener('input', e => {
 const t = e.target.value.trim().toLowerCase(); let shown = 0;
 grid.querySelectorAll('.sr').forEach(a => {
  const ok = !t || a.dataset.s.includes(t); a.hidden = !ok; if (ok) shown++;
 });
 empty.hidden = shown > 0;
});
</script>
<script src="https://quranmeaning.app/site.js" defer></script>
</body>
</html>
