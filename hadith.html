<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ഹദീസുകൾ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--hfs:18px}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Noto Sans Malayalam",sans-serif;background:var(--paper);color:var(--ink);line-height:1.9}
.banner{text-align:center;color:#fff;padding:14px 0 16px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.banner h1{font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:500;line-height:1.4;margin-top:4px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 12px 40px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(14px,3vw,26px);box-shadow:0 4px 15px rgba(0,0,0,.06);margin-bottom:18px}
h2{color:var(--green2);font-size:1.15rem;text-align:center;margin-bottom:12px}
@media(prefers-color-scheme:dark){h2{color:var(--gold)}}

.controls{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.control-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.controls label{font-weight:600;color:var(--green2);display:flex;flex-direction:column;gap:4px;font-size:0.9rem;flex:1;min-width:120px}
@media(prefers-color-scheme:dark){.controls label{color:var(--gold)}}

input,select{font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--green2);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
button{font-family:inherit;font-size:.95rem;font-weight:600;padding:10px 18px;border:none;border-radius:20px;background:var(--green2);color:#fff;cursor:pointer;flex:1;min-width:110px}
button.alt{background:transparent;color:var(--green2);border:1px solid var(--green2)}
@media(prefers-color-scheme:dark){button.alt{color:var(--gold);border-color:var(--gold)}}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.ref{text-align:center;font-weight:700;color:var(--green2);margin-bottom:8px;font-size:1.1rem}
@media(prefers-color-scheme:dark){.ref{color:var(--gold)}}
.ar{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:calc(var(--hfs) * 1.35);line-height:2.2;color:var(--green2);margin-bottom:16px;white-space:pre-line;overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){.ar{color:var(--ink)}}

/* Malayalam Box Styling */
.ml-box{background:var(--paper);border:1px solid var(--gold);border-radius:8px;padding:14px;margin-bottom:14px}
.ml-title{font-weight:700;color:var(--green2);font-size:.95rem;margin-bottom:6px}
@media(prefers-color-scheme:dark){.ml-title{color:var(--gold)}}
.ml-text{font-size:var(--hfs);line-height:1.9;white-space:pre-line;overflow-wrap:anywhere}

.en{font-size:var(--hfs);line-height:1.9;margin-top:12px;white-space:pre-line;overflow-wrap:anywhere;color:var(--muted)}
.err{color:#d93025;text-align:center;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}

.topnav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:0 12px}
.topnav .back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.95rem, 3.4vw, 1.1rem);
  font-weight: 500;
  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}
</style>
</head>
<body>
<header class="banner">
  <div class="topnav">
    <a class="back" href="https://onlinenanma.github.io/quran/" target="_top"><span style="font-size: 1.25em;">🏠</span>പ്രധാനതാൾ</a>
    <a class="back" href="https://onlinenanma.github.io/quran/surah-index" target="_top">സൂറത്തുകൾ<span style="font-size: 1.25em;">📖 </span></a>
  </div>
  <h1>പ്രവാചക ഹദീസുകൾ</h1>
</header>

<main class="wrap">
  <section class="card">
    <h2>ഹദീസ് തെരഞ്ഞെടുക്കുക</h2>
    <div class="controls">
      <div class="control-row">
        <label style="flex:2;">ഹദീസ് ഗ്രന്ഥം:
          <select id="cSel" onchange="loadHadith()">
            <option value="bukhari">സഹീഹ് അൽ ബുഖാരി (Bukhari)</option>
            <option value="muslim">സഹീഹ് മുസ്ലിം (Muslim)</option>
            <option value="nasai">സുനൻ അന്നുസാഈ (Nasa'i)</option>
            <option value="abudawud">സുനൻ അബൂദാവൂദ് (Abu Dawud)</option>
            <option value="tirmidhi">ജാമഇ അത്തിർമിദി (Tirmidhi)</option>
            <option value="ibnmajah">സുനൻ ഇബ്നുമാജ (Ibn Majah)</option>
            <option value="malik">മുവത്വ ഇമാം മാലിക് (Muwatta Malik)</option>
          </select>
        </label>
        <label style="flex:1;">ഹദീസ് നമ്പർ: <input type="number" id="hNo" min="1" value="1"></label>
      </div>
      <div class="btn-group">
        <button type="button" onclick="loadHadith()">കാണിക്കുക</button>
        <button type="button" class="alt" onclick="step(-1)">◀ മുമ്പത്തേത്</button>
        <button type="button" class="alt" onclick="step(1)">അടുത്തത് ▶</button>
      </div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <div class="ref" id="ref"></div>
    <div class="ar notranslate" id="ar" translate="no">ഹദീസ് ലോഡ് ചെയ്യുന്നു...</div>
    
    <!-- Malayalam Translation Box -->
    <div class="ml-box" id="mlContainer">
      <div class="ml-title">മലയാള തർജ്ജമ:</div>
      <div class="ml-text" id="ml">പരിഭാഷ ലോഡ് ചെയ്യുന്നു...</div>
    </div>

    <hr style="border:0; border-top:1px dashed var(--line); margin:12px 0;">
    <div style="font-weight:600; font-size:.85rem; color:var(--muted)">English Translation:</div>
    <div class="en" id="en"></div>
  </section>
</main>

<footer>© ഖുർആൻ സാരം</footer>

<script>
const $ = id => document.getElementById(id);
let activeReq = 0;

/* Clean HTML tags from API response string */
function cleanText(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html || "";
  return tmp.textContent || tmp.innerText || "";
}

/* Fetch Malayalam translation via MyMemory Translate API */
async function translateToMalayalam(text, reqId) {
  if (!text) { $('ml').textContent = "പരിഭാഷ ലഭ്യമല്ല."; return; }
  
  // Truncate if exceptionally long to fit within free API GET request limits
  const queryText = text.length > 800 ? text.substring(0, 800) + "..." : text;
  
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(queryText)}&langpair=en|ml`);
    if (reqId !== activeReq) return;
    const data = await res.json();
    
    if (data && data.responseData && data.responseData.translatedText) {
      $('ml').textContent = data.responseData.translatedText;
    } else {
      $('ml').textContent = "പരിഭാഷ ലഭ്യമാക്കാൻ സാധിച്ചില്ല.";
    }
  } catch (e) {
    if (reqId === activeReq) $('ml').textContent = "പരിഭാഷ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.";
  }
}

async function loadHadith() {
  const reqId = ++activeReq;
  $('err').textContent = '';
  $('ar').textContent = 'ലോഡ് ചെയ്യുന്നു...';
  $('en').textContent = '';
  $('ml').textContent = 'പരിഭാഷ ലോഡ് ചെയ്യുന്നു...';
  $('ref').textContent = '';

  const collection = $('cSel').value;
  const hadithNo = parseInt($('hNo').value) || 1;

  try {
    // Fetch directly from Fawaz Ahmed Hadith API (Free CDN, no registration required)
    const [resEn, resAr] = await Promise.all([
      fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-${collection}/${hadithNo}.json`),
      fetch(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-${collection}/${hadithNo}.json`)
    ]);

    if (reqId !== activeReq) return;

    const dEn = resEn.ok ? await resEn.json() : null;
    const dAr = resAr.ok ? await resAr.json() : null;

    if (!dEn && !dAr) throw new Error('ഈ ഹദീസ് നമ്പർ ലഭ്യമായില്ല.');

    $('ref').textContent = `${collection.toUpperCase()} — ഹദീസ് #${hadithNo}`;
    
    const arText = dAr && dAr.hadiths ? dAr.hadiths[0].text : 'അറബി പാഠം ലഭ്യമല്ല.';
    const enText = dEn && dEn.hadiths ? cleanText(dEn.hadiths[0].text) : '';

    $('ar').textContent = arText;
    $('en').textContent = enText || 'English translation not available.';

    // Automatically trigger English -> Malayalam translation for the Malayalam box
    if (enText) {
      translateToMalayalam(enText, reqId);
    } else {
      $('ml').textContent = 'പരിഭാഷ ലഭ്യമല്ല.';
    }

  } catch (err) {
    if (reqId === activeReq) {
      $('ar').textContent = '';
      $('ml').textContent = '';
      $('err').textContent = err.message || 'ഹദീസ് വിവരങ്ങൾ ലഭ്യമാക്കാൻ സാധിച്ചില്ല.';
    }
  }
}

function step(d) {
  let val = (parseInt($('hNo').value) || 1) + d;
  if (val < 1) val = 1;
  $('hNo').value = val;
  loadHadith();
}

$('hNo').addEventListener('keydown', e => { if (e.key === 'Enter') loadHadith(); });
window.addEventListener('load', loadHadith);
</script>
<script src="https://onlinenanma.github.io/quran/site.js" defer></script>
</body>
</html>
