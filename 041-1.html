const SKEY = "quran-reader-settings";
const CHECKS = ["show-ar", "show-ml", "show-tf", "cont"];
let fontSize = 18, reciterId = "ghamdy";

function loadSettings() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } }
function saveSettings() {
  const s = loadSettings();
  Object.assign(s, { fontSize, reciterId, repeat: $("repeat").value });
  CHECKS.forEach(id => s[id] = $(id) ? $(id).checked : true);
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
}
function applySettings() {
  const s = loadSettings();
  if (s.fontSize) { fontSize = s.fontSize; document.documentElement.style.setProperty("--fs", fontSize + "px"); $("fs-label").textContent = fontSize; }
  CHECKS.forEach(id => { if ($(id) && id in s) $(id).checked = s[id]; });
  if (s.repeat) $("repeat").value = s.repeat;
}

const RECITERS = [
  { id: "ghamdy",   name: "സഅദ് അൽ ഗാമിദി",        base: "https://everyayah.com/data/Ghamadi_40kbps" },
  { id: "ayyoub",   name: "മുഹമ്മദ് അയ്യൂബ്",       base: "https://everyayah.com/data/Muhammad_Ayyoub_64kbps" },
  { id: "bafsar",   name: "അബ്ദുല്ല ബസ്ഫർ",        base: "https://everyayah.com/data/Abdullah_Basfar_64kbps" },
  { id: "hudhaify", name: "അലി ഹുദൈഫി",            base: "https://everyayah.com/data/Hudhaify_64kbps" },
  { id: "muaiqly",  name: "മാഹിർ അൽ മുഅയ്ഖ്‌ലി", base: "https://everyayah.com/data/Maher_AlMuaiqly_64kbps" },
  { id: "alili",    name: "അസീസ് അലീലി",           base: "https://everyayah.com/data/aziz_alili_128kbps" }
];

const pad3 = x => String(x).padStart(3, "0");
const currentReciter = () => RECITERS.find(r => r.id === reciterId) || RECITERS[0];
const audioUrl = n => currentReciter().base.replace(/\/*$/, "/") + pad3(SURAH) + pad3(n) + ".mp3";

function changeReciter(id) { reciterId = id; saveSettings(); }
function initReciters() {
  const sel = $("reciter");
  if(!sel) return;
  sel.innerHTML = RECITERS.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  const saved = loadSettings().reciterId;
  reciterId = (RECITERS.find(r => r.id === saved) || RECITERS[0]).id;
  sel.value = reciterId;
}

const KIND_NAME = { ar: "ആയത്ത്", ml: "സാരം", tf: "വിവരണം" };

function buildPage() {
  $("verses").innerHTML = VERSES.map(v => {
    const vNum = v.n;
    return `
    <div class="verse" id="verse-${vNum}">
      <div class="vhead"><span>ആയത്ത് ${SURAH}: ${pad3(vNum)}</span></div>
      <div class="item it-ar" id="item-ar-${vNum}"><div class="row rtl">
        <button class="play-btn" id="btn-ar-${vNum}" onclick="toggleItem('ar', ${vNum})">▶</button>
        <p class="text ar" lang="ar" dir="rtl">${v.ar}</p></div></div>
      ${v.ml ? `<div class="item it-ml" id="item-ml-${vNum}"><div class="row">
        <button class="play-btn" id="btn-ml-${vNum}" onclick="toggleItem('ml', ${vNum})">▶</button>
        <p class="text"><span class="tag">സാരം:</span>${v.ml}</p></div></div>` : ""}
      ${v.tf ? `<button class="small-btn tf-btn" id="tgl-${vNum}" onclick="toggleTafseer(${vNum})">വിവരണം</button>
        <div class="item it-tf hidden" id="item-tf-${vNum}"><div class="row">
        <button class="play-btn" id="btn-tf-${vNum}" onclick="toggleItem('tf', ${vNum})">▶</button>
        <p class="text"><span class="pl">${v.tf}</span></p></div></div>` : ""}
    </div>`;
  }).join("");
}

function changeFont(d) {
  fontSize = Math.min(40, Math.max(12, fontSize + d));
  document.documentElement.style.setProperty("--fs", fontSize + "px");
  $("fs-label").textContent = fontSize; saveSettings();
}

function setTafseerVisible(n, show) {
  const b = $("item-tf-" + n), t = $("tgl-" + n);
  if (!b) return; b.classList.toggle("hidden", !show); if (t) t.classList.toggle("open", show);
}

function toggleTafseer(n) {
  const willShow = $("item-tf-" + n).classList.contains("hidden");
  setTafseerVisible(n, willShow);
}

function applyDisplay() {
  const on = id => $(id) ? $(id).checked : true;
  document.body.classList.toggle("hide-ar", !on("show-ar"));
  document.body.classList.toggle("hide-ml", !on("show-ml"));
  document.body.classList.toggle("hide-tf", !on("show-tf"));
  VERSES.forEach(v => { if (v.tf) setTafseerVisible(v.n, on("show-tf")); });
  saveSettings();
}

let token = 0, activeKey = null, currentAudio = null, continuous = false, curLabel = "", curKind = "ml";

function mark(key) {
  clearMark(); activeKey = key;
  const btn = $("btn-" + key), item = $("item-" + key);
  if (btn) { btn.textContent = "■"; btn.classList.add("playing"); }
  if (item) { item.classList.add("reading"); item.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function clearMark() {
  if (!activeKey) return;
  const btn = $("btn-" + activeKey), item = $("item-" + activeKey);
  if (btn) { btn.textContent = "▶"; btn.classList.remove("playing"); }
  if (item) item.classList.remove("reading");
  activeKey = null;
}

function stopAll() {
  token++; continuous = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  clearMark();
  const masterBtn = $("master");
  if (masterBtn) { masterBtn.textContent = "കേൾക്കാം"; masterBtn.classList.remove("playing"); }
  if ($("status")) $("status").textContent = "";
}

function playArabic(n, my, done) {
  if (my !== token) return;
  const audio = new Audio();
  audio.preload = "auto"; currentAudio = audio;
  audio.onended = () => { if (my === token) done(); };
  audio.onerror = () => done();
  const rawUrl = audioUrl(n);
  if ($("status")) $("status").textContent = curLabel + " · " + currentReciter().name;
  Promise.resolve(typeof window.cachedSrc === 'function' ? window.cachedSrc(rawUrl) : rawUrl).then(u => {
    if (my !== token) return;
    audio.src = u;
    audio.play().catch(() => done());
  }).catch(() => done());
}

function speakMalayalam(text, my, done) {
  if (!text) { done(); return; }
  if (!window.speechSynthesis) { done(); return; }
  window.speechSynthesis.cancel();
  if ($("status")) $("status").textContent = curLabel;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ml-IN"; u.rate = 0.9;
  u.onend = () => { if (my === token) done(); };
  u.onerror = () => { if (my === token) done(); };
  window.speechSynthesis.speak(u);
}

function playItem(kind, n, my, done) {
  curKind = kind;
  curLabel = "ആയത്ത് " + n + " – " + KIND_NAME[kind];
  if ($("status")) $("status").textContent = curLabel;
  if (kind === "ar") {
    const total = +$("repeat").value || 1;
    const loop = k => {
      if (my !== token) return;
      playArabic(n, my, () => (k < total ? loop(k + 1) : done()));
    };
    loop(1);
  } else {
    const vObj = VERSES.find(v => v.n === n) || VERSES[0];
    if (vObj && vObj[kind]) {
      speakMalayalam(vObj[kind], my, done);
    } else {
      done();
    }
  }
}

function toggleItem(kind, n) {
  const key = kind + "-" + n;
  if (activeKey === key) { stopAll(); return; }
  stopAll();
  const my = token;
  mark(key);
  playItem(kind, n, my, () => { if (my === token) stopAll(); });
}

function fullQueue() {
  const kinds = ["ar", "ml", "tf"].filter(k => $("show-" + k) && $("show-" + k).checked);
  const queue = [];
  VERSES.forEach(v => kinds.forEach(k => { if (k !== "ar" && !v[k]) return; queue.push({ kind: k, n: v.n }); }));
  return queue;
}

function runQueue(queue, startWithBm) {
  const my = token;
  const masterBtn = $("master");
  masterBtn.textContent = "നിർത്തുക"; masterBtn.classList.add("playing");
  
  const step = i => {
    if (my !== token) return;
    if (i >= queue.length) { stopAll(); return; }
    const item = queue[i];
    mark(item.kind + "-" + item.n);
    if (item.kind === 'bm') {
      if (typeof playBismillah === 'function') {
        playBismillah(my, () => { if (my === token) step(i + 1); });
      } else {
        step(i + 1);
      }
    } else {
      playItem(item.kind, item.n, my, () => { if (my === token) step(i + 1); });
    }
  };
  step(0);
}

function toggleContinuous() {
  const masterBtn = $("master");
  if (masterBtn && masterBtn.classList.contains('playing')) {
    stopAll();
    return;
  }
  stopAll();
  continuous = true;
  const q = fullQueue();
  if (!q.length) { stopAll(); return; }
  
  const hasVerse1 = VERSES.length && VERSES[0].n === 1;
  const arChecked = $("show-ar") ? $("show-ar").checked : true;
  if (hasVerse1 && SURAH !== 1 && SURAH !== 9 && arChecked && typeof playBismillah === 'function') {
    runQueue([{ kind: 'bm', n: 0 }].concat(q), true);
  } else {
    runQueue(q, false);
  }
}

const controlsEl = $("controls"), optBtn = $("opt-toggle"), panelEl = $("panel");
function togglePanel(e) {
  e.stopPropagation();
  const isOpen = panelEl.style.display === 'block' || panelEl.classList.contains('open');
  if (isOpen) {
    panelEl.style.display = 'none';
    panelEl.classList.remove('open');
    if (controlsEl) controlsEl.classList.remove('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▾';
  } else {
    panelEl.style.display = 'block';
    panelEl.classList.add('open');
    if (controlsEl) controlsEl.classList.add('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▴';
  }
}

document.addEventListener('click', function(e) {
  if (controlsEl && !controlsEl.contains(e.target)) {
    panelEl.style.display = 'none';
    panelEl.classList.remove('open');
    controlsEl.classList.remove('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▾';
  }
});

document.addEventListener("DOMContentLoaded", () => {
  const bismiDiv = $("bismi-container");
  const hasVerse1 = VERSES.length && VERSES[0].n === 1;
  if (bismiDiv) {
    if (!hasVerse1 && SURAH !== 1 && SURAH !== 9) {
      bismiDiv.remove();
    }
  }
});

buildPage(); initReciters(); applySettings(); applyDisplay();
</script>
