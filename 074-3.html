<!DOCTYPE html>
<html lang="ml">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>74. സൂറത്തുൽ അൽ മുദ്ദസ്സിർ (41–56)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--fs:18px;--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--acc:#1d5240;--soft:rgba(212,175,55,.16)}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36;--acc:#d4af37;--soft:rgba(212,175,55,.14)}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{overflow-x:hidden;font-family:"Noto Sans Malayalam",sans-serif;margin:0;padding:0 12px 40px;color:var(--ink);background:var(--paper);line-height:1.8}
body>*{max-width:1000px;margin-left:auto;margin-right:auto}
body>.hero{max-width:none;margin:0 -12px;text-align:center;color:#fff;padding:14px 0 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:500;line-height:1.4;margin-top:4px}
.topnav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;width:100%;max-width:1000px;margin:0 auto 10px;padding:0 8px}
.topnav .back{display:inline-flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:clamp(0.9rem,3.2vw,1.05rem);font-weight:500;white-space:nowrap}
.topnav .back:hover,.topnav .back:focus{color:#fff;outline:none}
.controls{position:sticky;top:0;z-index:10;background:var(--card);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-top:-30px;margin-bottom:16px}
.banner{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px}
.banner-row{display:flex;justify-content:center;align-items:center;gap:8px;width:100%}
.panel{display:none;position:absolute;left:-2px;right:-2px;top:100%;background:var(--card);border:2px solid var(--gold);border-top:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.15);padding:10px 14px 4px;max-height:75vh;overflow-y:auto}
.controls.open .panel{display:block}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px}
.ctl-title{font-size:13px;color:var(--muted);font-weight:600}
.opt{font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--green2)}
.opt-sel{font-family:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--acc);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.opt-btn,.small-btn{font-family:inherit;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:3px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.opt-btn.open,.small-btn.open{background:var(--green2);color:#fff;border-color:var(--green2)}
.main-btn{font-family:inherit;border:none;background:var(--green2);color:#fff;border-radius:20px;padding:5px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.main-btn.playing{background:#d93025}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fs-group{display:inline-flex;align-items:center;gap:4px}
#fs-label{font-size:13px;color:var(--muted);min-width:24px;text-align:center}
#status{width:100%!important;text-align:center!important;font-size:12px;color:var(--acc);margin:2px auto 0 auto!important;display:block!important;line-height:1.2}
#status:empty{display:none}
.verse{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(12px,3vw,20px);margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed var(--gold)}
.item{padding:4px 6px;border-radius:10px;margin-bottom:4px;border:2px solid transparent;scroll-margin-top:90px}
.item.reading{background:var(--soft);border-color:var(--gold)}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.row.rtl{direction:rtl}
.play-btn{flex:0 0 32px;width:32px;height:32px;border:none;border-radius:50%;background-color:var(--green2);color:#fff;font-size:13px;line-height:32px;padding:0;margin-top:2px;cursor:pointer}
.play-btn.playing{background-color:#d93025}
.text{flex:1;min-width:0;margin:0;text-align:left;line-height:1.7;font-size:var(--fs);overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:12px;color:var(--muted);margin-right:4px}
.pl{white-space:pre-line}
.text.ar{font-size:calc(var(--fs) * 1.5);text-align:right;line-height:2;color:var(--acc);font-family:"Noto Naskh Arabic",serif}
@media(prefers-color-scheme:dark){.text.ar{color:var(--ink)}}
.hidden{display:none}
.tf-btn{display:block;margin:4px 0 6px 6px}
.it-tf{border-top:1px dashed var(--line);margin-top:2px}
body.hide-ar .it-ar{display:none}
body.hide-ml .it-ml{display:none}
body.hide-tf .it-tf,body.hide-tf .tf-btn{display:none}
</style>
</head>
<body>
<header class="hero">
 <div class="topnav">
    <a class="back" href="https://onlinenanma.github.io/quran/"><span style="font-size: 1em;">🏠</span>പ്രധാനതാൾ</a>
    <a class="back" href="https://onlinenanma.github.io/quran/074"><span style="font-size: 1em;">📄</span>താളുകൾ</a>
    <a class="back" href="https://onlinenanma.github.io/quran/surah-index"><span style="font-size: 1em;">📖</span>സൂറത്തുകൾ</a>
 </div>
 <h1>74. സൂറത്തുൽ അൽ മുദ്ദസ്സിർ (41–56)</h1>
</header>

<div id="bismi-container"><h1 style="text-align: center; margin: 15px 0; color: var(--acc, #1d5240);">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</h1></div>

<div class="controls" id="controls">
  <div class="banner">
    <div class="banner-row">
      <button id="opt-toggle" class="opt-btn" onclick="togglePanel(event)">ഓപ്ഷനുകൾ ▾</button>
      <button id="master" class="main-btn" onclick="toggleContinuous()">കേൾക്കാം</button>
    </div>
    <div id="status"></div>
  </div>
  <div class="panel" id="panel">
    <div class="ctl-row">
      <span class="ctl-title">അക്ഷര വലിപ്പം:</span>
      <span class="fs-group">
        <button class="small-btn" onclick="changeFont(-2)">A−</button>
        <span id="fs-label">18</span>
        <button class="small-btn" onclick="changeFont(2)">A+</button>
      </span>
    </div>
    <div class="ctl-row">
      <span class="ctl-title">കാണിക്കുക:</span>
      <label class="opt"><input type="checkbox" id="show-ar" checked onchange="applyDisplay()"> ആയത്ത്</label>
      <label class="opt"><input type="checkbox" id="show-ml" checked onchange="applyDisplay()"> സാരം</label>
      <label class="opt"><input type="checkbox" id="show-tf" onchange="applyDisplay()"> വിവരണം</label>
      <label class="opt"><input type="checkbox" id="cont" checked> തുടർച്ചയായി കേൾക്കുക</label>
    </div>
    <div class="ctl-row"><span class="ctl-title">ഖിറാഅത്ത്:</span><select id="reciter" class="opt-sel" onchange="changeReciter(this.value)"></select></div>
    <div class="ctl-row"><span class="ctl-title">ആവർത്തനം:</span>
      <select id="repeat" class="opt-sel" onchange="saveSettings()"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
  </div>
</div>

<div id="verses"></div>

<script>
const $ = id => document.getElementById(id);
const SURAH = 74;
const VERSES = [
  {
    "n": 41,
    "ar": "عَنِ ٱلْمُجْرِمِينَ",
    "ml": "കുറ്റവാളികളെപ്പറ്റി",
    "tf": ""
  },
  {
    "n": 42,
    "ar": "مَا سَلَكَكُمْ فِى سَقَرَ",
    "ml": "നിങ്ങളെ നരകത്തില്‍ പ്രവേശിപ്പിച്ചത് എന്തൊന്നാണെന്ന്‌.",
    "tf": ""
  },
  {
    "n": 43,
    "ar": "قَالُوا۟ لَمْ نَكُ مِنَ ٱلْمُصَلِّينَ",
    "ml": "അവര്‍ (കുറ്റവാളികള്‍) മറുപടി പറയും: ഞങ്ങള്‍ നമസ്കരിക്കുന്നവരുടെ കൂട്ടത്തിലായില്ല.",
    "tf": ""
  },
  {
    "n": 44,
    "ar": "وَلَمْ نَكُ نُطْعِمُ ٱلْمِسْكِينَ",
    "ml": "ഞങ്ങള്‍ അഗതിക്ക് ആഹാരം നല്‍കുമായിരുന്നില്ല.",
    "tf": ""
  },
  {
    "n": 45,
    "ar": "وَكُنَّا نَخُوضُ مَعَ ٱلْخَآئِضِينَ",
    "ml": "തോന്നിവാസത്തില്‍ മുഴുകുന്നവരുടെ കൂടെ ഞങ്ങളും മുഴുകുമായിരുന്നു.",
    "tf": ""
  },
  {
    "n": 46,
    "ar": "وَكُنَّا نُكَذِّبُ بِيَوْمِ ٱلدِّينِ",
    "ml": "പ്രതിഫലത്തിന്‍റെ നാളിനെ ഞങ്ങള്‍ നിഷേധിച്ചു കളയുമായിരുന്നു.",
    "tf": ""
  },
  {
    "n": 47,
    "ar": "حَتَّىٰٓ أَتَىٰنَا ٱلْيَقِينُ",
    "ml": "അങ്ങനെയിരിക്കെ ആ ഉറപ്പായ മരണം ഞങ്ങള്‍ക്ക് വന്നെത്തി.",
    "tf": ""
  },
  {
    "n": 48,
    "ar": "فَمَا تَنفَعُهُمْ شَفَٰعَةُ ٱلشَّٰفِعِينَ",
    "ml": "ഇനി അവര്‍ക്ക് ശുപാര്‍ശക്കാരുടെ ശുപാര്‍ശയൊന്നും പ്രയോജനപ്പെടുകയില്ല.",
    "tf": ""
  },
  {
    "n": 49,
    "ar": "فَمَا لَهُمْ عَنِ ٱلتَّذْكِرَةِ مُعْرِضِينَ",
    "ml": "എന്നിരിക്കെ അവര്‍ക്കെന്തു പറ്റി? അവര്‍ ഉല്‍ബോധനത്തില്‍ നിന്ന് തിരിഞ്ഞുകളയുന്നവരായിരിക്കുന്നു.",
    "tf": ""
  },
  {
    "n": 50,
    "ar": "كَأَنَّهُمْ حُمُرٌۭ مُّسْتَنفِرَةٌۭ",
    "ml": "അവര്‍ വിറളി പിടിച്ച കഴുതകളെപ്പോലിരിക്കുന്നു.",
    "tf": ""
  },
  {
    "n": 51,
    "ar": "فَرَّتْ مِن قَسْوَرَةٍۭ",
    "ml": "സിംഹത്തില്‍ നിന്ന് ഓടിരക്ഷപ്പെടുന്ന (കഴുതകള്‍)",
    "tf": ""
  },
  {
    "n": 52,
    "ar": "بَلْ يُرِيدُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُؤْتَىٰ صُحُفًۭا مُّنَشَّرَةًۭ",
    "ml": "അല്ല, അവരില്‍ ഓരോരുത്തരും ആഗ്രഹിക്കുന്നു; തനിക്ക് അല്ലാഹുവിങ്കല്‍ നിന്ന് നിവര്‍ത്തിയ ഏടുകള്‍ നല്‍കപ്പെടണമെന്ന്‌.",
    "tf": ""
  },
  {
    "n": 53,
    "ar": "كَلَّا ۖ بَل لَّا يَخَافُونَ ٱلْءَاخِرَةَ",
    "ml": "അല്ല; പക്ഷെ, അവര്‍ പരലോകത്തെ ഭയപ്പെടുന്നില്ല.",
    "tf": ""
  },
  {
    "n": 54,
    "ar": "كَلَّآ إِنَّهُۥ تَذْكِرَةٌۭ",
    "ml": "അല്ല; തീര്‍ച്ചയായും ഇത് ഒരു ഉല്‍ബോധനമാകുന്നു.",
    "tf": ""
  },
  {
    "n": 55,
    "ar": "فَمَن شَآءَ ذَكَرَهُۥ",
    "ml": "ആകയാല്‍ ആര്‍ ഉദ്ദേശിക്കുന്നുവോ അവരത് ഓര്‍മിച്ചു കൊള്ളട്ടെ.",
    "tf": ""
  },
  {
    "n": 56,
    "ar": "وَمَا يَذْكُرُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ هُوَ أَهْلُ ٱلتَّقْوَىٰ وَأَهْلُ ٱلْمَغْفِرَةِ",
    "ml": "അല്ലാഹു ഉദ്ദേശിക്കുന്നുവെങ്കിലല്ലാതെ അവര്‍ ഓര്‍മിക്കുന്നതല്ല. അവനാകുന്നു ഭക്തിക്കവകാശപ്പെട്ടവന്‍; പാപമോചനത്തിന് അവകാശപ്പെട്ടവന്‍.",
    "tf": ""
  }
];
const SKEY = "quran-reader-settings";
const CHECKS = ["show-ar", "show-ml", "show-tf", "cont"];
let fontSize = 18, reciterId = "ghamdy";

function loadSettings() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } }
function saveSettings() {
  const s = loadSettings();
  Object.assign(s, { fontSize, reciterId, repeat: $("repeat").value });
  CHECKS.forEach(id => s[id] = $(id) ? $(id).checked : true);
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
}
function applySettings() {
  const s = loadSettings();
  if (s.fontSize) { fontSize = s.fontSize; document.documentElement.style.setProperty("--fs", fontSize + "px"); $("fs-label").textContent = fontSize; }
  CHECKS.forEach(id => { if ($(id) && id in s) $(id).checked = s[id]; });
  if (s.repeat) $("repeat").value = s.repeat;
}

const RECITERS = [
  { id: "ghamdy",   name: "സഅദ് അൽ ഗാമിദി",        base: "https://everyayah.com/data/Ghamadi_40kbps" },
  { id: "ayyoub",   name: "മുഹമ്മദ് അയ്യൂബ്",       base: "https://everyayah.com/data/Muhammad_Ayyoub_64kbps" },
  { id: "bafsar",   name: "അബ്ദുല്ല ബസ്ഫർ",        base: "https://everyayah.com/data/Abdullah_Basfar_64kbps" },
  { id: "hudhaify", name: "അലി ഹുദൈഫി",            base: "https://everyayah.com/data/Hudhaify_64kbps" },
  { id: "muaiqly",  name: "മാഹിർ അൽ മുഅയ്ഖ്‌ലി", base: "https://everyayah.com/data/Maher_AlMuaiqly_64kbps" },
  { id: "alili",    name: "അസീസ് അലീലി",           base: "https://everyayah.com/data/aziz_alili_128kbps" }
];

const pad3 = x => String(x).padStart(3, "0");
const currentReciter = () => RECITERS.find(r => r.id === reciterId) || RECITERS[0];
const audioUrl = n => currentReciter().base.replace(/\/*$/, "/") + pad3(SURAH) + pad3(n) + ".mp3";

function changeReciter(id) { reciterId = id; saveSettings(); }
function initReciters() {
  const sel = $("reciter");
  if(!sel) return;
  sel.innerHTML = RECITERS.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  const saved = loadSettings().reciterId;
  reciterId = (RECITERS.find(r => r.id === saved) || RECITERS[0]).id;
  sel.value = reciterId;
}

const KIND_NAME = { ar: "ആയത്ത്", ml: "സാരം", tf: "വിവരണം" };

function buildPage() {
  $("verses").innerHTML = VERSES.map(v => {
    const vNum = v.n;
    return `
    <div class="verse" id="verse-${vNum}">
      <div class="vhead"><span>ആയത്ത് ${SURAH}: ${pad3(vNum)}</span></div>
      <div class="item it-ar" id="item-ar-${vNum}"><div class="row rtl">
        <button class="play-btn" id="btn-ar-${vNum}" onclick="toggleItem('ar', ${vNum})">▶</button>
        <p class="text ar" lang="ar" dir="rtl">${v.ar}</p></div></div>
      ${v.ml ? `<div class="item it-ml" id="item-ml-${vNum}"><div class="row">
        <button class="play-btn" id="btn-ml-${vNum}" onclick="toggleItem('ml', ${vNum})">▶</button>
        <p class="text"><span class="tag">സാരം:</span>${v.ml}</p></div></div>` : ""}
      ${v.tf ? `<button class="small-btn tf-btn" id="tgl-${vNum}" onclick="toggleTafseer(${vNum})">വിവരണം</button>
        <div class="item it-tf hidden" id="item-tf-${vNum}"><div class="row">
        <button class="play-btn" id="btn-tf-${vNum}" onclick="toggleItem('tf', ${vNum})">▶</button>
        <p class="text"><span class="pl">${v.tf}</span></p></div></div>` : ""}
    </div>`;
  }).join("");
}

function changeFont(d) {
  fontSize = Math.min(40, Math.max(12, fontSize + d));
  document.documentElement.style.setProperty("--fs", fontSize + "px");
  $("fs-label").textContent = fontSize; saveSettings();
}

function setTafseerVisible(n, show) {
  const b = $("item-tf-" + n), t = $("tgl-" + n);
  if (!b) return; b.classList.toggle("hidden", !show); if (t) t.classList.toggle("open", show);
}

function toggleTafseer(n) {
  const willShow = $("item-tf-" + n).classList.contains("hidden");
  setTafseerVisible(n, willShow);
}

function applyDisplay() {
  const on = id => $(id) ? $(id).checked : true;
  document.body.classList.toggle("hide-ar", !on("show-ar"));
  document.body.classList.toggle("hide-ml", !on("show-ml"));
  document.body.classList.toggle("hide-tf", !on("show-tf"));
  VERSES.forEach(v => { if (v.tf) setTafseerVisible(v.n, on("show-tf")); });
  saveSettings();
}

let token = 0, activeKey = null, currentAudio = null, continuous = false, curLabel = "", curKind = "ml";

function mark(key) {
  clearMark(); activeKey = key;
  const btn = $("btn-" + key), item = $("item-" + key);
  if (btn) { btn.textContent = "■"; btn.classList.add("playing"); }
  if (item) { item.classList.add("reading"); item.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function clearMark() {
  if (!activeKey) return;
  const btn = $("btn-" + activeKey), item = $("item-" + activeKey);
  if (btn) { btn.textContent = "▶"; btn.classList.remove("playing"); }
  if (item) item.classList.remove("reading");
  activeKey = null;
}

function stopAll() {
  token++; continuous = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  clearMark();
  const masterBtn = $("master");
  if (masterBtn) { masterBtn.textContent = "കേൾക്കാം"; masterBtn.classList.remove("playing"); }
  if ($("status")) $("status").textContent = "";
}

function playArabic(n, my, done) {
  if (my !== token) return;
  const audio = new Audio();
  audio.preload = "auto"; currentAudio = audio;
  audio.onended = () => { if (my === token) done(); };
  audio.onerror = () => done();
  const rawUrl = audioUrl(n);
  if ($("status")) $("status").textContent = curLabel + " · " + currentReciter().name;
  Promise.resolve(typeof window.cachedSrc === 'function' ? window.cachedSrc(rawUrl) : rawUrl).then(u => {
    if (my !== token) return;
    audio.src = u;
    audio.play().catch(() => done());
  }).catch(() => done());
}

function speakMalayalam(text, my, done) {
  if (!text) { done(); return; }
  if (!window.speechSynthesis) { done(); return; }
  window.speechSynthesis.cancel();
  if ($("status")) $("status").textContent = curLabel;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ml-IN"; u.rate = 0.9;
  u.onend = () => { if (my === token) done(); };
  u.onerror = () => { if (my === token) done(); };
  window.speechSynthesis.speak(u);
}

function playItem(kind, n, my, done) {
  curKind = kind;
  curLabel = "ആയത്ത് " + n + " – " + KIND_NAME[kind];
  if ($("status")) $("status").textContent = curLabel;
  if (kind === "ar") {
    const total = +$("repeat").value || 1;
    const loop = k => {
      if (my !== token) return;
      playArabic(n, my, () => (k < total ? loop(k + 1) : done()));
    };
    loop(1);
  } else {
    const vObj = VERSES.find(v => v.n === n) || VERSES[0];
    if (vObj && vObj[kind]) {
      speakMalayalam(vObj[kind], my, done);
    } else {
      done();
    }
  }
}

function toggleItem(kind, n) {
  const key = kind + "-" + n;
  if (activeKey === key) { stopAll(); return; }
  stopAll();
  const my = token;
  mark(key);
  playItem(kind, n, my, () => { if (my === token) stopAll(); });
}

function fullQueue() {
  const kinds = ["ar", "ml", "tf"].filter(k => $("show-" + k) && $("show-" + k).checked);
  const queue = [];
  VERSES.forEach(v => kinds.forEach(k => { if (k !== "ar" && !v[k]) return; queue.push({ kind: k, n: v.n }); }));
  return queue;
}

function runQueue(queue, startWithBm) {
  const my = token;
  const masterBtn = $("master");
  masterBtn.textContent = "നിർത്തുക"; masterBtn.classList.add("playing");
  
  const step = i => {
    if (my !== token) return;
    if (i >= queue.length) { stopAll(); return; }
    const item = queue[i];
    mark(item.kind + "-" + item.n);
    if (item.kind === 'bm') {
      if (typeof playBismillah === 'function') {
        playBismillah(my, () => { if (my === token) step(i + 1); });
      } else {
        step(i + 1);
      }
    } else {
      playItem(item.kind, item.n, my, () => { if (my === token) step(i + 1); });
    }
  };
  step(0);
}

function toggleContinuous() {
  const masterBtn = $("master");
  if (masterBtn && masterBtn.classList.contains('playing')) {
    stopAll();
    return;
  }
  stopAll();
  continuous = true;
  const q = fullQueue();
  if (!q.length) { stopAll(); return; }
  
  const hasVerse1 = VERSES.length && VERSES[0].n === 1;
  const arChecked = $("show-ar") ? $("show-ar").checked : true;
  if (hasVerse1 && SURAH !== 1 && SURAH !== 9 && arChecked && typeof playBismillah === 'function') {
    runQueue([{ kind: 'bm', n: 0 }].concat(q), true);
  } else {
    runQueue(q, false);
  }
}

const controlsEl = $("controls"), optBtn = $("opt-toggle"), panelEl = $("panel");
function togglePanel(e) {
  e.stopPropagation();
  const isOpen = panelEl.style.display === 'block' || panelEl.classList.contains('open');
  if (isOpen) {
    panelEl.style.display = 'none';
    panelEl.classList.remove('open');
    if (controlsEl) controlsEl.classList.remove('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▾';
  } else {
    panelEl.style.display = 'block';
    panelEl.classList.add('open');
    if (controlsEl) controlsEl.classList.add('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▴';
  }
}

document.addEventListener('click', function(e) {
  if (controlsEl && !controlsEl.contains(e.target)) {
    panelEl.style.display = 'none';
    panelEl.classList.remove('open');
    controlsEl.classList.remove('open');
    optBtn.textContent = 'ഓപ്ഷനുകൾ ▾';
  }
});

document.addEventListener("DOMContentLoaded", () => {
  const bismiDiv = $("bismi-container");
  const hasVerse1 = VERSES.length && VERSES[0].n === 1;
  if (bismiDiv) {
    if (!hasVerse1 && SURAH !== 1 && SURAH !== 9) {
      bismiDiv.remove();
    }
  }
});

buildPage(); initReciters(); applySettings(); applyDisplay();
</script>
