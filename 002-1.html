<style>
:root{--fs:18px;--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--acc:#1d5240;--soft:rgba(212,175,55,.16)}

html{scroll-padding-top:70px}
body{overflow-x:hidden;font-family:"Noto Sans Malayalam",sans-serif;margin:0;padding:0 12px 40px;color:var(--ink);background:var(--paper);line-height:1.8}
body>*{max-width:1000px;margin-left:auto;margin-right:auto}
body>.hero{max-width:none;margin:0 -12px;text-align:center;color:#fff;padding:8px 18px 38px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(1.15rem,4.5vw,1.6rem);font-weight:400;line-height:1.3;margin:0}

.panel{display:none;position:absolute;left:-2px;right:-2px;top:100%;background:var(--card);border:2px solid var(--gold);border-top:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.15);padding:14px 14px 6px;max-height:75vh;overflow-y:auto}
.controls.open .panel{display:block}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.ctl-title{font-size:13px;color:var(--muted);font-weight:600}
.opt{font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--green2)}
.opt-sel,.ai-ask input{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--acc);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.opt-btn,.small-btn{font-family:inherit;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:4px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.opt-btn.open,.small-btn.open{background:var(--green2);color:#fff;border-color:var(--green2)}
.main-btn{font-family:inherit;border:none;background:var(--green2);color:#fff;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.banner .main-btn{padding:7px 20px}
.main-btn.playing{background:#d93025}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fs-group{display:inline-flex;align-items:center;gap:4px}
#fs-label{font-size:13px;color:var(--muted);min-width:24px;text-align:center}
#status{width:100%;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
#status:empty{display:none}
.verse,.item{min-width:0}
.verse{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(12px,3vw,20px);margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed var(--gold)}
.item{padding:4px 6px;border-radius:10px;margin-bottom:4px;border:2px solid transparent;scroll-margin-top:90px}
.item.reading{background:var(--soft);border-color:var(--gold)}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.row.rtl{direction:rtl}
.play-btn{flex:0 0 32px;width:32px;height:32px;border:none;border-radius:50%;background-color:var(--green2);color:#fff;font-size:13px;line-height:32px;padding:0;margin-top:2px;cursor:pointer}
.play-btn.playing{background-color:#d93025}
.text{flex:1;min-width:0;margin:0;text-align:left;line-height:1.7;font-size:var(--fs);overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:12px;color:var(--muted);margin-right:4px}
.pl{white-space:pre-line}
.text.ar{font-size:calc(var(--fs) * 1.5);text-align:right;line-height:2;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}
@media(prefers-color-scheme:dark){.text.ar{color:var(--ink)}}
.hidden{display:none}
.tf-btn{display:block;margin:4px 0 6px 6px}
.it-tf{border-top:1px dashed var(--line);margin-top:2px}
body.hide-ar .it-ar{display:none}
body.hide-ml .it-ml{display:none}
body.hide-tf .it-tf,body.hide-tf .tf-btn{display:none}
.ai-box{margin:24px auto 0;padding:clamp(14px,3vw,22px);border:2px solid var(--gold);border-radius:12px;background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,.06)}
.ai-box h3{margin:16px 0 8px;font-size:calc(var(--fs) * 1.1);color:var(--acc);text-align:center}
.ai-box h3:first-child{margin-top:0}
.ai-box>.main-btn{display:block;margin:0 auto}
.ai-out{margin:10px 0;line-height:1.7;font-size:var(--fs);white-space:pre-line}
.ai-out:empty{display:none}
.q-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.q-btn{font-family:inherit;text-align:left;border:1px solid var(--line);border-top:3px solid var(--gold);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:calc(var(--fs) * .85);cursor:pointer}
.q-btn:hover,.q-btn:focus-visible{background:var(--green2);color:#fff;outline:none}
.ai-ask{display:flex;gap:6px;margin-top:8px}
.ai-ask input{flex:1;min-width:0;padding:8px;font-size:15px}
.quiz-q{margin:12px 0;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.quiz-q p{margin:0 0 6px;font-size:var(--fs)}
.quiz-opt{font-family:inherit;display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:calc(var(--fs) * .9);cursor:pointer}
.quiz-opt.right{background:#e6f4ea;border-color:#188038;color:#123528}
.quiz-opt.wrong{background:#fce8e6;border-color:#d93025;color:#5b1a14}
.quiz-exp{font-size:calc(var(--fs) * .8);color:var(--muted);margin-top:4px}
 .topnav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .topnav .back{display:inline-block;padding:4px 0}
</style>

 <div>

<script>
const $ = id => document.getElementById(id);

/* ===== PAGE SETTINGS – change these for each page ===== */
const SURAH = 2;                       // surah number (audio file names: 002001.mp3 ...)
const SURAH_NAME = "സൂറത്തുൽ ബഖറഃ";

/* ===== VERSES  (ml = സാരം, tf = വിവരണം; leave "" and that part is hidden) ===== */
const VERSES = [
  { n: 1,  ar: "الٓمٓ", ml: "അലിഫ്‌ - ലാം - മീം.", tf: "ഖുർആനിലെ ചില സൂറത്തുകൾ ആരംഭിച്ചിട്ടുള്ള അക്ഷരങ്ങളിൽ പെട്ടതാണ് {الم} \"അലിഫ് ലാം മീം\" എന്നത്. \"അലിഫ്, ബാ, താ\"  എന്നിങ്ങനെ ഒറ്റയായി വന്നാൽ സ്വയം അർത്ഥമില്ലാത്ത അക്ഷരമാലയിലെ അക്ഷരങ്ങളാണവ. എന്നാൽ ഖുർആനിൽ അവ പരാമർശിക്കപ്പെട്ടതിൽ ചില ലക്ഷ്യങ്ങളും ഉദ്ദേശങ്ങളുമുണ്ട്. കാരണം യുക്തിയില്ലാത്ത ഒന്നും തന്നെ ഖുർആനിലില്ല. അതിൻറെ പ്രധാന ലക്ഷ്യങ്ങളിൽ പെട്ടതാണ്: അറബികൾക്ക് സുപരിചിതമായതും അവർ സംസാരിക്കുന്നതുമായ ഈ അക്ഷരങ്ങൾ തന്നെ കൂടിച്ചേർന്നുണ്ടായ ഖുർആൻ കൊണ്ട്, അതുപോലൊന്ന് കൊണ്ടുവരാൻ അവരെ വെല്ലുവിളിക്കുക എന്നത്. അത് കൊണ്ടാണ് അധികവും, ഇത്തരം അക്ഷരങ്ങൾക്ക് ശേഷം ഖുർആനിനെക്കുറിച്ചും അതിന്റെ സവിശേഷതകളെക്കുറിച്ചും പരാമർശിക്കപെടുന്നത് . ഈ സൂറത്തിലും അങ്ങനെത്തന്നെ." },
  { n: 2,  ar: "ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ", ml: "ഇതാകുന്നു ഗ്രന്ഥം. അതില്‍ സംശയമേയില്ല. സൂക്ഷ്മത പാലിക്കുന്നവര്‍ക്ക്‌ നേര്‍വഴി കാണിക്കുന്നതത്രെ അത്‌.", tf: "ഈ മഹത്തായ ഖുർആൻ, അത് എവിടെ നിന്ന് അവതരിപ്പിക്കപ്പെട്ടുവെന്നതിലോ, അതിലെ വാക്കുകളിലോ ആശയത്തിലോ യാതൊരുവിധ സംശയവുമില്ല. അത് അല്ലാഹുവിൻറെ സംസാരമാകുന്നു. സൂക്ഷ്മത പാലിക്കുന്നവരെ അവനിലേക്കെത്തുന്ന മാർഗത്തിലേക്ക് അത് നയിക്കുന്നു." },
  { n: 3,  ar: "الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ", ml: "അദൃശ്യകാര്യങ്ങളില്‍ വിശ്വസിക്കുകയും, പ്രാര്‍ത്ഥന അഥവാ നമസ്കാരം മുറപ്രകാരം നിര്‍വഹിക്കുകയും, നാം നല്‍കിയ സമ്പത്തില്‍ നിന്ന്‌ ചെലവഴിക്കുകയും,", tf: "(ഗൈബിൽ അഥവാ) അദൃശ്യത്തിൽ വിശ്വസിക്കുന്നവരാകുന്നു മുത്തഖികൾ അഥവാ സൂക്ഷ്മത പാലിക്കുന്നവർ. പരലോകം പോലെ, നമ്മുടെ പഞ്ചേന്ദ്രിയങ്ങൾ കൊണ്ട് കണ്ടെത്താൻ കഴിയാത്തതും നമ്മിൽ നിന്ന് അദൃശ്യമായതും അല്ലാഹുവോ റസൂലോ അറിയിച്ചതുമായ കാര്യങ്ങൾക്കാണ് ഗൈബ് എന്ന് പറയുന്നത് . അല്ലാഹു നിയമമാക്കിയ രൂപത്തിൽ ശർത്തുകളും, റുക്നുകളും, വാജിബുകളും, സുന്നത്തുകളും പാലിച്ച് കൊണ്ട് നമസ്കാരം നിലനിർത്തുന്നവരും, അല്ലാഹു അവർക്ക് നൽകിയിട്ടുള്ളതിൽ നിന്ന് നിർബന്ധമായ സക്കാത്ത് പോലുള്ളതും, നിർബന്ധമല്ലാത്ത മറ്റ് ദാനങ്ങളും അല്ലാഹുവിൻറെ പ്രതിഫലം മാത്രമാഗ്രഹിച്ച് നിർവ്വഹിക്കുന്നവരുമാണവർ." },
  { n: 4,  ar: "وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ", ml: "നിനക്കും നിന്‍റെമുന്‍ഗാമികള്‍ക്കും നല്‍കപ്പെട്ട സന്ദേശത്തില്‍ വിശ്വസിക്കുകയും, പരലോകത്തില്‍ ദൃഢമായി വിശ്വസിക്കുകയും ചെയ്യുന്നവരത്രെ അവര്‍ (സൂക്ഷ്മത പാലിക്കുന്നവര്‍).", tf: "നബിയേ, താങ്കൾക്ക് അവതരിക്കപ്പെട്ട വഹ്'യിലും താങ്കൾക്ക് മുമ്പുള്ള മറ്റ് നബിമാർക്ക് ഇറക്കപ്പെട്ടതിലും വിവേചനമില്ലാതെ വിശ്വസിക്കുന്നവരും, പരലോകത്തിലും അവിടെയുള്ള പ്രതിഫലത്തിലും ശിക്ഷകളിലും അടിയുറച്ച് വിശ്വസിക്കുന്നവരുമാകുന്നു മുത്തഖികൾ അഥവാ സൂക്ഷ്മത പാലിക്കുന്നവർ." },
  { n: 5,  ar: "أُولَـٰئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ ۖ وَأُولَـٰئِكَ هُمُ الْمُفْلِحُونَ", ml: "അവരുടെ നാഥന്‍ കാണിച്ച നേര്‍വഴിയിലാകുന്നു അവര്‍. അവര്‍ തന്നെയാകുന്നു സാക്ഷാല്‍ വിജയികള്‍.", tf: "മേൽ പറഞ്ഞ വിശേഷണങ്ങൾക്കർഹരായവർ സന്മാർഗം പ്രാപിച്ചവരാകുന്നു.  ഇഹലോകത്തും പരലോകത്തും അവരാകുന്നു വിജയികൾ. അല്ലാഹുവിലുള്ള വിശ്വാസവും സൽക്കർമ്മങ്ങളും ഇഹലോകത്ത് സന്മാർഗ്ഗവും റബ്ബിന്റെ തൗഫീഖും, പരലോകത്ത് വിജയവും രക്ഷയും നേടിത്തരുന്നു." },
  { n: 6,  ar: "إِنَّ الَّذِينَ كَفَرُوا سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ", ml: "സത്യനിഷേധികളെ സംബന്ധിച്ചിടത്തോളം നീ അവര്‍ക്ക്‌ താക്കീത്‌ നല്‍കിയാലും ഇല്ലെങ്കിലും സമമാകുന്നു. അവര്‍ വിശ്വസിക്കുന്നതല്ല.", tf: "നബി (ﷺ) യും ഖുർആനും പ്രബോധനം ചെയ്യുന്ന തത്വങ്ങളില്‍ വിശ്വസിക്കാതെ സത്യത്തെ മൂടി വെക്കുകയും, ദൃഷ്ടാന്തങ്ങളെ അവഗണിച്ചു തള്ളിക്കളയുകയും ചെയ്യുന്ന സത്യനിഷേധികളായ മുശ്‌രിക്കുകളാണ് ഇവിടെ الَّذِينَ كَفَرُوا (അവിശ്വസിച്ചവര്‍) കൊണ്ടുദ്ദേശ്യം. അവരെ താക്കീത് ചെയ്യുന്നതും ചെയ്യാതിരിക്കുന്നതും ഒരുപോലെയാണ്-അവര്‍ വിശ്വസിക്കുവാന്‍ പോകുന്നില്ല-എന്ന് അല്ലാഹു നബി തിരുമേനി (ﷺ) യെ അറിയിക്കുന്നു. അജ്ഞത കൊണ്ടോ, ദൃഷ്ടാന്തങ്ങളുടെ പോരായ്മ കൊണ്ടോ ഉള്ള നിഷേധമാണെങ്കില്‍, താക്കീത് കൊണ്ടും ഉപദേശം കൊണ്ടും അവര്‍ക്ക് മാനസാന്തരം വന്നേക്കുമെന്ന് പ്രതീക്ഷിക്കുവാനവകാശമുണ്ട്. സത്യം മനസ്സിലായിട്ട് പിന്നെയും കല്‍പ്പിച്ചുകൂട്ടി അതിനെ മറയ്ക്കുന്നവരെ സംബന്ധിച്ച് അതൊന്നും പ്രയോജനപ്പെടുകയില്ലല്ലോ. ഉപദേശങ്ങള്‍ക്ക് ചെവികൊടുക്കുകയും, ദൃഷ്ടാന്തങ്ങളില്‍ ചിന്തിക്കുകയും ചെയ്‌വാന്‍ തയ്യാറില്ലാത്ത എല്ലാ അവിശ്വാസികളുടെയും സ്ഥിതി ഇതുതന്നെ." },
  { n: 7,  ar: "خَتَمَ اللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰ أَبْصَارِهِمْ غِشَاوَةٌ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌ", ml: "അവരുടെ മനസ്സുകള്‍ക്കും കാതിനും അല്ലാഹു മുദ്രവെച്ചിരിക്കുകയാണ്‌. അവരുടെ ദൃഷ്ടികളിന്‍മേലും ഒരു മൂടിയുണ്ട്‌. അവര്‍ക്കാകുന്നു കനത്ത ശിക്ഷയുള്ളത്‌.", tf: "മനുഷ്യന്‍ നിരര്‍ത്ഥമായ വിശ്വാസത്തിലും, നിഷിദ്ധമായ പ്രവൃത്തികളിലും അങ്ങേയറ്റം എത്തുകയും, യഥാര്‍ത്ഥത്തിലേക്കുള്ള തിരിഞ്ഞുനോട്ടം ഇല്ലാതാകുകയും ചെയ്യുമ്പോള്‍, ആ അനുസരണക്കേടും തെറ്റുകുറ്റങ്ങളും ചെയ്യുന്നത് നന്നായി തോന്നുകയെന്ന ഒരു ശീലം അതവനില്‍ ഉണ്ടാക്കിത്തീര്‍ക്കുകയും, അവന്‍റെ ഹൃദയം മുദ്രവെക്കപ്പെട്ടതുപോലെ ആയിത്തീരുകയും ചെയ്യുന്നു. ഇതുപോലെത്തന്നെയാണ് طَبَعَ اللَّهُ عَلَىٰ قُلُوبِهِمْ وَسَمْعِهِمْ وَأَبْصَارِهِمْ (അവരുടെ ഹൃദയങ്ങള്‍ക്കും കേള്‍വിക്കും കാഴ്ചകള്‍ക്കും അല്ലാഹു മുദ്രകുത്തി (16: 108) എന്ന വചനവും, مَنْ أَغْفَلْنَا قَلْبَهُ (നാം ഹൃദയത്തെ അശ്രദ്ധയിലാക്കിയവന്‍ (18: 28) എന്നതിലെ അശ്രദ്ധയിലാക്കലും, وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً (അവരുടെ ഹൃദയങ്ങളില്‍ നാം ചില മൂടികളെ ആക്കി (6:25) എന്നതിലെ മൂടി ഇടലും, وَجَعَلْنَا قُلُوبَهُمْ قَاسِيَةً (അവരുടെ ഹൃദയങ്ങളെ നാം കടുപ്പമുള്ളതാക്കി (5: 13) എന്നതിലെ കടുപ്പമാക്കലുമെല്ലാം ഈ പ്രകാരത്തിലുള്ള അലങ്കാര പ്രയോഗങ്ങളാണ്. മനസ്സിലേക്ക് സത്യവിശ്വാസം പ്രവേശിക്കാതിരിക്കത്തക്കവണ്ണം ആദ്യമേ അല്ലാഹു ഹൃദയങ്ങള്‍ക്ക് മുദ്രവെച്ചു തടസ്സമുണ്ടാക്കുകയും, തന്‍മൂലം സത്യവിശ്വാസം ഉള്‍ക്കൊള്ളുവാന്‍ അവര്‍ക്ക് കഴിയാതെ വരികയും ചെയ്യുക എന്നല്ല അവിടങ്ങളിലൊന്നും ഉദ്ദേശ്യം. അവരുടെ നിഷേധവും ധിക്കാരസ്വഭാവവും മുഴുത്തപ്പോള്‍, അതേ കാരണത്താല്‍ അല്ലാഹു അവരുടെ ഹൃദയങ്ങള്‍ക്ക് മുദ്രവെച്ചു-അഥവാ അതിലേക്ക് വിശ്വാസം കടന്നു ചെല്ലാത്ത അവസ്ഥയിലാക്കി-എന്നേയുള്ളൂ." },
  { n: 8,  ar: "وَمِنَ النَّاسِ مَن يَقُولُ آمَنَّا بِاللَّهِ وَبِالْيَوْمِ الْآخِرِ وَمَا هُم بِمُؤْمِنِينَ", ml: "ഞങ്ങള്‍ അല്ലാഹുവിലും അന്ത്യദിനത്തിലും വിശ്വസിച്ചിരിക്കുന്നു എന്ന്‌ പറയുന്ന ചില ആളുകളുണ്ട്‌; (യഥാര്‍ത്ഥത്തില്‍) അവര്‍ വിശ്വാസികളല്ല.", tf: "ഉള്ളില്‍ കുഫ്‌റും പുറമെ ഇസ്‌ലാമിക വേഷവും സ്വീകരിച്ചിരുന്ന കപടവിശ്വാസികൾ  അഥവാ മുനാഫിക്വുകളെക്കുറിച്ചാണ് ഈ സൂക്തങ്ങളില്‍ പ്രസ്താവിക്കുന്നത്. തങ്ങൾ മുഅ്മിനുകൾ  അഥവാ വിശ്വാസികളാണെന്ന് അവർ വാദിക്കുന്നു. യഥാർത്ഥത്തിൽ ഉള്ളിൽ അവർ കാഫിറുകൾ അഥവാ അവിശ്വാസികൾ തന്നെയാണ്. \n\nനബി (صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ) യുടെ പ്രവാചകത്വം ലഭിച്ച നാളുകളിൽ ഔസ്, ഖസ്‌റജ് എന്നീ രണ്ട് ഗോത്രക്കാരായിരുന്നു മദീനയിലെ അറബികള്‍.  അവർക്കിടയിൽ പൊതു നേതൃത്വം കൈവന്ന ഒരു നേതാവായിരുന്നു ഖസ്‌റജ് ഗോത്രക്കാരനായ അബ്ദുല്ലാഹിബ്‌നു ഉബയ്യിബ്‌നിനു സുലൂല്‍. അബ്ദുല്ലായെ എല്ലാവരുടെയും രാജാവായി വാഴിക്കുവാന്‍ ആലോചന നടന്നു വരികയായിരുന്നു. അക്കാലത്താണ് ഇസ്‌ലാമിന്  മദീനയിൽ സ്വാധീനം ഉണ്ടായിത്തീര്‍ന്നത്. പലരും ഇസ്‌ലാമിലേക്ക് ആകര്‍ഷിക്കപ്പെട്ടതോടെ ആ ആലോചന മുന്നോട്ടു പോകാതായി. നേതൃത്വമോഹിയായ അബ്ദുല്ലാഹിബ്‌നു ഉബയ്യിന്ന് ഇതുമൂലം ഇസ്‌ലാമിനോടും മുസ്‌ലിംകളോടും വെറുപ്പുളവായി. സുപ്രസിദ്ധമായ ബദ്ര്‍ യുദ്ധം കഴിഞ്ഞതോടെ മുസ്‌ലിംകളുടെ യശസ്സും പ്രതാപവും ശക്തിപ്പെട്ടുവല്ലോ. ഇസ്ലാമിന്‍റെ ശക്തി പൂര്‍വ്വാധികം വര്‍ദ്ധിച്ചു കൊണ്ടിരിക്കുന്നത് കണ്ടപ്പോള്‍, അവനും അവന്‍റെ സില്‍ബന്ധികളും അനുഭാവികളും പ്രത്യക്ഷത്തില്‍ ഇസ്‌ലാമിനെ അംഗീകരിച്ച് മുസ്‌ലിംകളായി അഭിനയിച്ചു. വേദക്കാരില്‍പെട്ട ചിലരും ഇക്കൂട്ടത്തിലുണ്ടായിരുന്നു. ഇവിടം മുതല്‍ക്കാണ് ‘മുനാഫിക്വു’കളുടെ തുടക്കം. ക്രമേണ മദീനായിലും, ചുറ്റുപ്രദേശങ്ങളിലുള്ള ‘അഅ്‌റാബി’ അഥവാ (മരുഭൂവാസി)കള്‍ക്കിടയിലും ഇവരുടെ എണ്ണം വര്‍ദ്ധിച്ചു. മക്കയില്‍ നിന്നു ഹിജ്‌റഃ വന്ന മുഹാജിറുകളില്‍ ആരിലും (കാപട്യത്തി)ന്‍റെ രോഗം ബാധിച്ചിട്ടില്ല . അവരാരും മറ്റുള്ളവരുടെ നിര്‍ബന്ധത്തിനോ, സ്വാധീനത്തിനോ വഴങ്ങി ഇസ്‌ലാമിനെ അംഗീകരിച്ചവരോ, അല്ലാഹു അല്ലാത്ത മറ്റാരുടെയെങ്കിലും പ്രീതിക്കു വേണ്ടി സത്യവിശ്വാസം സ്വീകരിച്ചവരല്ലായിരുന്നു അവർ." },
  { n: 9,  ar: "يُخَادِعُونَ اللَّهَ وَالَّذِينَ آمَنُوا وَمَا يَخْدَعُونَ إِلَّا أَنفُسَهُمْ وَمَا يَشْعُرُونَ", ml: "അല്ലാഹുവിനെയും വിശ്വാസികളെയും വഞ്ചിക്കുവാനാണ്‌ അവര്‍ ശ്രമിക്കുന്നത്‌. (വാസ്തവത്തില്‍) അവര്‍ ആത്മവഞ്ചന മാത്രമാണ്‌ ചെയ്യുന്നത്‌. അവരത്‌ മനസ്സിലാക്കുന്നില്ല.", tf: "‘മുനാഫിക്വു’കളുടെ അജ്ഞത നിമിത്തം അവർ ധരിച്ച് വെച്ചിരിക്കുന്നത് തങ്ങളുടെ  നിഷേധം മറച്ചുവെക്കുന്നതിലൂടെ അവർ അല്ലാഹുവിനെയും സത്യവിശ്വാസികളെയുമാണ് വഞ്ചിക്കുന്നത് എന്നാണ്. എന്നാൽ അവർ യാഥാർത്ഥ്യം മനസ്സിലാക്കുന്നില്ല; കാരണം അല്ലാഹു രഹസ്യവും മറഞ്ഞതുമെല്ലാം അറിയുന്നവനത്രെ. അല്ലാഹു അവരുടെ സ്വഭാവഗുണങ്ങളും അവസ്ഥകളും വിശ്വാസികൾക്ക് മുന്നിൽ തുറന്നുകാട്ടിയിരിക്കുന്നു." },
  { n: 10, ar: "فِي قُلُوبِهِم مَّرَضٌ فَزَادَهُمُ اللَّهُ مَرَضًا ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْذِبُونَ", ml: "അവരുടെ മനസ്സുകളില്‍ ഒരുതരം രോഗമുണ്ട്‌. തന്നിമിത്തം അല്ലാഹു അവര്‍ക്ക്‌ രോഗം വര്‍ദ്ധിപ്പിക്കുകയും ചെയ്തു. കള്ളം പറഞ്ഞുകൊണ്ടിരുന്നതിന്‍റെ ഫലമായി വേദനയേറിയ ശിക്ഷയാണ്‌ അവര്‍ക്കുണ്ടായിരിക്കുക.", tf: "അവരുടെ ഹൃദയങ്ങളിൽ ഈമാനിനു വിരുദ്ധമായ സംശയമുണ്ട്. അല്ലാഹു അവരുടെ സംശയത്തിനു മേൽ സംശയം വർധിപ്പിച്ചു നൽകി. അവരുടെ ആ പ്രവർത്തനത്തിനനുസരിച്ചുള്ള പ്രതിഫലമായി നരകത്തിൻറെ ഏറ്റവും അടിത്തട്ടിൽ അവർക്ക് വേദനാജനകമായ ശിക്ഷയുണ്ട്. അല്ലാഹുവിനെയും ജനങ്ങളെയും കുറിച്ച് കളവ് പറഞ്ഞതും, നബി (സ) കൊണ്ട് വന്ന ദീനിനെ നിഷേധിച്ചതുമാണ് കാരണം." },
  { n: 11, ar: "وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا فِي الْأَرْضِ قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ", ml: "നിങ്ങള്‍ നാട്ടില്‍ കുഴപ്പമുണ്ടാക്കാതിരിക്കൂ എന്ന്‌ അവരോട്‌ ആരെങ്കിലും പറഞ്ഞാല്‍, ഞങ്ങള്‍ സല്‍പ്രവര്‍ത്തനങ്ങള്‍ മാത്രമാണല്ലോ ചെയ്യുന്നത്‌ എന്നായിരിക്കും അവരുടെ മറുപടി.", tf: "സത്യനിഷേധം, സത്യവിശ്വാസികളെ കബളിപ്പിക്കല്‍, ജനമദ്ധ്യെ ആശയക്കുഴപ്പം സൃഷ്ടിക്കല്‍, വാക്കിനെതിരായ പ്രവര്‍ത്തനം, ഇസ്‌ലാമിന്‍റെ ശത്രുക്കളുമായുള്ള രഹസ്യബന്ധങ്ങള്‍ എന്നിങ്ങനെ പലതരത്തിലുള്ള അവരുടെ ചെയ്തികളെ ഉദ്ദേശിച്ചാണ് നാട്ടില്‍ നാശമുണ്ടാക്കരുതെന്ന് അവരോട് പറയുന്നത്. കുഫ്റും പാപങ്ങളുമൊക്കെ കൊണ്ട് ഭൂമിയിൽ കുഴപ്പമുണ്ടാക്കരുത് എന്ന് അവരോട് പറയപ്പെട്ടാൽ, അവർ അത് നിഷേധിക്കുകയും ഞങ്ങൾ നന്മയുടെയും രഞ്ജിപ്പിന്റെയും ആളുകളാണ് എന്ന് പറയുകയും ചെയ്യും." },
  { n: 12, ar: "أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ وَلَـٰكِن لَّا يَشْعُرُونَ", ml: "എന്നാല്‍ യഥാര്‍ത്ഥത്തില്‍ അവര്‍ തന്നെയാകുന്നു കുഴപ്പക്കാര്‍. പക്ഷെ, അവരത്‌ മനസ്സിലാക്കുന്നില്ല.", tf: "കപട മനസ്ഥിതി ഉള്ളവരുടെ ദുഷ്ട പ്രവര്‍ത്തനങ്ങളാണ് യഥാര്‍ത്ഥത്തില്‍ നാട്ടില്‍ നാശവും കുഴപ്പവും ഉണ്ടാക്കിത്തീര്‍ക്കുക. പുറമെ മുസ്ലിംകളായി നടിക്കുന്ന ചിലർ ഇക്കാലത്തുമുണ്ട്. അവർ പ്രത്യക്ഷത്തിൽ  മുസ്‌ലിംകളുടെയും ഇസ്‌ലാമിന്‍റെയും ഗുണകാംക്ഷികളും സമുദായോദ്ധാരകന്മാരുമാണെന്ന് നടിക്കുകയും ചെയ്യും. ഇസ്‌ലാമിനെ തുരങ്കം വെക്കുന്ന നിരീശ്വര നിര്‍മത യുക്തിവാദങ്ങളും, ഭൗതിക താല്‍പര്യങ്ങളുമായിരിക്കും അവരുടെ യഥാര്‍ത്ഥ കൈമുതല്‍. മുസ്‌ലിം ബഹുജനങ്ങളില്‍ നിന്ന് അവരറിയാതെ അവരുടെ വിശ്വാസവും മതഭക്തിയും നശിപ്പിച്ചുകൊണ്ട് പുരോഗമനത്തിന്‍റെ പേരില്‍ കാലത്തിനൊത്ത കോലം കെട്ടിക്കുകയായിരിക്കും അവരുടെ ലക്ഷ്യം. സത്യ വിശ്വാസികള്‍ ഇത്തരക്കാരെ ഇസ്‌ലാമിന്‍റെ പ്രത്യക്ഷ ശത്രുക്കളെക്കാള്‍ സൂക്ഷിക്കേണ്ടതാകുന്നു (والله المستعان)." },
  { n: 13, ar: "وَإِذَا قِيلَ لَهُمْ آمِنُوا كَمَا آمَنَ النَّاسُ قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ ۗ أَلَا إِنَّهُمْ هُمُ السُّفَهَاءُ وَلَـٰكِن لَّا يَعْلَمُونَ", ml: "മറ്റുള്ളവര്‍ വിശ്വസിച്ചത്‌ പോലെ നിങ്ങളും വിശ്വസിക്കൂ എന്ന്‌ അവരോട്‌ ആരെങ്കിലും പറഞ്ഞാല്‍ ഈ മൂഢന്‍മാര്‍ വിശ്വസിച്ചത്‌ പോലെ ഞങ്ങളും വിശ്വസിക്കുകയോ? എന്നായിരിക്കും അവര്‍ മറുപടി പറയുക. എന്നാല്‍ യഥാര്‍ത്ഥത്തില്‍ അവര്‍ തന്നെയാകുന്നു മൂഢന്‍മാര്‍. പക്ഷെ, അവരത്‌ അറിയുന്നില്ല.", tf: "ഞങ്ങള്‍ സത്യവിശ്വാസം സ്വീകരിച്ചിട്ടുണ്ടെന്നും മുസ്‌ലിംകളാണെന്നുമൊക്കെ നിങ്ങള്‍ പറയുന്നുവല്ലോ, നിങ്ങളുടെ പ്രവര്‍ത്തനങ്ങളും നടപടിയുമാണെങ്കില്‍ അതിനു കടകവിരുദ്ധവുമാണ്. നിങ്ങള്‍ പറയുന്നത് നേരാണെങ്കില്‍ ഈ നില മാറ്റി യഥാര്‍ത്ഥ സത്യവിശ്വാസികള്‍ വിശ്വസിച്ചതുപോലെയുള്ള വിശ്വാസം നിങ്ങള്‍ സ്വീകരിക്കേണ്ടതാണ് എന്നൊക്കെയാണ് آمِنُوا كَمَا آمَنَ النَّاسُ (മനുഷ്യര്‍ വിശ്വസിച്ചതുപോലെ നിങ്ങള്‍ വിശ്വസിക്കുവിന്‍) എന്ന് പറഞ്ഞതിന്‍റെ താത്പര്യം. സത്യവിശ്വാസികളെപ്പറ്റി, അവരൊക്കെ തനി ഭോഷന്മാരായത് കൊണ്ടാണ് അത്രത്തോളം ആ വിശ്വാസത്തില്‍ ലയിക്കുവാന്‍ കാരണം, ഞങ്ങള്‍ അതിനുമാത്രം അധഃപതിച്ചിട്ടില്ല, അവരെപ്പോലെയുള്ള വിശ്വാസം സ്വീകരിക്കുവാന്‍ ഞങ്ങളെ കിട്ടുകയില്ല എന്നൊക്കെയാണ് മറുപടിയില്‍ അവര്‍ വ്യംഗ്യമായി സൂചിപ്പിക്കുന്നത്. വാസ്തവം നേരെമറിച്ചാണുള്ളത്. യഥാര്‍ത്ഥ ഭോഷന്മാര്‍ അഥവാ ബുദ്ധിയില്ലാത്തവർ അവരല്ലാതെ മറ്റാരുമല്ല, പക്ഷേ അതു മനസ്സിലാക്കാനുള്ള തന്റേടവും വിവേകവും അവര്‍ക്കില്ല എന്ന് അല്ലാഹു ചൂണ്ടിക്കാട്ടുന്നു." },
  { n: 14, ar: "وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَوْا إِلَىٰ شَيَاطِينِهِمْ قَالُوا إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِئُونَ", ml: "വിശ്വാസികളെ കണ്ടുമുട്ടുമ്പോള്‍ അവര്‍ പറയും; ഞങ്ങള്‍ വിശ്വസിച്ചിരിക്കുന്നു എന്ന്‌. അവര്‍ തങ്ങളുടെ (കൂട്ടാളികളായ) പിശാചുക്കളുടെ അടുത്ത്‌ തനിച്ചാകുമ്പോള്‍ അവരോട്‌ പറയും: ഞങ്ങള്‍ നിങ്ങളോടൊപ്പം തന്നെയാകുന്നു. ഞങ്ങള്‍ (മറ്റവരെ) കളിയാക്കുക മാത്രമായിരുന്നു.", tf: "മുഅ്മിനുകളെ അവർ കണ്ട് മുട്ടിയാൽ \"നിങ്ങൾ വിശ്വസിക്കുന്ന കാര്യത്തിൽ ഞങ്ങളും വിശ്വസിക്കുന്നു\" എന്നവർ പറയും. മുഅ്മിനുകളെക്കുറിച്ചുള്ള ഭയം കാരണമാണ് അവരങ്ങനെ പറയുന്നത്. മുഅ്മിനുകളുടെ അരികിൽ നിന്ന് പിരിഞ്ഞുപോകുകയും അവരുടെ നേതാക്കന്മാരോടൊപ്പം തനിച്ചാവുകയും ചെയ്യുമ്പോൾ, അവരുടെ അനുയായികൾ തന്നെയാണ് തങ്ങളെന്ന കാര്യം ഉറപ്പിച്ചുകൊണ്ട് അവർ പറയും: ഞങ്ങൾ നിങ്ങളോടൊപ്പം നിങ്ങളുടെ മാർഗത്തിൽ തന്നെയാണ്. പുറമേക്ക് മുഅ്മിനുകളോട് ഞങ്ങൾ യോജിപ്പ് പ്രകടിപ്പിക്കുന്നത് അവരെ പരിഹസിക്കാനും കളിയാക്കാനുമാണ്." },
  { n: 15, ar: "اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ", ml: "എന്നാല്‍ അല്ലാഹുവാകട്ടെ, അവരെ പരിഹസിക്കുകയും, അതിക്രമങ്ങളില്‍ വിഹരിക്കുവാന്‍ അവരെ അയച്ചുവിട്ടിരിക്കുകയുമാകുന്നു.", tf: "മുഅ്മിനുകളെ പരിഹസിക്കുന്നതിന് പകരമായി അല്ലാഹു അവരെയും പരിഹസിക്കുന്നു. അവരുടെ പ്രവർത്തനത്തിനനുസരിച്ച പ്രതിഫലം. അതുകൊണ്ടാണ് ദുൻയാവിൽ അവർക്ക് അല്ലാഹു മുസ്ലിംകളുടെ അതേ വിധിവിലക്കുകൾ ബാധകമാക്കിയത്. എന്നാൽ പരലോകത്ത് അവരുടെ കാപട്യത്തിനും കുഫ്റിനുമുള്ള പ്രതിഫലം തന്നെ അവൻ നൽകും. അതുപോലെ, അവരുടെ വഴികേടിലും അതിക്രമത്തിലും വിഹരിക്കാൻ അല്ലാഹു അവരെ അയച്ചു വിട്ടിരിക്കുന്നു. അങ്ങനെ സംശയാലുക്കളും പരിഭ്രാന്തരുമായി അവർ കഴിഞ്ഞു കൂടുന്നു." },
  { n: 16, ar: "أُولَـٰئِكَ الَّذِينَ اشْتَرَوُا الضَّلَالَةَ بِالْهُدَىٰ فَمَا رَبِحَت تِّجَارَتُهُمْ وَمَا كَانُوا مُهْتَدِينَ", ml: "സന്‍മാര്‍ഗം വിറ്റ്‌ പകരം ദുര്‍മാര്‍ഗം വാങ്ങിയവരാകുന്നു അവര്‍. എന്നാല്‍ അവരുടെ കച്ചവടം ലാഭകരമാവുകയോ, അവര്‍ ലക്ഷ്യം പ്രാപിക്കുകയോ ചെയ്തില്ല.", tf: "വിശ്വാസത്തിന് പകരം അവിശ്വാസത്തെ പകരമാക്കിയ ഇവർ; അല്ലാഹുവിലുള്ള വിശ്വാസത്തിന് പകരം അവർ സ്വീകരിച്ചിരിക്കുന്നത് നിഷേധമത്രെ. എന്നാൽ അവരുടെ കച്ചവടം ലാഭകരമായില്ല. കാരണം അല്ലാഹുവിലുള്ള വിശ്വാസമാണ് അവർക്ക് നഷ്ടമായത്. അവർ സത്യത്തിലേക്ക് സന്മാർഗം പ്രാപിച്ചവരുമല്ല." },
  { n: 17, ar: "مَثَلُهُمْ كَمَثَلِ الَّذِي اسْتَوْقَدَ نَارًا فَلَمَّا أَضَاءَتْ مَا حَوْلَهُ ذَهَبَ اللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِي ظُلُمَاتٍ لَّا يُبْصِرُونَ", ml: "അവരെ ഉപമിക്കാവുന്നത്‌ ഒരാളോടാകുന്നു: അയാള്‍ തീ കത്തിച്ചു. പരിസരമാകെ പ്രകാശിതമായപ്പോള്‍ അല്ലാഹു അവരുടെ പ്രകാശം കെടുത്തിക്കളയുകയും ഒന്നും കാണാനാവാതെ ഇരുട്ടില്‍ (തപ്പുവാന്‍) അവരെ വിടുകയും ചെയ്തു.", tf: "ഈ മുനാഫിഖുകളെക്കുറിച്ച് അല്ലാഹു ഒരു തീയിന്റെ ഉദാഹരണം പറയുന്നു. ഒരാൾ വെളിച്ചം ലഭിക്കാനായി തീ കത്തിച്ചു. അതിന്റെ പ്രകാശം പരക്കുകയും വെളിച്ചം കൊണ്ടുള്ള പ്രയോജനം ലഭിക്കുമെന്നുമായപ്പോഴേക്കും അത് കെട്ടുപോയി. പ്രകാശം പരത്തുകയെന്ന തീയിന്റെ പ്രയോജനം ഇല്ലാതായി. പൊള്ളലുണ്ടാക്കുകയെന്ന ഉപദ്രവം മാത്രം ബാക്കിയായി. അങ്ങനെ, അവിടെയുണ്ടായിരുന്നവർ ഒന്നും കാണുകയോ സന്മാർഗ്ഗം പ്രാപിക്കുകയോ ചെയ്യാത്തവരായി അവശേഷിക്കുന്നു. റസൂൽ മദീനയില്‍ വന്ന അവസരത്തില്‍ ചില ആളുകള്‍ ഇസ്‌ലാമില്‍ പ്രവേശിച്ചു. പിന്നീട് അവര്‍ കപടവിശ്വാസികളായി മാറി. അവർ  ആദ്യം ശിര്‍ക്കാകുന്ന ഇരുട്ടിലായിരുന്നു. എന്നിട്ടു അവർ ഇസ്‌ലാം സ്വീകരിച്ചു. അങ്ങിനെയിരിക്കെ (വീണ്ടും) അവിശ്വാസിയായി. അതോടെ അവർ വീണ്ടും ഇരുട്ടിലായി." },
  { n: 18, ar: "صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ", ml: "ബധിരരും ഊമകളും അന്ധന്‍മാരുമാകുന്നു അവര്‍. അതിനാല്‍ അവര്‍ (സത്യത്തിലേക്ക്‌) തിരിച്ചുവരികയില്ല.", tf: "സത്യം ഉൾക്കൊള്ളാൻ വേണ്ടിയുള്ള കേൾവി കേൾക്കാത്ത ബധിരന്മാരാണവർ. യാഥാർത്ഥ്യം സംസാരിക്കാത്ത മൂകൻമാരാണവർ. അത് കാണാത്ത അന്ധൻമാരുമാകുന്നു അവർ. അതിനാൽ അവരുടെ വഴികേടിൽ നിന്ന് അവർ തിരിച്ചുവരികയില്ല." },
  { n: 19, ar: "أَوْ كَصَيِّبٍ مِّنَ السَّمَاءِ فِيهِ ظُلُمَاتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَابِعَهُمْ فِي آذَانِهِم مِّنَ الصَّوَاعِقِ حَذَرَ الْمَوْتِ ۚ وَاللَّهُ مُحِيطٌ بِالْكَافِرِينَ", ml: "അല്ലെങ്കില്‍ (അവരെ) ഉപമിക്കാവുന്നത്‌ ആകാശത്തുനിന്നു ചൊരിയുന്ന ഒരു പേമാരിയോടാകുന്നു. അതോടൊപ്പം കൂരിരുട്ടും ഇടിയും മിന്നലുമുണ്ട്‌. ഇടിനാദങ്ങള്‍ നിമിത്തം മരണം ഭയന്ന്‌ അവര്‍ വിരലുകള്‍ ചെവിയില്‍ തിരുകുന്നു. എന്നാല്‍ അല്ലാഹു സത്യനിഷേധികളെ വലയം ചെയ്തിരിക്കുകയാണ്‌.", tf: "കപടവിശ്വാസികള്‍ക്ക് മറ്റൊരു ഉപമകൂടി അല്ലാഹു ചൂണ്ടിക്കാട്ടുന്നു: അവരുടെ നന്‍മക്കുവേണ്ടി അല്ലാഹുവില്‍നിന്നു അവതരിച്ചുകൊണ്ടിരിക്കുന്ന ഖുർആന്‍ വചനങ്ങള്‍, സന്ദേശങ്ങള്‍, ദൃഷ്ടാന്തങ്ങള്‍, വിധിവിലക്കുകള്‍ ആദിയായവയാണ് മഴയോട് ഉപമിക്കപ്പെട്ടിരിക്കുന്നത്. മഴ ഭൂമിയെ ജീവസ്സുള്ളതാക്കുന്നതുപോലെ അവ മനുഷ്യനും ജീവസ്സുണ്ടാക്കുന്നുവല്ലോ. ശക്തിയായ മഴ വര്‍ഷിക്കുമ്പോള്‍ ഇടിയും മിന്നലും സ്വാഭാവികമാണ്. കപടവിശ്വാസികളുടെ സംശയം, കാപട്യം, ആശയക്കുഴപ്പം, ദുര്‍മോഹം ആദിയായവയാണ് ഇരുട്ടിനോട് സാദൃശ്യപ്പെടുത്തിയിരിക്കുന്നത്. ദിവ്യ സന്ദേശങ്ങളില്‍ അടങ്ങിയിട്ടുള്ള താക്കീതുകള്‍, മുന്നറിയിപ്പുകള്‍ മുതലായവ ഇടികളോടും, അതിലെ ദൃഷ്ടാന്തങ്ങള്‍, സന്തോഷ വാര്‍ത്തകള്‍ മുതലായവ മിന്നലുകളോടും ഉപമിക്കപ്പെട്ടിരിക്കുന്നു. താക്കീതുകളും ശാസനകളും കേട്ട് സഹിക്കവയ്യാതെ ബധിരന്മാരെപ്പോലെ അവര്‍ തിരിഞ്ഞു കളയുന്നതിനെയാണ് ഇടിവാള്‍ നിമിത്തം മരണത്തെ ഭയന്ന് കാതുപൊത്തുന്നതിനോട് ഉപമിച്ചിരിക്കുന്നത്. പക്ഷേ, അവര്‍ കാതുപൊത്തിയതുകൊണ്ട് രക്ഷ കിട്ടുവാന്‍ പോകുന്നില്ല എന്നത്രെ ‘അല്ലാഹു അവിശ്വാസികളെ വലയം ചെയ്യുന്നവനാണ്’ എന്ന് പറഞ്ഞതിന്റെ താല്‍പര്യം." },
  { n: 20, ar: "يَكَادُ الْبَرْقُ يَخْطَفُ أَبْصَارَهُمْ ۖ كُلَّمَا أَضَاءَ لَهُم مَّشَوْا فِيهِ وَإِذَا أَظْلَمَ عَلَيْهِمْ قَامُوا ۚ وَلَوْ شَاءَ اللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَارِهِمْ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", ml: "മിന്നല്‍ അവരുടെ കണ്ണുകളെ റാഞ്ചിയെടുക്കുമാറാകുന്നു. അത്‌ (മിന്നല്‍) അവര്‍ക്ക്‌ വെളിച്ചം നല്‍കുമ്പോഴെല്ലാം അവര്‍ ആ വെളിച്ചത്തില്‍ നടന്നു പോകും. ഇരുട്ടാകുമ്പോള്‍ അവര്‍ നിന്നു പോകുകയും ചെയ്യും. അല്ലാഹു ഉദ്ദേശിച്ചിരുന്നെങ്കില്‍ അവരുടെ കേള്‍വിയും കാഴ്ചയും അവന്‍ തീരെ നശിപ്പിച്ചുകളയുക തന്നെ ചെയ്യുമായിരുന്നു. നിസ്സംശയം അല്ലാഹു ഏത്‌ കാര്യത്തിനും കഴിവുള്ളവനാണ്‌.", tf: "സത്യമാര്‍ഗം സ്വീകരിച്ചാല്‍ ഭൗതികമായും പാരത്രികമായും ലഭിക്കുവാനിരിക്കുന്ന നന്‍മകളെപ്പറ്റി ചിലപ്പോള്‍ അവര്‍ക്ക് ബോധോദയം ഉണ്ടാകും. അങ്ങനെ, ഗതി അല്‍പം മുന്നോട്ടാകും. അപ്പോഴേക്കും സ്വാര്‍ത്ഥ വിചാരങ്ങളും പരീക്ഷണഘട്ടങ്ങളും ഓര്‍മവരും. അതോടെ അത് സ്തംഭനത്തിലാകും. അതാണ് മിന്നല്‍ വെളിച്ചത്തില്‍ മുമ്പോട്ട് നടക്കുമെന്നും ഇരുട്ടായാല്‍ നിന്നു പോകുമെന്നും പറഞ്ഞത്. കണ്ടും കേട്ടും കാര്യങ്ങള്‍ ഗ്രഹിക്കുവാനുള്ള കഴിവ് അല്ലാഹു അവര്‍ക്ക് നല്‍കിയതിനെ അവര്‍ ദുരുപയോഗപ്പെടുത്തിയിരിക്കെ, അവയെ നിശ്ശേഷം എടുത്തുകളയുവാന്‍ അവന് ഒട്ടും പ്രയാസമില്ല. എങ്കിലും അതവന്‍ ഉദ്ദേശിച്ചിട്ടില്ലാത്തതു കൊണ്ട് സംഭവിച്ചിട്ടില്ലെന്ന് മാത്രം.\n\nതീ കൊണ്ടും മഴ കൊണ്ടും ഉള്ള ഉപമകളിൽ പരാമർശിക്കപ്പെട്ടവരും മുനാഫിഖുകളും തമ്മിലുള്ള സാദൃശ്യം അവർ അത് കൊണ്ട് ഒരു പ്രയോജനവും നേടുന്നില്ല എന്നതാണ് . തീ കൊണ്ടുള്ള ഉപമയിൽ, തീ കത്തിക്കുന്നവർക്ക് ഇരുട്ടും പൊള്ളലുമല്ലാതെ മറ്റൊരു പ്രയോജനവും ലഭിച്ചില്ല. മഴകൊണ്ടുള്ള ഉപമയിൽ, മഴയോട് ഉപമിക്കപ്പെട്ടത് ഖുർആനാകുന്നു. അതിലെ താക്കീതുകളും ശാസനകളും ഇടിയുടെ ശബ്ദങ്ങളോടും, ഇടക്കിടെ അവർക്ക് പ്രകടമാകുന്ന സത്യങ്ങളെ മിന്നലുകളോടും ഉപമിക്കപ്പെട്ടിരിക്കുന്നു. സത്യത്തിൽ നിന്ന് അവർ പിന്തിരിയുന്നതും അത് അവർ സ്വീകരിക്കാത്തതും, ഇടിയുടെ ശക്തി കാരണം ചെവി പൊത്തുന്നതിനോടുമാണ് ഉപമിച്ചിരിക്കുന്നത്. മഴ കൊണ്ട് അവർക്ക് ഇടിയും മിന്നലും നിമിത്തമുള്ള ഭയമല്ലാതെ ഒന്നും പ്രയോജനപ്പെട്ടില്ല. ഇപ്രകാരം മുനാഫിഖുകൾ ഇസ്ലാമിൽ കാഠിന്യവും തീവ്രതയുമല്ലാതെ മറ്റൊന്നും കാണുന്നില്ല." }
];

/* ===== SAVED OPTIONS (shared with every chapter page) ===== */
const SKEY = "quran-reader-settings";
const CHECKS = ["show-ar", "show-ml", "show-tf", "opt-ar", "opt-ml", "opt-tf"];
let fontSize = 18, reciterId = "ghamdy";
function loadSettings() { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } }
function saveSettings() {
  const s = loadSettings();
  Object.assign(s, { fontSize, reciterId, repeat: $("repeat").value, voiceMl: $("voice-ml").value, voiceTf: $("voice-tf").value });
  CHECKS.forEach(id => s[id] = $(id).checked);
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
}
function applySettings() {
  const s = loadSettings();
  if (s.fontSize) { fontSize = s.fontSize; document.documentElement.style.setProperty("--fs", fontSize + "px"); $("fs-label").textContent = fontSize; }
  CHECKS.forEach(id => { if (id in s) $(id).checked = s[id]; });
  if (s.repeat) $("repeat").value = s.repeat;
}

/* ===== BUILD PAGE ===== */
function buildPage() {
  $("verses").innerHTML = VERSES.map(v => `
    <div class="verse" id="verse-${v.n}">
      <div class="vhead"><span>ആയത്ത് ${v.n}</span></div>
      <div class="item it-ar" id="item-ar-${v.n}"><div class="row rtl">
        <button class="play-btn" id="btn-ar-${v.n}" onclick="toggleItem('ar', ${v.n})">▶</button>
        <p class="text ar" lang="ar" dir="rtl">${v.ar}</p></div></div>
      ${v.ml ? `<div class="item it-ml" id="item-ml-${v.n}"><div class="row">
        <button class="play-btn" id="btn-ml-${v.n}" onclick="toggleItem('ml', ${v.n})">▶</button>
        <p class="text"><span class="tag">സാരം:</span>${v.ml}</p></div></div>` : ""}
      ${v.tf ? `<button class="small-btn tf-btn" id="tgl-${v.n}" onclick="toggleTafseer(${v.n})">വിവരണം</button>
        <div class="item it-tf hidden" id="item-tf-${v.n}"><div class="row">
        <button class="play-btn" id="btn-tf-${v.n}" onclick="toggleItem('tf', ${v.n})">▶</button>
        <p class="text"><span class="pl">${v.tf}</span></p></div></div>` : ""}
    </div>`).join("");
}
function changeFont(d) {
  fontSize = Math.min(40, Math.max(12, fontSize + d));
  document.documentElement.style.setProperty("--fs", fontSize + "px");
  $("fs-label").textContent = fontSize; saveSettings();
}
function setTafseerVisible(n, show) {
  const b = $("item-tf-" + n), t = $("tgl-" + n);
  if (!b) return; b.classList.toggle("hidden", !show); t.classList.toggle("open", show);
}
function toggleTafseer(n) {
  const willShow = $("item-tf-" + n).classList.contains("hidden");
  if (!willShow && activeKey === "tf-" + n) stopAll();
  setTafseerVisible(n, willShow);
}
function applyDisplay() {
  const on = id => $(id).checked;
  document.body.classList.toggle("hide-ar", !on("show-ar"));
  document.body.classList.toggle("hide-ml", !on("show-ml"));
  document.body.classList.toggle("hide-tf", !on("show-tf"));
  if (!on("show-tf") && activeKey && activeKey.startsWith("tf-") && !continuous) stopAll();
  VERSES.forEach(v => { if (v.tf) setTafseerVisible(v.n, on("show-tf")); });
}

function startNoSleep() {
  try {

  const step = i => {
    if (my !== token) return;
    if (i >= queue.length) { stopAll(); statusEl.textContent = "പൂർത്തിയായി."; return; }
    const { kind, n } = queue[i]; mark(kind + "-" + n);
    playItem(kind, n, my, () => { if (my === token) step(i + 1); });
  };
  step(0);
}
function toggleItem(kind, n) {
  if (activeKey === kind + "-" + n) { stopAll(); return; }
  const q = fullQueue(kind, n), i = q.findIndex(x => x.kind === kind && x.n === n);
  runQueue($("cont").checked ? q.slice(i) : [q[i]]);
}
function toggleContinuous() {   // "start from the beginning" button
  if (masterBtn.classList.contains("playing")) { stopAll(); return; }
  runQueue(fullQueue(), true);
}
