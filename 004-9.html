    "ml": "(നബിയേ,) അവര്‍ നിന്നോട് മതവിധി അന്വേഷിക്കുന്നു. പറയുക: കലാലത്തിന്‍റെ പ്രശ്നത്തില്‍ അല്ലാഹു നിങ്ങള്‍ക്കിതാ മതവിധി പറഞ്ഞുതരുന്നു. അതായത് ഒരാള്‍ മരിച്ചു; അയാള്‍ക്ക് സന്താനമില്ല; ഒരു സഹോദരിയുണ്ട്‌. എങ്കില്‍ അയാള്‍ വിട്ടേച്ചു പോയതിന്‍റെ പകുതി അവള്‍ക്കുള്ളതാണ്‌. ഇനി (സഹോദരി മരിക്കുകയും) അവള്‍ക്ക് സന്താനമില്ലാതിരിക്കുകയുമാണെങ്കില്‍ സഹോദരന്‍ അവളുടെ (പൂര്‍ണ്ണ) അവകാശിയായിരിക്കും. ഇനി രണ്ട് സഹോദരികളാണുള്ളതെങ്കില്‍, അവന്‍ (സഹോദരന്‍) വിട്ടേച്ചുപോയ സ്വത്തിന്‍റെ മൂന്നില്‍ രണ്ടു ഭാഗം അവര്‍ക്കുള്ളതാണ്‌. ഇനി സഹോദരന്‍മാരും സഹോദരിമാരും കൂടിയാണുള്ളതെങ്കില്‍, ആണിന് രണ്ട് പെണ്ണിന്‍റെതിന് തുല്യമായ ഓഹരിയാണുള്ളത്‌. നിങ്ങള്‍ പിഴച്ച് പോകുമെന്ന് കരുതി അല്ലാഹു നിങ്ങള്‍ക്ക് കാര്യങ്ങള്‍ വിവരിച്ചുതരുന്നു. അല്ലാഹു ഏത് കാര്യത്തെപ്പറ്റിയും അറിവുള്ളവനാകുന്നു.",
