<style>

.ai-box{margin:24px auto 0;padding:clamp(14px,3vw,22px);border:2px solid var(--gold);border-radius:12px;background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,.06)}

<script>
/* Chapter data only. Everything else (playback, options, wake lock, tafsir loading ...) is in player.js */
/* ===== PAGE SETTINGS ===== */
const SURAH = 7;
const SURAH_NAME = "സൂറത്തുൽ അൽ അഅ്റാഫ്";

/* ===== VERSES ===== */
const VERSES = [
  {
    "n": 1,
    "ar": "الٓمٓصٓ",
    "ml": "അലിഫ്‌-ലാം-മീം-സ്വാദ്‌.",
    "tf": ""
  },
  {
    "n": 2,
    "ar": "كِتَٰبٌ أُنزِلَ إِلَيْكَ فَلَا يَكُن فِى صَدْرِكَ حَرَجٌۭ مِّنْهُ لِتُنذِرَ بِهِۦ وَذِكْرَىٰ لِلْمُؤْمِنِينَ",
    "ml": "(നബിയേ,) നിനക്ക് അവതരിപ്പിക്കപ്പെട്ട ഗ്രന്ഥമത്രെ ഇത്‌. അതിനെ സംബന്ധിച്ച് നിന്‍റെ മനസ്സില്‍ ഒരു പ്രയാസവും ഉണ്ടായിരിക്കരുത്‌. അതു മുഖേന നീ താക്കീത് നല്‍കുവാന്‍ വേണ്ടിയും സത്യവിശ്വാസികള്‍ക്ക് ഉല്‍ബോധനം നല്‍കുവാന്‍ വേണ്ടിയുമാണത്‌.",
    "tf": ""
  },
  {
    "n": 3,
    "ar": "ٱتَّبِعُوا۟ مَآ أُنزِلَ إِلَيْكُم مِّن رَّبِّكُمْ وَلَا تَتَّبِعُوا۟ مِن دُونِهِۦٓ أَوْلِيَآءَ ۗ قَلِيلًۭا مَّا تَذَكَّرُونَ",
    "ml": "നിങ്ങളുടെ രക്ഷിതാവിങ്കല്‍ നിന്ന് നിങ്ങള്‍ക്കായി അവതരിപ്പിക്കപ്പെട്ടത് നിങ്ങള്‍ പിന്‍പറ്റുക. അവനു പുറമെ മറ്റു രക്ഷാധികാരികളെ നിങ്ങള്‍ പിന്‍പറ്റരുത്‌. വളരെ കുറച്ച് മാത്രമേ നിങ്ങള്‍ ആലോചിച്ച് മനസ്സിലാക്കുന്നുള്ളൂ.",
    "tf": ""
  },
  {
    "n": 4,
    "ar": "وَكَم مِّن قَرْيَةٍ أَهْلَكْنَٰهَا فَجَآءَهَا بَأْسُنَا بَيَٰتًا أَوْ هُمْ قَآئِلُونَ",
    "ml": "എത്രയോ രാജ്യങ്ങളെ നാം നശിപ്പിച്ചിട്ടുണ്ട്‌. രാത്രിയിലോ, അവര്‍ ഉച്ചയുറക്കത്തിലായിരിക്കുമ്പോഴോ നമ്മുടെ ശിക്ഷ അവര്‍ക്ക് വന്നുഭവിച്ചു.",
    "tf": ""
  },
  {
    "n": 5,
    "ar": "فَمَا كَانَ دَعْوَىٰهُمْ إِذْ جَآءَهُم بَأْسُنَآ إِلَّآ أَن قَالُوٓا۟ إِنَّا كُنَّا ظَٰلِمِينَ",
    "ml": "അവര്‍ക്ക് നമ്മുടെ ശിക്ഷ വന്നുഭവിച്ചപ്പോള്‍ ഞങ്ങള്‍ അക്രമികളായിപ്പോയല്ലോ എന്ന് പറയുക മാത്രമായിരുന്നു അവരുടെ മുറവിളി.",
    "tf": ""
  },
  {
    "n": 6,
    "ar": "فَلَنَسْـَٔلَنَّ ٱلَّذِينَ أُرْسِلَ إِلَيْهِمْ وَلَنَسْـَٔلَنَّ ٱلْمُرْسَلِينَ",
    "ml": "എന്നാല്‍ (നമ്മുടെ ദൂതന്‍മാര്‍) ആര്‍ക്കിടയിലേക്ക് അയക്കപ്പെട്ടുവോ അവരെ തീര്‍ച്ചയായും നാം ചോദ്യം ചെയ്യും. അയക്കപ്പെട്ട ദൂതന്‍മാരെയും തീര്‍ച്ചയായും നാം ചോദ്യം ചെയ്യും.",
    "tf": ""
  },
  {
    "n": 7,
    "ar": "فَلَنَقُصَّنَّ عَلَيْهِم بِعِلْمٍۢ ۖ وَمَا كُنَّا غَآئِبِينَ",
    "ml": "എന്നിട്ട് ശരിയായ അറിവോടുകൂടി നാം അവര്‍ക്കു (കാര്യം) വിവരിച്ചുകൊടുക്കുന്നതാണ്‌. ഒരിക്കലും നമ്മുടെ അസാന്നിദ്ധ്യം ഉണ്ടായിട്ടില്ല.",
    "tf": ""
  },
  {
    "n": 8,
    "ar": "وَٱلْوَزْنُ يَوْمَئِذٍ ٱلْحَقُّ ۚ فَمَن ثَقُلَتْ مَوَٰزِينُهُۥ فَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ",
    "ml": "അന്നത്തെ ദിവസം (കര്‍മ്മങ്ങള്‍) തൂക്കികണക്കാക്കുന്നത് സത്യമായിരിക്കും. അപ്പോള്‍ ആരുടെ തുലാസുകള്‍ ഘനം തൂങ്ങിയോ അവരാണ് വിജയികള്‍.",
    "tf": ""
  },
  {
    "n": 9,
    "ar": "وَمَنْ خَفَّتْ مَوَٰزِينُهُۥ فَأُو۟لَٰٓئِكَ ٱلَّذِينَ خَسِرُوٓا۟ أَنفُسَهُم بِمَا كَانُوا۟ بِـَٔايَٰتِنَا يَظْلِمُونَ",
    "ml": "ആരുടെ തുലാസുകള്‍ ഘനം കുറഞ്ഞുവോ അവരാണ് ആത്മനഷ്ടം നേരിട്ടവര്‍. നമ്മുടെ ദൃഷ്ടാന്തങ്ങളുടെ നേരെ അവര്‍ അന്യായം കൈക്കൊണ്ടിരുന്നതിന്‍റെ ഫലമത്രെ അത്‌.",
    "tf": ""
  },
  {
