<style>
:root{--fs:18px;--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--acc:#1d5240;--soft:rgba(212,175,55,.16)}

button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fs-group{display:inline-flex;align-items:center;gap:4px}

.verse,.item{min-width:0}

.item.reading{background:var(--soft);border-color:var(--gold)}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}

.play-btn{flex:0 0 32px;width:32px;height:32px;border:none;border-radius:50%;background-color:var(--green2);color:#fff;font-size:13px;line-height:32px;padding:0;margin-top:2px;cursor:pointer}

.text{flex:1;min-width:0;margin:0;text-align:left;line-height:1.7;font-size:var(--fs);overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:12px;color:var(--muted);margin-right:4px}
.pl{white-space:pre-line}
.text.ar{font-size:calc(var(--fs) * 1.5);text-align:right;line-height:2;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}

.hidden{display:none}
.tf-btn{display:block;margin:4px 0 6px 6px}
.it-tf{border-top:1px dashed var(--line);margin-top:2px}
body.hide-ar .it-ar{display:none}
body.hide-ml .it-ml{display:none}
body.hide-tf .it-tf,body.hide-tf .tf-btn{display:none}
.ai-box{margin:24px auto 0;padding:clamp(14px,3vw,22px);border:2px solid var(--gold);border-radius:12px;background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,.06)}

.ai-box>.main-btn{display:block;margin:0 auto}
.ai-out{margin:10px 0;line-height:1.7;font-size:var(--fs);white-space:pre-line}

.q-btn{font-family:inherit;text-align:left;border:1px solid var(--line);border-top:3px solid var(--gold);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:calc(var(--fs) * .85);cursor:pointer}
.q-btn:hover,.q-btn:focus-visible{background:var(--green2);color:#fff;outline:none}
.ai-ask{display:flex;gap:6px;margin-top:8px}
.ai-ask input{flex:1;min-width:0;padding:8px;font-size:15px}
.quiz-q{margin:12px 0;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.quiz-q p{margin:0 0 6px;font-size:var(--fs)}
.quiz-opt{font-family:inherit;display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:calc(var(--fs) * .9);cursor:pointer}

.quiz-exp{font-size:calc(var(--fs) * .8);color:var(--muted);margin-top:4px}

.topnav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:0 12px}
.topnav .back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.9rem, 3.2vw, 1.05rem);

  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}

<script>
/* Chapter data only. Everything else (playback, options, wake lock, tafsir loading ...) is in player.js */
/* ===== PAGE SETTINGS ===== */
const SURAH = 36;
const SURAH_NAME = "സൂറത്തുൽ യാസീൻ";

/* ===== VERSES ===== */
const VERSES = [
  {
    "n": 1,
    "ar": "يسٓ",
    "ml": "യാസീന്‍ ‍.",
    "tf": ""
  },
  {
    "n": 2,
    "ar": "وَٱلْقُرْءَانِ ٱلْحَكِيمِ",

    "tf": ""
  },
  {
    "n": 3,
    "ar": "إِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ",
    "ml": "നീ ദൈവദൂതന്‍മാരില്‍ പെട്ടവന്‍ തന്നെയാകുന്നു.",
    "tf": ""
  },
  {
    "n": 4,
    "ar": "عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ",

  {
    "n": 5,
    "ar": "تَنزِيلَ ٱلْعَزِيزِ ٱلرَّحِيمِ",
    "ml": "പ്രതാപിയും കരുണാനിധിയുമായിട്ടുള്ളവന്‍ അവതരിപ്പിച്ചതത്രെ ഇത്‌. (ഖുര്‍ആന്‍).",
    "tf": ""
  },
  {
    "n": 6,
    "ar": "لِتُنذِرَ قَوْمًۭا مَّآ أُنذِرَ ءَابَآؤُهُمْ فَهُمْ غَٰفِلُونَ",
    "ml": "ഒരു ജനതയ്ക്ക് നീ താക്കീത് നല്‍കുവാന്‍ വേണ്ടി. അവരുടെ പിതാക്കന്‍മാര്‍ക്ക് താക്കീത് നല്‍കപ്പെട്ടിട്ടില്ല. അതിനാല്‍ അവര്‍ അശ്രദ്ധയില്‍ കഴിയുന്നവരാകുന്നു.",
    "tf": ""
  },
  {
    "n": 7,
    "ar": "لَقَدْ حَقَّ ٱلْقَوْلُ عَلَىٰٓ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ",
    "ml": "അവരില്‍ മിക്കവരുടെ കാര്യത്തിലും (ശിക്ഷയെ സംബന്ധിച്ച) വചനം സത്യമായി പുലര്‍ന്നിരിക്കുന്നു. അതിനാല്‍ അവര്‍ വിശ്വസിക്കുകയില്ല.",
    "tf": ""
  },
  {
    "n": 8,
    "ar": "إِنَّا جَعَلْنَا فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ",
    "ml": "അവരുടെ കഴുത്തുകളില്‍ നാം ചങ്ങലകള്‍ വെച്ചിരിക്കുന്നു. അത് (അവരുടെ) താടിയെല്ലുകള്‍ വരെ എത്തുന്നു. തന്‍മൂലം അവര്‍ തലകുത്തനെ പിടിച്ചവരായിരിക്കും.",
    "tf": ""
  },
  {
    "n": 9,
    "ar": "وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّۭا وَمِنْ خَلْفِهِمْ سَدًّۭا فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَ",
    "ml": "അവരുടെ മുമ്പില്‍ ഒരു തടസ്സവും അവരുടെ പിന്നില്‍ ഒരു തടസ്സവും നാം വെച്ചിരിക്കുന്നു. അങ്ങനെ നാം അവരെ മൂടിക്കളഞ്ഞു; അതിനാല്‍ അവര്‍ക്ക് കാണാന്‍ കഴിയില്ല.",
    "tf": ""
  },
  {
    "n": 10,
    "ar": "وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ",
    "ml": "നീ അവര്‍ക്ക് താക്കീത് നല്‍കിയോ അതല്ല താക്കീത് നല്‍കിയില്ലേ എന്നത് അവരെ സംബന്ധിച്ചിടത്തോളം സമമാകുന്നു. അവര്‍ വിശ്വസിക്കുകയില്ല.",
    "tf": ""
  },
  {
    "n": 11,
    "ar": "إِنَّمَا تُنذِرُ مَنِ ٱتَّبَعَ ٱلذِّكْرَ وَخَشِىَ ٱلرَّحْمَٰنَ بِٱلْغَيْبِ ۖ فَبَشِّرْهُ بِمَغْفِرَةٍۢ وَأَجْرٍۢ كَرِيمٍ",
    "ml": "ബോധനം പിന്‍പറ്റുകയും, അദൃശ്യാവസ്ഥയില്‍ പരമകാരുണികനെ ഭയപ്പെടുകയും ചെയ്തവനു മാത്രമേ നിന്‍റെ താക്കീത് ഫലപ്പെടുകയുള്ളൂ. ആകയാല്‍ പാപമോചനത്തെയും ഉദാരമായ പ്രതിഫലത്തെയും പറ്റി അവന്ന് സന്തോഷവാര്‍ത്ത അറിയിക്കുക.",
    "tf": ""
  },
  {
