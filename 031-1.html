    "ml": "തീര്‍ച്ചയായും; വിശ്വസിക്കുകയും സല്‍കര്‍മ്മങ്ങള്‍ പ്രവര്‍ത്തിക്കുകയും ചെയ്തവരാരോ അവര്‍ക്കുള്ളതാണ് സുഖാനുഭൂതിയുടെ സ്വര്‍ഗത്തോപ്പുകള്‍.",

  {

    "ar": "خَٰلِدِينَ فِيهَا ۖ وَعْدَ ٱللَّهِ حَقًّۭا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ",
    "ml": "അവര്‍ അതില്‍ നിത്യവാസികളായിരിക്കും. അല്ലാഹുവിന്‍റെ സത്യവാഗ്ദാനമത്രെ അത്‌. അവനാകുന്നു പ്രതാപിയും യുക്തിമാനും.",
