  {
    "n": 4,
    "ar": "إِنَّ فِرْعَوْنَ عَلَا فِى ٱلْأَرْضِ وَجَعَلَ أَهْلَهَا شِيَعًۭا يَسْتَضْعِفُ طَآئِفَةًۭ مِّنْهُمْ يُذَبِّحُ أَبْنَآءَهُمْ وَيَسْتَحْىِۦ نِسَآءَهُمْ ۚ إِنَّهُۥ كَانَ مِنَ ٱلْمُفْسِدِينَ",
    "ml": "തീര്‍ച്ചയായും ഫിര്‍ഔന്‍ നാട്ടില്‍ ഔന്നത്യം നടിച്ചു. അവിടത്തുകാരെ അവന്‍ വ്യത്യസ്ത കക്ഷികളാക്കിത്തീര്‍ക്കുകയും ചെയ്തു. അവരില്‍ ഒരു വിഭാഗത്തെ ദുര്‍ബലരാക്കിയിട്ട് അവരുടെ ആണ്‍മക്കളെ അറുകൊല നടത്തുകയും അവരുടെ പെണ്‍മക്കളെ ജീവിക്കാന്‍ അനുവദിക്കുകയും ചെയ്തുകൊണ്ട്‌. തീര്‍ച്ചയായും അവന്‍ നാശകാരികളില്‍ പെട്ടവനായിരുന്നു.",

    "tf": ""
  },
  {
    "n": 7,

    "ml": "മൂസായുടെ മാതാവിന് നാം ബോധനം നല്‍കി: അവന്ന് നീ മുലകൊടുത്തു കൊള്ളുക. ഇനി അവന്‍റെ കാര്യത്തില്‍ നിനക്ക് ഭയം തോന്നുകയാണെങ്കില്‍ അവനെ നീ നദിയില്‍ ഇട്ടേക്കുക. നീ ഭയപ്പെടുകയും ദുഃഖിക്കുകയും വേണ്ട. തീര്‍ച്ചയായും അവനെ നാം നിന്‍റെ അടുത്തേക്ക് തിരിച്ച് കൊണ്ട് വരുന്നതും , അവനെ ദൈവദൂതന്‍മാരില്‍ ഒരാളാക്കുന്നതുമാണ്‌.",
