<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ആയത്തും തഫ്സീറും</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--tfs:20px}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Noto Sans Malayalam",sans-serif;background:var(--paper);color:var(--ink);line-height:1.9}
.banner{text-align:center;color:#fff;padding:14px 0 16px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.banner h1{font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:500;line-height:1.4;margin-top:4px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 12px 40px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(14px,3vw,26px);box-shadow:0 4px 15px rgba(0,0,0,.06);margin-bottom:18px}
h2{color:var(--green2);font-size:1.15rem;text-align:center}
@media(prefers-color-scheme:dark){h2{color:var(--gold)}}

/* Responsive Control Panel optimized for mobile screens */
.controls{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.control-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.controls label{font-weight:600;color:var(--green2);display:flex;flex-direction:column;gap:4px;font-size:0.9rem;flex:1;min-width:120px}
@media(prefers-color-scheme:dark){.controls label{color:var(--gold)}}

input,select{font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--green2);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
button{font-family:inherit;font-size:.95rem;font-weight:600;padding:10px 18px;border:none;border-radius:20px;background:var(--green2);color:#fff;cursor:pointer;flex:1;min-width:110px}
button.alt{background:transparent;color:var(--green2);border:1px solid var(--green2)}
@media(prefers-color-scheme:dark){button.alt{color:var(--gold);border-color:var(--gold)}}
button.stop{background:#d93025;color:#fff}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.ref{text-align:center;font-weight:700;color:var(--green2);margin-bottom:6px}
@media(prefers-color-scheme:dark){.ref{color:var(--gold)}}
.ar{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:clamp(1.6rem,6vw,2.4rem);line-height:2.2;color:var(--green2);overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){.ar{color:var(--ink)}}
audio{width:100%;margin-top:10px}
.tr{font-size:1.1rem;line-height:1.9;margin:6px 0 12px;overflow-wrap:anywhere}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:.75rem;color:var(--muted);min-height:1.2em;margin-top:6px}
.tafsir{background:var(--paper);border-radius:10px;padding:clamp(14px,3.5vw,28px);font-size:var(--tfs);line-height:2;min-height:55vh;white-space:pre-line;overflow-wrap:anywhere;text-align:left}
.tafsir.rtl{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",serif;font-size:calc(var(--tfs) * 1.2);line-height:2.3}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:.9rem}
.err{color:#d93025;text-align:center;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}

.topnav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:0 12px}
.topnav .back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.95rem, 3.4vw, 1.1rem);
  font-weight: 500;
  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}
</style>
</head>
<body>
<header class="banner">
  <div class="topnav">
    <a class="back" href="https://onlinenanma.github.io/quran/" target="_top"><span style="font-size: 1.25em;">🏠</span> ഹോം</a>
    <a class="back" href="https://onlinenanma.github.io/quran/surah-index" target="_top">സൂറത്ത് പട്ടിക <span style="font-size: 1.25em;">📖</span></a>
  </div>
  <h1>ആയത്തും തഫ്സീറും</h1>
</header>

<main class="wrap">
  <section class="card">
    <h2 style="margin-bottom:12px">ആയത്ത് തെരഞ്ഞെടുക്കുക</h2>
    <div class="controls">
      <div class="control-row">
        <label>സൂറത്ത്: <input type="number" id="sNo" min="1" max="114" value="1"></label>
        <label>ആയത്ത്: <input type="number" id="aNo" min="1" value="1"></label>
      </div>
      <div class="control-row">
        <label style="flex: 2;">പാരായണം: 
          <select id="reciterFolder" onchange="setAudio()">
            <option value="Alafasy_64kbps" selected>Mishary Rashid Alafasy</option>
            <option value="Abdurrahmaan_As-Sudais_64kbps">Abdul Rahman Al-Sudais</option>
            <option value="Abdul_Basit_64kbps">Abdul Basit</option>
            <option value="Minshaw_64kbps">Mohamed Siddiq El-Minshawi</option>
            <option value="Husary_64kbps">Mahmoud Khalil Al-Hussary</option>
            <option value="Hudhaify_64kbps">Ali Al-Hudhaify</option>
          </select>
        </label>
      </div>
      <div class="btn-group">
        <button type="button" onclick="go()">കാണിക്കുക</button>
        <button type="button" class="alt" id="prev" onclick="step(-1)">◀ മുമ്പത്തേത്</button>
        <button type="button" class="alt" id="next" onclick="step(1)">അടുത്തത് ▶</button>
      </div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <div class="ref" id="ref"></div>
    <div class="ar" id="ar" lang="ar">ലോഡ് ചെയ്യുന്നു...</div>
    <audio id="aud" controls></audio>
  </section>

  <section class="card">
    <h2>സാരം</h2>
    <p class="tr" id="tr"></p>
    <button type="button" id="bV" onclick="toggle('V')">🔊 കേൾക്കാം</button>
    <div class="st" id="sV"></div>
  </section>

  <section class="card">
    <h2 style="margin-bottom:12px">തഫ്സീർ</h2>
    <div class="bar">
      <select id="tsel" onchange="loadTafsir()" aria-label="തഫ്സീർ തെരഞ്ഞെടുക്കാം">
        <option value="169">Ibn Kathir(Englsih)</option>
        <option value="14">Ibn Kathir(Arabic)</option>
        <option value="16">Ibn Kathir Summary(Arabic)</option>
        <option value="15">Tabari</option>
        <option value="91">Saadi</option>
      </select>
      <div class="grp">
        <button type="button" class="alt" onclick="fs(-2)" aria-label="അക്ഷരം ചെറുതാക്കുക">A−</button>
        <button type="button" class="alt" onclick="fs(2)" aria-label="അക്ഷരം വലുതാക്കുക">A+</button>
        <button type="button" id="bT" onclick="toggle('T')">🔊 കേൾക്കാം</button>
      </div>
    </div>
    <!-- Added class="notranslate" below to prevent automatic translation widgets from altering original text -->
    <div class="tafsir notranslate" id="tafsir" translate="no"></div>
    <div class="st" id="sT"></div>
  </section>
</main>
<footer>© ഖുർആൻ മലയാള സാരം</footer>

<script>
const $ = id => document.getElementById(id);
let S = 1, A = 1, trans = "", raw = "", token = 0, tfs = 20, gen = 0, tgen = 0;
const utt = [];

/* HTML -> plain text, keeping paragraph breaks */
const toText = h => new DOMParser().parseFromString(String(h).replace(/<\/(p|div|h\d|li)>|<br\s*\/?>/gi, "\n"), "text/html").body.textContent || "";

/* ---------- font size (remembered) ---------- */
try { tfs = +localStorage.getItem("qr-tfs") || 20; } catch (e) {}
function fs(d) {
  tfs = Math.min(40, Math.max(16, tfs + (d || 0)));
  document.documentElement.style.setProperty("--tfs", tfs + "px");
  try { localStorage.setItem("qr-tfs", tfs); } catch (e) {}
}
fs(0);

/* ---------- keep the screen awake while listening (otherwise it dims and speech stops) ---------- */
let wl = null;
async function wakeOn() { try { if ("wakeLock" in navigator && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch (e) {} }
function wakeOff() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ($("bV").classList.contains("stop") || $("bT").classList.contains("stop"))) wakeOn(); });

/* ---------- verse ---------- */
/* Number of ayahs in each of the 114 surahs (total 6236) */
const COUNTS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
function setSurahLimit() { $("aNo").max = COUNTS[(parseInt($("sNo").value) || 1) - 1] || 286; }
$("sNo").addEventListener("input", setSurahLimit);

/* EveryAyah audio: <folder>/SSSAAA.mp3 ; if the chosen reciter's file is missing, Alafasy is used */
const DEFAULT_FOLDER = "Alafasy_64kbps";
const audioSrc = folder => `https://everyayah.com/data/${folder}/${String(S).padStart(3, "0")}${String(A).padStart(3, "0")}.mp3`;
function setAudio() { const a = $("aud"); a.dataset.fb = ""; $("err").textContent = ""; a.src = audioSrc($("reciterFolder").value); }
$("aud").addEventListener("error", () => {
  const a = $("aud");
  if (a.src && $("reciterFolder").value !== DEFAULT_FOLDER && !a.dataset.fb) {
    a.dataset.fb = "1";
    $("err").textContent = "തിരഞ്ഞെടുത്ത ഖാരിഇന്റെ ഓഡിയോ ലഭ്യമല്ല; മിശാരി അൽ അഫാസിയുടെ പാരായണം ഉപയോഗിക്കുന്നു.";
    a.src = audioSrc(DEFAULT_FOLDER);
  }
});

async function go() {
  stop(); $("err").textContent = "";
  const s = parseInt($("sNo").value), a = parseInt($("aNo").value);
  if (!(s >= 1 && s <= 114) || !(a >= 1)) { $("err").textContent = "ദയവായി സാധുവായ സൂറത്ത്, ആയത്ത് നമ്പർ നൽകുക."; return; }
  if (a > COUNTS[s - 1]) { $("err").textContent = `ഈ സൂറത്തിൽ ${COUNTS[s - 1]} ആയത്തുകൾ മാത്രമേയുള്ളൂ.`; return; }
  S = s; A = a; setSurahLimit();
  const my = ++gen;                         // ignore answers that arrive late
  try {
    const res = await fetch(`https://api.alquran.cloud/v1/ayah/${S}:${A}/editions/quran-uthmani,ml.abdulhameed`);
    const d = await res.json();
    if (my !== gen) return;
    if (d.code !== 200 || !d.data || d.data.length < 2) throw 0;
    const [ar, ml] = d.data;
    trans = ml.text;
    $("ref").textContent = `${ar.surah.englishName} (${ar.surah.name}) · ${S}: ${String(ar.numberInSurah).padStart(3, "0")}`;
    $("ar").textContent = ar.text; $("tr").textContent = trans;
    setAudio();
  } catch (e) { if (my === gen) $("err").textContent = "വിവരങ്ങൾ ലഭ്യമാക്കാൻ സാധിച്ചില്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക."; return; }
  try { history.replaceState(null, "", "?s=" + S + "&a=" + A); } catch (e) {}   // refresh keeps the verse; same tab
  loadTafsir();
}
function step(d) {
  let s = S, a = A + d;
  if (a > COUNTS[s - 1]) { s++; a = 1; }
  else if (a < 1) { s--; a = COUNTS[s - 1] || 1; }   // previous surah: its last verse
  if (s < 1 || s > 114) return;
  $("sNo").value = s; $("aNo").value = a; go();
}

/* ---------- tafsir ---------- */
async function loadTafsir() {
  stop();
  const my = ++tgen;
  $("tafsir").textContent = "തഫ്സീർ ലോഡ് ചെയ്യുന്നു...";
  try {
    const r = await fetch(`https://api.quran.com/api/v4/tafsirs/${$("tsel").value}/by_ayah/${S}:${A}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (my !== tgen) return;
    raw = d && d.tafsir && d.tafsir.text ? toText(d.tafsir.text).trim() : "Tafsir content not available for this verse.";
    raw = raw.replace(/\n{3,}/g, "\n\n");
    show();
  } catch (e) { if (my === tgen) $("tafsir").textContent = "തഫ്സീർ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു."; }
}
function show() {
  const t = $("tafsir");
  t.classList.toggle("rtl", $("tsel").value !== "169");
  t.textContent = raw;   // always the complete tafsir
}

/* ---------- text to speech ---------- */
const sc = v => (/natural|neural|enhanced|premium|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 1 : 0) + (v.localService ? 0 : 1);
function voice(lang) {
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(lang));
  return vs.sort((a, b) => sc(b) - sc(a))[0] || null;
}
function clean(t, lang) {
  t = toText(t);
  if (lang === "ar") t = t.replace(/[\u0610-\u061a\u064b-\u065f\u0670\u06d6-\u06ed]/g, "");   // tashkeel breaks Android TTS
  return t.replace(/[()\u2018\u2019\u201C\u201D"]/g, "").replace(/\s+/g, " ").trim();
}
function split(text, max = 150) {
  const sents = text.match(/[^.,:;!?।،؛؟]+[.,:;!?।،؛؟]*/g) || [text], out = []; let cur = "";
  for (let s of sents) {
    s = s.trim();
    while (s.length > max) {
      let cut = s.lastIndexOf(" ", max); if (cut <= 0) cut = max;
      if (cur) { out.push(cur); cur = ""; }
      out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
    }
    if (!s) continue;
    if (cur && (cur + " " + s).length > max) { out.push(cur); cur = s; } else cur = cur ? cur + " " + s : s;
  }
  if (cur) out.push(cur);
  return out.filter(c => /[^\s.,:;!?।،؛؟]/.test(c));
}
function stop() {
  token++; if (window.speechSynthesis) speechSynthesis.cancel();
  ["bV", "bT"].forEach(id => { $(id).textContent = "🔊 കേൾക്കാം"; $(id).classList.remove("stop"); });
  $("sV").textContent = ""; $("sT").textContent = "";
  wakeOff();
}
function say(text, lang, my, st) {
  if (!window.speechSynthesis) { st.textContent = "Speech is not supported in this browser."; return; }
  const ch = split(text), v = voice(lang);
  const next = i => {                         // one chunk at a time keeps long tafsir stable on phones
    if (my !== token) return;
    if (i >= ch.length) { stop(); return; }
    st.textContent = (v ? v.name : "default voice") + " · " + (i + 1) + "/" + ch.length;
    const u = new SpeechSynthesisUtterance(ch[i]); utt[0] = u;
    if (v) u.voice = v;
    u.lang = v ? v.lang : { ml: "ml-IN", ar: "ar-SA", en: "en-US" }[lang]; u.rate = 0.95;
    let done = false;
    const adv = () => { if (done) return; done = true; clearTimeout(guard); next(i + 1); };
    const guard = setTimeout(() => { if (my === token && !done) { speechSynthesis.cancel(); adv(); } }, 5000 + ch[i].length * 250);   // skip a stalled chunk
    u.onend = adv;
    u.onerror = e => { if (my === token && !done && e.error !== "canceled" && e.error !== "interrupted") { done = true; clearTimeout(guard); stop(); st.textContent = "Speech error: " + e.error; } };
    speechSynthesis.speak(u);
  };
  setTimeout(() => next(0), 100);
}
function toggle(k) {
  const b = $("b" + k);
  if (b.classList.contains("stop")) { stop(); return; }
  stop();
  const text = k === "V" ? trans : $("tafsir").textContent; if (!text) return;
  const lang = k === "V" ? "ml" : ($("tsel").value === "169" ? "en" : "ar");
  b.textContent = "⏹ നിർത്തുക"; b.classList.add("stop");
  wakeOn();
  say(clean(text, lang), lang, token, $("s" + k));
}
if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
["sNo", "aNo"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
window.addEventListener("pagehide", stop);
window.addEventListener("load", () => {
  const q = new URLSearchParams(location.search);
  const s = parseInt(q.get("s") || q.get("surah")), a = parseInt(q.get("a") || q.get("ayah"));
  if (s >= 1 && s <= 114) { $("sNo").value = s; $("aNo").value = a >= 1 ? a : 1; }
  go();
});
</script>
<script src="https://onlinenanma.github.io/quran/site.js" defer></script>
</body>
</html>
