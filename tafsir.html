<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ആയത്തും തഫ്സീറും</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--tfs:20px}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;overflow-x:hidden}
body{font-family:"Noto Sans Malayalam",sans-serif;background:var(--paper);color:var(--ink);line-height:1.9}
.banner{text-align:center;color:#fff;padding:8px 18px 14px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.banner h1{font-size:clamp(1.15rem,4.5vw,1.6rem);font-weight:400;line-height:1.3}
.back{display:block;text-align:left;color:var(--gold);font-weight:600;font-size:.8rem;text-decoration:none;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:18px 12px 40px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(14px,3vw,26px);box-shadow:0 4px 15px rgba(0,0,0,.06);margin-bottom:18px}
h2{color:var(--green2);font-size:1.15rem;text-align:center}
@media(prefers-color-scheme:dark){h2{color:var(--gold)}}
.controls{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:center;align-items:center}
.controls label{font-weight:600;color:var(--green2);display:flex;align-items:center;gap:6px}
@media(prefers-color-scheme:dark){.controls label{color:var(--gold)}}
input,select{font-family:inherit;font-size:1rem;padding:9px 10px;border:1px solid var(--green2);border-radius:8px;background:var(--paper);color:var(--ink)}
input{width:84px}
button{font-family:inherit;font-size:.95rem;font-weight:600;padding:9px 18px;border:none;border-radius:20px;background:var(--green2);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--green2);border:1px solid var(--green2);padding:6px 14px}
@media(prefers-color-scheme:dark){button.alt{color:var(--gold);border-color:var(--gold)}}
button.stop{background:#d93025;color:#fff}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ref{text-align:center;font-weight:700;color:var(--green2);margin-bottom:6px}
@media(prefers-color-scheme:dark){.ref{color:var(--gold)}}
.ar{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:clamp(1.6rem,6vw,2.4rem);line-height:2.2;color:var(--green2);overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){.ar{color:var(--ink)}}
audio{width:100%;margin-top:10px}
.tr{font-size:1.1rem;line-height:1.9;margin:6px 0 12px;overflow-wrap:anywhere}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:.75rem;color:var(--muted);min-height:1.2em;margin-top:6px}
.tafsir{background:var(--paper);border-radius:10px;padding:clamp(14px,3.5vw,28px);font-size:var(--tfs);line-height:2;min-height:55vh;white-space:pre-line;overflow-wrap:anywhere;text-align:left}
.tafsir.rtl{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",serif;font-size:calc(var(--tfs) * 1.2);line-height:2.3}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:.9rem}
.err{color:#d93025;text-align:center;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<header class="banner">
  <div style="display:flex;justify-content:space-between;gap:12px">
    <a class="back" href="https://onlinenanma.github.io/quran/">🏠 ഹോം</a>
    <a class="back" href="https://onlinenanma.github.io/quran/surah-index">📖 സൂറത്ത് പട്ടിക</a>
  </div>
  <h1>ആയത്തും തഫ്സീറും</h1>
</header>

<main class="wrap">
  <section class="card">
    <h2 style="margin-bottom:12px">ആയത്ത് തെരഞ്ഞെടുക്കുക</h2>
    <div class="controls">
      <label>സൂറത്ത്: <input type="number" id="sNo" min="1" max="114" value="1"></label>
      <label>ആയത്ത്: <input type="number" id="aNo" min="1" value="1"></label>
      <label>പാരായണം: 
        <select id="reciterSelect">
          <option value="ar.alafasy" selected>Mishary Rashid Alafasy</option>
          <option value="ar.sudais">Abdul Rahman Al-Sudais</option>
          <option value="ar.abdulbasit">Abdul Basit</option>
          <option value="ar.minshawi">Mohamed Siddiq El-Minshawi</option>
          <option value="ar.hudhaify">Ali Al-Hudhaify</option>
        </select>
      </label>
      <button type="button" onclick="go()">കാണിക്കുക</button>
      <button type="button" class="alt" id="prev" onclick="step(-1)">◀ മുമ്പത്തേത്</button>
      <button type="button" class="alt" id="next" onclick="step(1)">അടുത്തത് ▶</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <div class="ref" id="ref"></div>
    <div class="ar" id="ar" lang="ar">ലോഡ് ചെയ്യുന്നു...</div>
    <audio id="aud" controls></audio>
  </section>

  <section class="card">
    <h2>സാരം</h2>
    <p class="tr" id="tr"></p>
    <button type="button" id="bV" onclick="toggle('V')">🔊 കേൾക്കാം</button>
    <div class="st" id="sV"></div>
  </section>

  <section class="card">
    <h2 style="margin-bottom:12px">തഫ്സീർ</h2>
    <div class="bar">
      <select id="tsel" onchange="loadTafsir()" aria-label="തഫ്സീർ തെരഞ്ഞെടുക്കാം">
        <option value="169">തഫ്സീർ ഇബ്നു കഥീർ (ഇംഗ്ലീഷ്)</option>
        <option value="14">തഫ്സീർ ഇബ്നു കഥീർ (അറബിക്)</option>
        <option value="16">തഫ്സീർ ഇബ്നു കഥീർ (അറബിക്) ചുരുക്കം</option>
        <option value="15">തഫ്സീർ ത്വബരീ</option>
        <option value="91">തഫ്സീർ സഅദീ</option>
      </select>
      <div class="grp">
        <button type="button" class="alt" onclick="fs(-2)" aria-label="അക്ഷരം ചെറുതാക്കുക">A−</button>
        <button type="button" class="alt" onclick="fs(2)" aria-label="അക്ഷരം വലുതാക്കുക">A+</button>
        <button type="button" id="bT" onclick="toggle('T')">🔊 കേൾക്കാം</button>
      </div>
    </div>
    <div class="tafsir" id="tafsir"></div>
    <div class="st" id="sT"></div>
  </section>
</main>
<footer>© ഖുർആൻ മലയാള സാരം</footer>

<script>
const $ = id => document.getElementById(id);
let S = 1, A = 1, MAX = 286, trans = "", raw = "", token = 0, tfs = 20;
const utt = [];

/* HTML -> plain text, keeping paragraph breaks */
const toText = h => new DOMParser().parseFromString(String(h).replace(/<\/(p|div|h\d|li)>|<br\s*\/?>/gi, "\n"), "text/html").body.textContent || "";

/* ---------- font size (remembered) ---------- */
try { tfs = +localStorage.getItem("qr-tfs") || 20; } catch (e) {}
function fs(d) {
  tfs = Math.min(40, Math.max(16, tfs + (d || 0)));
  document.documentElement.style.setProperty("--tfs", tfs + "px");
  try { localStorage.setItem("qr-tfs", tfs); } catch (e) {}
}
fs(0);

/* ---------- verse ---------- */
async function go() {
  stop(); $("err").textContent = "";
  const s = parseInt($("sNo").value), a = parseInt($("aNo").value);
  if (!(s >= 1 && s <= 114) || !(a >= 1)) { $("err").textContent = "ദയവായി സാധുവായ സൂറത്ത്, ആയത്ത് നമ്പർ നൽകുക."; return; }
  S = s; A = a;
  try {
    const selectedReciter = $("reciterSelect").value;
    const apiUrl = `https://api.alquran.cloud/v1/ayah/${S}:${A}/editions/${selectedReciter},ml.abdulhameed`;

    const res = await fetch(apiUrl);
    const d = await res.json();
    if (d.code !== 200 || d.data.length < 2) throw 0;
    const [ar, ml] = d.data;
    MAX = ar.surah.numberOfAyahs; $("aNo").max = MAX; trans = ml.text;
    $("ref").textContent = `${ar.surah.englishName} (${ar.surah.name}) · ${S}: ${String(ar.numberInSurah).padStart(3, "0")}`;
    $("ar").textContent = ar.text; $("tr").textContent = trans; $("aud").src = ar.audio;
  } catch (e) { $("err").textContent = "വിവരങ്ങൾ ലഭ്യമാക്കാൻ സാധിച്ചില്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക."; return; }
  loadTafsir();
}
function step(d) {
  let s = S, a = A + d;
  if (a > MAX) { s++; a = 1; } else if (a < 1) { s--; a = 999; }
  if (s < 1 || s > 114) return;
  $("sNo").value = s; $("aNo").value = a; go();
  if (a === 999) setTimeout(() => { $("aNo").value = MAX; go(); }, 0);   // previous surah: jump to its last verse
}

/* ---------- tafsir ---------- */
async function loadTafsir() {
  stop(); $("tafsir").textContent = "തഫ്സീർ ലോഡ് ചെയ്യുന്നു...";
  try {
    const r = await fetch(`https://api.quran.com/api/v4/tafsirs/${$("tsel").value}/by_ayah/${S}:${A}`);
    const d = await r.json();
    raw = d && d.tafsir && d.tafsir.text ? toText(d.tafsir.text).trim() : "Tafsir content not available for this verse.";
    raw = raw.replace(/\n{3,}/g, "\n\n");
    show();
  } catch (e) { $("tafsir").textContent = "തഫ്സീർ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു."; }
}
function show() {
  const t = $("tafsir");
  t.classList.toggle("rtl", $("tsel").value !== "169");
  t.textContent = raw;   // always the complete tafsir
}

/* ---------- text to speech ---------- */
const sc = v => (/natural|neural|enhanced|premium|online/i.test(v.name) ? 3 : 0) + (/google/i.test(v.name) ? 1 : 0) + (v.localService ? 0 : 1);
function voice(lang) {
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(lang));
  return vs.sort((a, b) => sc(b) - sc(a))[0] || null;
}
function clean(t, lang) {
  t = toText(t);
  if (lang === "ar") t = t.replace(/[\u0610-\u061a\u064b-\u065f\u0670\u06d6-\u06ed]/g, "");   // tashkeel breaks Android TTS
  return t.replace(/[()\u2018\u2019\u201C\u201D"]/g, "").replace(/\s+/g, " ").trim();
}
function split(text, max = 150) {
  const sents = text.match(/[^.,:;!?।]+[.,:;!?।]*/g) || [text], out = []; let cur = "";
  for (let s of sents) {
    s = s.trim();
    while (s.length > max) {
      let cut = s.lastIndexOf(" ", max); if (cut <= 0) cut = max;
      if (cur) { out.push(cur); cur = ""; }
      out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
    }
    if (!s) continue;
    if (cur && (cur + " " + s).length > max) { out.push(cur); cur = s; } else cur = cur ? cur + " " + s : s;
  }
  if (cur) out.push(cur);
  return out.filter(c => /[^\s.,:;!?।]/.test(c));
}
function stop() {
  token++; if (window.speechSynthesis) speechSynthesis.cancel();
  ["bV", "bT"].forEach(id => { $(id).textContent = "🔊 കേൾക്കാം"; $(id).classList.remove("stop"); });
  $("sV").textContent = ""; $("sT").textContent = "";
}
function say(text, lang, my, st) {
  if (!window.speechSynthesis) { st.textContent = "Speech is not supported in this browser."; return; }
  const ch = split(text), v = voice(lang);
  const next = i => {                         // one chunk at a time keeps long tafsir stable on phones
    if (my !== token) return;
    if (i >= ch.length) { stop(); return; }
    st.textContent = (v ? v.name : "default voice") + " · " + (i + 1) + "/" + ch.length;
    const u = new SpeechSynthesisUtterance(ch[i]); utt[0] = u;
    if (v) u.voice = v;
    u.lang = v ? v.lang : { ml: "ml-IN", ar: "ar-SA", en: "en-US" }[lang]; u.rate = 0.95;
    u.onend = () => next(i + 1);
    u.onerror = e => { if (my === token && e.error !== "canceled" && e.error !== "interrupted") { stop(); st.textContent = "Speech error: " + e.error; } };
    speechSynthesis.speak(u);
  };
  setTimeout(() => next(0), 100);
}
function toggle(k) {
  const b = $("b" + k);
  if (b.classList.contains("stop")) { stop(); return; }
  stop();
  const text = k === "V" ? trans : $("tafsir").textContent; if (!text) return;
  const lang = k === "V" ? "ml" : ($("tsel").value === "169" ? "en" : "ar");
  b.textContent = "⏹ നിർത്തുക"; b.classList.add("stop");
  say(clean(text, lang), lang, token, $("s" + k));
}
if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
["sNo", "aNo"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
window.addEventListener("pagehide", stop);
window.onload = go;
</script>
<script src="https://onlinenanma.github.io/quran/site.js" defer></script>
</body>
</html>
