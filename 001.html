<!DOCTYPE html>
<html lang="ml">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>സൂറത്തുൽ ഫാതിഹ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
 <style>
:root{--fs:18px;--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--acc:#1d5240;--soft:rgba(212,175,55,.16)}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36;--acc:#d4af37;--soft:rgba(212,175,55,.14)}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{overflow-x:hidden;font-family:"Noto Sans Malayalam",sans-serif;margin:0;padding:0 12px 40px;text-align:left;color:var(--ink);background:var(--paper);line-height:1.8}
body>*{max-width:1000px;margin-left:auto;margin-right:auto}

body>.hero{max-width:none;margin:0 -12px;text-align:center;color:#fff;padding:14px 0 16px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:500;line-height:1.4;margin-top:4px}
quiz-exp{font-size:calc(var(--fs) * .8);color:var(--muted);margin-top:4px}

/* ---------- Options card (sticky) ---------- */
.controls{position:sticky;top:0;z-index:10;background:var(--card);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-top:-30px;margin-bottom:16px}
.banner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px}
.banner-row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px}
.panel{display:none;position:absolute;left:-2px;right:-2px;top:100%;background:var(--card);border:2px solid var(--gold);border-top:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.15);padding:14px 14px 6px;max-height:75vh;overflow-y:auto}
.controls.open .panel{display:block}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.ctl-title{font-size:13px;color:var(--muted);font-weight:600}
.opt{font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--green2)}
.opt-sel,.ai-ask input{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--acc);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.opt-btn,.small-btn{font-family:inherit;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:4px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.opt-btn.open,.small-btn.open{background:var(--green2);color:#fff;border-color:var(--green2)}
.main-btn{font-family:inherit;border:none;background:var(--green2);color:#fff;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.banner .main-btn{padding:7px 20px}
.main-btn.playing{background:#d93025}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fs-group{display:inline-flex;align-items:center;gap:4px}
#fs-label{font-size:13px;color:var(--muted);min-width:24px;text-align:center}
#status{width:100%;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
#status:empty{display:none}

/* ---------- Verse cards ---------- */
.verse,.item{min-width:0}
.verse{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(12px,3vw,20px);margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed var(--gold)}
.vhead .small-btn{margin-left:auto;padding:2px 10px;font-size:12px;font-weight:normal}
.item{padding:4px 6px;border-radius:10px;margin-bottom:4px;border:2px solid transparent;scroll-margin-top:90px}
.item.reading{background:var(--soft);border-color:var(--gold)}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.row.rtl{direction:rtl}
.play-btn{flex:0 0 32px;width:32px;height:32px;border:none;border-radius:50%;background-color:var(--green2);color:#fff;font-size:13px;line-height:32px;padding:0;margin-top:2px;cursor:pointer}
.play-btn.playing{background-color:#d93025}
.text{flex:1;min-width:0;margin:0;text-align:left;line-height:1.7;font-size:var(--fs);overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:12px;color:var(--muted);margin-right:4px}
.pl{white-space:pre-line}
.text.ar{font-size:calc(var(--fs) * 1.5);text-align:right;line-height:1.9;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}
@media(prefers-color-scheme:dark){.text.ar{color:var(--ink)}}
.hidden{display:none}
.tf-btn{display:block;margin:4px 0 6px 6px}
.it-tf{border-top:1px dashed var(--line);margin-top:2px}

body.hide-in #intro-wrap{display:none}
body.hide-ar .it-ar{display:none}
body.hide-ml .it-ml{display:none}
body.hide-tf .it-tf,body.hide-tf .tf-btn{display:none}

/* Introduction */
.intro-title{font-weight:700;font-size:calc(var(--fs) * 1.2);color:var(--acc)}
.intro-sub{color:var(--muted);font-size:calc(var(--fs) * .85);margin-bottom:6px;font-weight:600}
.intro-body{margin:6px 0 10px;text-align:justify}
.isti{background:var(--soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px}
.isti-ar{font-size:calc(var(--fs) * 1.4);text-align:right;line-height:2;margin-bottom:4px;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}
@media(prefers-color-scheme:dark){.isti-ar{color:var(--ink)}}

/* Lessons / questions / quiz */
.ai-box{margin:24px auto 0;padding:clamp(14px,3vw,22px);border:2px solid var(--gold);border-radius:12px;background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,.06)}
.ai-box h3{margin:16px 0 8px;font-size:calc(var(--fs) * 1.1);color:var(--acc);text-align:center}
.ai-box h3:first-child{margin-top:0}
.ai-box>.main-btn{display:block;margin:0 auto}
.ai-out{margin:10px 0;line-height:1.7;font-size:var(--fs);white-space:pre-line}
.ai-out:empty{display:none}
.q-list{display:flex;flex-direction:column;gap:6px;margin:8px 0} div
.q-btn{font-family:inherit;text-align:left;border:1px solid var(--line);border-top:3px solid var(--gold);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:calc(var(--fs) * .85);cursor:pointer}
.q-btn:hover,.q-btn:focus-visible{background:var(--green2);color:#fff;outline:none}
.ai-ask{display:flex;gap:6px;margin-top:8px}
.ai-ask input{flex:1;min-width:0;padding:8px;font-size:15px}
.quiz-q{margin:12px 0;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.quiz-q p{margin:0 0 6px;font-size:var(--fs)}
.quiz-opt{font-family:inherit;display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:calc(var(--fs) * .9);cursor:pointer}
.quiz-opt.right{background:#e6f4ea;border-color:#188038;color:#123528}
.quiz-opt.wrong{background:#fce8e6;border-color:#d93025;color:#5b1a14}
 footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}
   
.topnav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;padding:0 12px}
.topnav .back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color: var(--gold);
  text-decoration: none;
  font-size: clamp(0.95rem, 3.4vw, 1.1rem);
  font-weight: 500;
  white-space: nowrap;
}
.topnav .back:hover,
.topnav .back:focus {
  color: #fff;
  text-decoration: none;
  outline: none;
}   
    
.langpick{font-family:inherit;font-size:.8rem;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:14px;padding:2px 8px;max-width:80px}
.langpick option{color:#22302a}
.goog-te-banner-frame,.skiptranslate iframe{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
 </style>
</head>
<body>
<header class="hero">
  <div class="topnav">
    <a class="back" href="https://onlinenanma.github.io/quran/"><span style="font-size: 1.25em;">🏠</span> പ്രധാന താൾ</a>
    <a class="back" href="https://onlinenanma.github.io/quran/surah-index">സൂറത്തുകൾ <span style="font-size: 1.25em;">📖</span></a>
  </div>
  <h1>1. സൂറത്തുൽ ഫാതിഹ</h1>
</header>
<!-- ================= Controls ================= -->
<div class="controls" id="controls">

  <div class="banner" id="banner">
    <div class="banner-row">
      <button id="opt-toggle" class="opt-btn" onclick="togglePanel(event)">⚙ ഓപ്ഷനുകൾ▾</button>
    </div>
    <div class="banner-row">
      <button id="master" class="main-btn" onclick="toggleContinuous()">▶ കേൾക്കാം</button>
    
    </div>
    <div id="status"></div>
  </div>

  <!-- Options panel -->
  <div class="panel" id="panel">
    <div class="ctl-row">
      <span class="ctl-title">അക്ഷര വലിപ്പം:</span>
      <span class="fs-group">
        <button class="small-btn" onclick="changeFont(-2)">A−</button>
        <span id="fs-label">18</span>
        <button class="small-btn" onclick="changeFont(2)">A+</button>
      </span>
    </div>

    <div class="ctl-row">
      <span class="ctl-title">കാണിക്കുക:</span>
      <label class="opt"><input type="checkbox" id="show-in" onchange="applyDisplay()"> മുഖവുര</label>
      <label class="opt"><input type="checkbox" id="show-ar" checked onchange="applyDisplay()"> ആയത്ത്</label>
      <label class="opt"><input type="checkbox" id="show-ml" checked onchange="applyDisplay()"> സാരം</label>
      <label class="opt"><input type="checkbox" id="show-tf" onchange="applyDisplay()"> വിവരണം</label>
    </div>

    <div class="ctl-row">
      <span class="ctl-title">ഖിറാഅത്ത് (പാരായണം):</span>
      <select id="reciter" class="opt-sel" onchange="changeReciter(this.value)"></select>
    </div>

    <div class="ctl-row">
      <span class="ctl-title">ആയത്ത് ആവർത്തനം:</span>
      <select id="repeat" class="opt-sel" onchange="saveSettings()">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </div>
  </div>
</div>

<!-- ================= Verses (built by script) ================= -->
<div id="verses"></div>

<!-- ================= Lessons / questions / quiz ================= -->
<div class="ai-box">
  <h3>💡 ഈ പേജിലെ പാഠങ്ങൾ</h3>
  <button class="main-btn" onclick="showSummary()">പാഠങ്ങൾ സംഗ്രഹിക്കുക</button>
  <div class="ai-out" id="ai-summary"></div>

  <h3>📝 ക്വിസ്</h3>
  <button class="main-btn" onclick="startQuiz()">ക്വിസ് തുടങ്ങാം</button>
  <div id="quiz"></div>
</div>
<footer>© ഖുർആൻ സാരം</footer>
<script>
  /* =====================================================
     DATA  –  edit the text here.
     tf = explanation (വിവരണം). Leave "" if there is none.
     ===================================================== */
  const SURAH = 1;   // surah number (shown before the ayah number, and used for the audio file names)

  const VERSES = [
    {
      n: 1,
      ar: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
      ml: "പരമകാരുണികനും കരുണാനിധിയുമായ അല്ലാഹുവിന്റെ നാമത്തില്‍.",
      tf: "അല്ലാഹുവിൻറെ നാമം സ്മരിക്കുന്നതിൽ അനുഗ്രഹം പ്രതീക്ഷിച്ച് കൊണ്ടും, അവനോട് സഹായം ചോദിച്ചുകൊണ്ടും, അവൻറെ നാമത്തിൽ ഞാൻ ഖുർആൻ പാരായണം ആരംഭിക്കുന്നു. ബിസ്മി അല്ലാഹുവിൻറെ മൂന്ന് ഉന്നതമായ നാമങ്ങൾ ഉൾക്കൊള്ളുന്നുണ്ട്. അവ: 1- ((അല്ലാഹു)); അഥവാ യഥാർത്ഥ ആരാധ്യൻ . ലോകങ്ങളുടെ സ്രഷ്ടാവും രക്ഷാധികാരിയുമായ ഏകആരാധ്യനായ ദൈവത്തിൻറെ നാമമാണ് അല്ലാഹു എന്നത്. അല്ലാഹു എന്നത് അവന്റെ ഏറ്റവും പ്രത്യേകമായ പേരാണ്. അവനല്ലാത്ത മറ്റൊരാൾക്കും പറയാൻ പാടില്ലാത്ത നാമവുമാണത്. \n2- അർ-റഹ്‌മാൻ (الرَّحْمَنُ); സർവ്വവിശാലമായ, എല്ലാ സൃഷ്ടികളെയും വലയം ചെയ്യുന്ന കാരുണ്യം വിശേഷണമായുള്ളവൻ എന്നർത്ഥം.\n3- അർ-റഹീം (الرَّحِيمُ); താൻ ഉദ്ദേശിക്കുന്ന സൃഷ്ടികളിലേക്ക് എത്തുന്ന വിശാലമായ കാരുണ്യത്തിൻ്റെ ഉടമയായുള്ളവൻ. തൻറെ ദാസന്മാരിൽ നിന്ന് വിശ്വസിച്ചവർക്ക് അവൻ പ്രത്യേകമായ കാരുണ്യം ചൊരിയുകയും ചെയ്യുന്നു."
    },
    {
      n: 2,
      ar: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
      ml: "സ്തുതി സർവ്വലോക പരിപാലകനായ അല്ലാഹുവിന്നാകുന്നു.",
      tf: "മഹത്വത്തിൻറെയും പൂർണതയുടെയും വിശേഷണമായ എല്ലാ സ്തുതികളും അല്ലാഹുവിന് മാത്രമാണ്; കാരണം അവനാണ് എല്ലാ വസ്തുക്കളുടെയും ഉടമസ്ഥനും സ്രഷ്ടാവും നിയന്താവും. (ആലമൂൻ) എന്നത് (ആലം) എന്നതിൻറെ ബഹുവചനമാണ്. അല്ലാഹുവല്ലാത്ത സർവ്വതും ആലം എന്നതിൽ ഉൾപ്പെടും."
    },
    {
      n: 3,
      ar: "الرَّحْمَٰنِ الرَّحِيمِ",
      ml: "പരമകാരുണികനും കരുണാനിധിയും.",
      tf: "അല്ലാഹുവിൻ്റെ അതിമനോഹരമായ രണ്ട് നാമങ്ങളായ ‘അർ-റഹ്‌മാൻ’, ‘അർ-റഹീം’ എന്നിവ  എടുത്തു പറഞ്ഞു കൊണ്ട് ഈ വചനത്തിൽ അവനെ ആവർത്തിച്ചു സ്തുതിക്കുകയാണ് ചെയ്യുന്നത്. സർവ്വ സൃഷ്ടികളെയും വലയം ചെയ്തിരിക്കുന്ന സർവ്വ വിശാലമായ കാരുണ്യമുള്ളവൻ എന്നാണ് ‘അർ-റഹ്‌മാൻ’ എന്ന നാമത്തിൻ്റെ ഉദ്ദേശ്യം. ‘അർ-റഹീം’ എന്നാൽ അല്ലാഹുവിൽ വിശ്വസിച്ച സൽകർമ്മികൾക്ക് പ്രത്യേകമായി കരുണ ചൊരിയുന്നവൻ എന്ന ഉദ്ദേശമാണുള്ളത്."
    },
    {
      n: 4,
      ar: "مَالِكِ يَوْمِ الدِّينِ",
      ml: "പ്രതിഫല ദിവസത്തിന്‍റെ ഉടമസ്ഥന്‍.",
      tf: "ഖിയാമത്ത് നാളിലുള്ള എല്ലാത്തിൻറെയും ഉടമസ്ഥൻ എന്ന് അല്ലാഹുവിനെ മഹത്വപ്പെടുത്തലാണ് ഈ ആയത്തിലുള്ളത്. കാരണം ഒരാളും മറ്റൊരാൾക്ക് യാതൊന്നും അധീനമാക്കാത്ത ദിവസമാകുന്നു അത്. \"യൗമുദ്ദീൻ\" എന്നാൽ വിചാരണയുടെയും പ്രതിഫലത്തിൻറെയും ദിവസം."
    },
    {
