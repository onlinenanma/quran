<!DOCTYPE html>
<html lang="ml">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>സൂറത്തുൽ ഫാതിഹ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
 <style>
:root{--fs:18px;--green:#123528;--green2:#1d5240;--gold:#d4af37;--paper:#f6f3ea;--card:#fff;--ink:#22302a;--muted:#55605a;--line:#e2e8f0;--acc:#1d5240;--soft:rgba(212,175,55,.16)}
@media(prefers-color-scheme:dark){:root{--paper:#0f1a15;--card:#17261f;--ink:#e9efe9;--muted:#a9b6ae;--green:#0b231a;--line:#2c3f36;--acc:#d4af37;--soft:rgba(212,175,55,.14)}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{overflow-x:hidden;font-family:"Noto Sans Malayalam",sans-serif;margin:0;padding:0 12px 40px;text-align:left;color:var(--ink);background:var(--paper);line-height:1.8}
body>*{max-width:1000px;margin-left:auto;margin-right:auto}

body>.hero{max-width:none;margin:0 -12px;text-align:center;color:#fff;padding:8px 18px 38px;background:
 radial-gradient(circle at 50% 120%,rgba(212,175,55,.28),transparent 60%),
 repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0 15deg,transparent 15deg 30deg),
 linear-gradient(160deg,var(--green),var(--green2));border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(1.15rem,4.5vw,1.6rem);font-weight:400;line-height:1.3;margin:0}
.hero .back{display:block;text-align:left;color:var(--gold);font-weight:600;font-size:.8rem;text-decoration:none;margin-bottom:0;line-height:1.6}

/* ---------- Options card (sticky) ---------- */
.controls{position:sticky;top:0;z-index:10;background:var(--card);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-top:-30px;margin-bottom:16px}
.banner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px}
.banner-row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 12px}
.panel{display:none;position:absolute;left:-2px;right:-2px;top:100%;background:var(--card);border:2px solid var(--gold);border-top:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.15);padding:14px 14px 6px;max-height:75vh;overflow-y:auto}
.controls.open .panel{display:block}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.ctl-title{font-size:13px;color:var(--muted);font-weight:600}
.opt{font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--green2)}
.opt-sel,.ai-ask input{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--acc);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.opt-btn,.small-btn{font-family:inherit;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:20px;padding:4px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.opt-btn.open,.small-btn.open{background:var(--green2);color:#fff;border-color:var(--green2)}
.main-btn{font-family:inherit;border:none;background:var(--green2);color:#fff;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.banner .main-btn{padding:7px 20px}
.main-btn.playing{background:#d93025}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fs-group{display:inline-flex;align-items:center;gap:4px}
#fs-label{font-size:13px;color:var(--muted);min-width:24px;text-align:center}
#status{width:100%;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
#status:empty{display:none}

/* ---------- Verse cards ---------- */
.verse,.item{min-width:0}
.verse{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:clamp(12px,3vw,20px);margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed var(--gold)}
.vhead .small-btn{margin-left:auto;padding:2px 10px;font-size:12px;font-weight:normal}
.item{padding:4px 6px;border-radius:10px;margin-bottom:4px;border:2px solid transparent;scroll-margin-top:90px}
.item.reading{background:var(--soft);border-color:var(--gold)}
.row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.row.rtl{direction:rtl}
.play-btn{flex:0 0 32px;width:32px;height:32px;border:none;border-radius:50%;background-color:var(--green2);color:#fff;font-size:13px;line-height:32px;padding:0;margin-top:2px;cursor:pointer}
.play-btn.playing{background-color:#d93025}
.text{flex:1;min-width:0;margin:0;text-align:left;line-height:1.7;font-size:var(--fs);overflow-wrap:anywhere;word-break:break-word}
.tag{font-size:12px;color:var(--muted);margin-right:4px}
.pl{white-space:pre-line}
.text.ar{font-size:calc(var(--fs) * 1.5);text-align:right;line-height:1.9;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}
@media(prefers-color-scheme:dark){.text.ar{color:var(--ink)}}
.hidden{display:none}
.tf-btn{display:block;margin:4px 0 6px 6px}
.it-tf{border-top:1px dashed var(--line);margin-top:2px}

body.hide-in #intro-wrap{display:none}
body.hide-ar .it-ar{display:none}
body.hide-ml .it-ml{display:none}
body.hide-tf .it-tf,body.hide-tf .tf-btn{display:none}

/* Introduction */
.intro-title{font-weight:700;font-size:calc(var(--fs) * 1.2);color:var(--acc)}
.intro-sub{color:var(--muted);font-size:calc(var(--fs) * .85);margin-bottom:6px;font-weight:600}
.intro-body{margin:6px 0 10px;text-align:justify}
.isti{background:var(--soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px}
.isti-ar{font-size:calc(var(--fs) * 1.4);text-align:right;line-height:2;margin-bottom:4px;color:var(--acc);font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif}
@media(prefers-color-scheme:dark){.isti-ar{color:var(--ink)}}

/* Lessons / questions / quiz */
.ai-box{margin:24px auto 0;padding:clamp(14px,3vw,22px);border:2px solid var(--gold);border-radius:12px;background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,.06)}
.ai-box h3{margin:16px 0 8px;font-size:calc(var(--fs) * 1.1);color:var(--acc);text-align:center}
.ai-box h3:first-child{margin-top:0}
.ai-box>.main-btn{display:block;margin:0 auto}
.ai-out{margin:10px 0;line-height:1.7;font-size:var(--fs);white-space:pre-line}
.ai-out:empty{display:none}
.q-list{display:flex;flex-direction:column;gap:6px;margin:8px 0} div
.q-btn{font-family:inherit;text-align:left;border:1px solid var(--line);border-top:3px solid var(--gold);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:calc(var(--fs) * .85);cursor:pointer}
.q-btn:hover,.q-btn:focus-visible{background:var(--green2);color:#fff;outline:none}
.ai-ask{display:flex;gap:6px;margin-top:8px}
.ai-ask input{flex:1;min-width:0;padding:8px;font-size:15px}
.quiz-q{margin:12px 0;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.quiz-q p{margin:0 0 6px;font-size:var(--fs)}
.quiz-opt{font-family:inherit;display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:calc(var(--fs) * .9);cursor:pointer}
.quiz-opt.right{background:#e6f4ea;border-color:#188038;color:#123528}
.quiz-opt.wrong{background:#fce8e6;border-color:#d93025;color:#5b1a14}
.quiz-exp{font-size:calc(var(--fs) * .8);color:var(--muted);margin-top:4px}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .topnav .back{display:inline-block;padding:4px 0}
   .langpick{font-family:inherit;font-size:.8rem;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:14px;padding:2px 8px;max-width:120px}
.langpick option{color:#22302a}
.goog-te-banner-frame,.skiptranslate iframe{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
 </style>
</head>
<body>
<header class="hero">
  <div class="topnav">
    <a class="back" href="https://onlinenanma.github.io/quran/">🏠 ഹോം</a>
    <select id="langPick" class="langpick notranslate" translate="no" aria-label="Translate">
  <option value="">🌐</option>
  <option value="ml">മലയാളം (original)</option>
  <option value="en">English</option>
  <option value="hi">हिन्दी</option>
  <option value="ta">தமிழ்</option>
  <option value="kn">ಕನ್ನಡ</option>
  <option value="ar">العربية</option>
  <option value="ur">اردو</option>
  <option value="bn">বাংলা</option>
</select>
    <a class="back" href="https://onlinenanma.github.io/quran/surah-index">📖 സൂറത്ത് പട്ടിക</a>
  </div>
  <h1>1. സൂറത്തുൽ ഫാതിഹ</h1>
</header>
<!-- ================= Controls ================= -->
<div class="controls" id="controls">

  <div class="banner" id="banner">
    <div class="banner-row">
      <button id="opt-toggle" class="opt-btn" onclick="togglePanel(event)">⚙ ഓപ്ഷനുകൾ തെരഞ്ഞെടുക്കാം ▾</button>
    </div>
    <div class="banner-row">
      <button id="master" class="main-btn" onclick="toggleContinuous()">▶ തുടക്കം മുതൽ കേൾക്കാം</button>
      <label class="opt"><input type="checkbox" id="opt-cont" checked> തുടർച്ചയായി കേൾക്കാം</label>
    </div>
    <div id="status"></div>
  </div>

  <!-- Options panel -->
  <div class="panel" id="panel">
    <div class="ctl-row">
      <span class="ctl-title">അക്ഷര വലിപ്പം:</span>
      <span class="fs-group">
        <button class="small-btn" onclick="changeFont(-2)">A−</button>
        <span id="fs-label">18</span>
        <button class="small-btn" onclick="changeFont(2)">A+</button>
      </span>
    </div>

    <div class="ctl-row">
      <span class="ctl-title">കാണിക്കുക:</span>
      <label class="opt"><input type="checkbox" id="show-in" onchange="applyDisplay()"> മുഖവുര</label>
      <label class="opt"><input type="checkbox" id="show-ar" checked onchange="applyDisplay()"> ആയത്ത്</label>
      <label class="opt"><input type="checkbox" id="show-ml" checked onchange="applyDisplay()"> സാരം</label>
      <label class="opt"><input type="checkbox" id="show-tf" onchange="applyDisplay()"> വിവരണം</label>
    </div>

    <div class="ctl-row">
      <span class="ctl-title">ഖിറാഅത്ത് (പാരായണം):</span>
      <select id="reciter" class="opt-sel" onchange="changeReciter(this.value)"></select>
    </div>

    <div class="ctl-row">
      <span class="ctl-title">ആയത്ത് ആവർത്തനം:</span>
      <select id="repeat" class="opt-sel" onchange="saveSettings()">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </div>
  </div>
</div>

<!-- ================= Verses (built by script) ================= -->
<div id="verses"></div>

<!-- ================= Lessons / questions / quiz ================= -->
<div class="ai-box">
  <h3>💡 ഈ പേജിലെ പാഠങ്ങൾ</h3>
  <button class="main-btn" onclick="showSummary()">പാഠങ്ങൾ സംഗ്രഹിക്കുക</button>
  <div class="ai-out" id="ai-summary"></div>

  <h3>📝 ക്വിസ്</h3>
  <button class="main-btn" onclick="startQuiz()">ക്വിസ് തുടങ്ങാം</button>
  <div id="quiz"></div>
</div>

<script>
  const $ = id => document.getElementById(id);

  /* =====================================================
     DATA  –  edit the text here.
     tf = explanation (വിവരണം). Leave "" if there is none.
     ===================================================== */
  const SURAH = 1;   // surah number (shown before the ayah number, and used for the audio file names)

  const VERSES = [
    {
      n: 1,
      ar: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
      ml: "അർ-റഹ്‌മാനും  അർ-റഹീമുമായ അല്ലാഹുവിന്റെ നാമത്തില്‍.",
      tf: "അല്ലാഹുവിൻറെ നാമം സ്മരിക്കുന്നതിൽ അനുഗ്രഹം (ബറകത്) പ്രതീക്ഷിച്ച് കൊണ്ടും, അവനോട് സഹായം ചോദിച്ചുകൊണ്ടും, അവൻറെ നാമത്തിൽ ഞാൻ ഖുർആൻ പാരായണം ആരംഭിക്കുന്നു. ബിസ്മി അല്ലാഹുവിൻറെ മൂന്ന് ഉന്നതമായ നാമങ്ങൾ ഉൾക്കൊള്ളുന്നുണ്ട്. അവ: 1- ((അല്ലാഹു)); അഥവാ യഥാർത്ഥ ആരാധ്യൻ . ലോകങ്ങളുടെ സ്രഷ്ടാവും രക്ഷാധികാരിയുമായ ഏകആരാധ്യനായ ദൈവത്തിൻറെ നാമമാണ് അല്ലാഹു എന്നത്. അല്ലാഹു എന്നത് അവന്റെ ഏറ്റവും പ്രത്യേകമായ പേരാണ്. അവനല്ലാത്ത മറ്റൊരാൾക്കും പറയാൻ പാടില്ലാത്ത നാമവുമാണത്. \n2- അർ-റഹ്‌മാൻ (الرَّحْمَنُ); സർവ്വവിശാലമായ, എല്ലാ സൃഷ്ടികളെയും വലയം ചെയ്യുന്ന കാരുണ്യം വിശേഷണമായുള്ളവൻ എന്നർത്ഥം.\n3- അർ-റഹീം (الرَّحِيمُ); താൻ ഉദ്ദേശിക്കുന്ന സൃഷ്ടികളിലേക്ക് എത്തുന്ന വിശാലമായ കാരുണ്യത്തിൻ്റെ ഉടമയായുള്ളവൻ. തൻറെ ദാസന്മാരിൽ നിന്ന് വിശ്വസിച്ചവർക്ക് അവൻ പ്രത്യേകമായ കാരുണ്യം ചൊരിയുകയും ചെയ്യുന്നു."
    },
    {
      n: 2,
      ar: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
      ml: "സർവ്വ സ്തുതികളും ലോകങ്ങളുടെ റബ്ബായ അല്ലാഹുവിന്നാകുന്നു.",
      tf: "മഹത്വത്തിൻറെയും പൂർണതയുടെയും വിശേഷണമായ എല്ലാ സ്തുതികളും അല്ലാഹുവിന് മാത്രമാണ്; കാരണം അവനാണ് എല്ലാ വസ്തുക്കളുടെയും ഉടമസ്ഥനും സ്രഷ്ടാവും നിയന്താവും. (ആലമൂൻ) എന്നത് (ആലം) എന്നതിൻറെ ബഹുവചനമാണ്. അല്ലാഹുവല്ലാത്ത സർവ്വതും ആലം എന്നതിൽ ഉൾപ്പെടും."
    },
    {
      n: 3,
      ar: "الرَّحْمَٰنِ الرَّحِيمِ",
      ml: "അർ-റഹ്‌മാനും  അർ-റഹീമുമായ.",
      tf: "അല്ലാഹുവിൻ്റെ അതിമനോഹരമായ രണ്ട് നാമങ്ങളായ ‘അർ-റഹ്‌മാൻ’, ‘അർ-റഹീം’ എന്നിവ  എടുത്തു പറഞ്ഞു കൊണ്ട് ഈ വചനത്തിൽ അവനെ ആവർത്തിച്ചു സ്തുതിക്കുകയാണ് ചെയ്യുന്നത്. സർവ്വ സൃഷ്ടികളെയും വലയം ചെയ്തിരിക്കുന്ന സർവ്വ വിശാലമായ കാരുണ്യമുള്ളവൻ എന്നാണ് ‘അർ-റഹ്‌മാൻ’ എന്ന നാമത്തിൻ്റെ ഉദ്ദേശ്യം. ‘അർ-റഹീം’ എന്നാൽ അല്ലാഹുവിൽ വിശ്വസിച്ച സൽകർമ്മികൾക്ക് പ്രത്യേകമായി കരുണ ചൊരിയുന്നവൻ എന്ന ഉദ്ദേശമാണുള്ളത്."
    },
    {
      n: 4,
      ar: "مَالِكِ يَوْمِ الدِّينِ",
      ml: "പ്രതിഫല ദിവസത്തിന്‍റെ ഉടമസ്ഥന്‍.",
      tf: "ഖിയാമത്ത് നാളിലുള്ള എല്ലാത്തിൻറെയും ഉടമസ്ഥൻ എന്ന് അല്ലാഹുവിനെ മഹത്വപ്പെടുത്തലാണ് ഈ ആയത്തിലുള്ളത്. കാരണം ഒരാളും മറ്റൊരാൾക്ക് യാതൊന്നും അധീനമാക്കാത്ത ദിവസമാകുന്നു അത്. \"യൗമുദ്ദീൻ\" എന്നാൽ വിചാരണയുടെയും പ്രതിഫലത്തിൻറെയും ദിവസം."
    },

  const KIND_NAME = { in: "മുഖവുര", ar: "ആയത്ത്", ml: "സാരം", tf: "വിവരണം" };

  /* =====================================================

  /* =====================================================
     PLAYBACK STATE
     ===================================================== */
  const statusEl = $("status");
  const masterBtn = $("master");
  const MASTER_TEXT = "▶ തുടക്കം മുതൽ കേൾക്കാം";
  const OPT_TEXT = "⚙ ഓപ്ഷനുകൾ തെരഞ്ഞെടുക്കാം";
  let token = 0;
  let activeKey = null;
  let currentAudio = null;
  let continuous = false;
  let curLabel = "";
  let curKind = "ml";
  const utterances = [];

  /* ---------- Keep the screen on ----------
     Wake Lock API (needs HTTPS; may be blocked inside an embed) + a tiny muted video as backup. */
  let wakeLock = null, waking = false;
  let nsVideo = null, nsTimer = null, nsCanvas = null;

  function startNoSleep() {
    try {
      if (nsVideo) { const q = nsVideo.play(); if (q && q.catch) q.catch(() => {}); return; }
      if (!HTMLCanvasElement.prototype.captureStream) return;
      nsCanvas = document.createElement("canvas");
      nsCanvas.width = 16; nsCanvas.height = 16;
      const ctx = nsCanvas.getContext("2d");
      let t = 0;
      const draw = () => { ctx.fillStyle = (t++ % 2) ? "#000000" : "#010101"; ctx.fillRect(0, 0, 16, 16); };
      draw();
      nsTimer = setInterval(draw, 500);
      const v = document.createElement("video");
      v.setAttribute("playsinline", "");
      v.setAttribute("muted", "");
      v.muted = true;
      v.loop = true;
      v.style.cssText = "position:fixed;bottom:0;right:0;width:8px;height:8px;opacity:0.05;pointer-events:none;";
      v.srcObject = nsCanvas.captureStream(5);
      v.addEventListener("pause", () => { if (nsVideo === v && document.visibilityState === "visible") v.play().catch(() => {}); });
      document.body.appendChild(v);
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
      nsVideo = v;
    } catch (e) {}
  }

  function stopNoSleep() {
    try {
      if (nsTimer) { clearInterval(nsTimer); nsTimer = null; }
      if (nsVideo) { const v = nsVideo; nsVideo = null; v.pause(); v.srcObject = null; v.remove(); }
    } catch (e) {}
  }

  async function requestWake() {
    if (waking || wakeLock) return;
    waking = true;
    try {
      if ("wakeLock" in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            if (document.visibilityState === "visible") setTimeout(requestWake, 300);
          });
          stopNoSleep();
        } catch (e) {}
      }
      if (!wakeLock) startNoSleep();
    } finally {
      waking = false;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWake();
  });
  ["pointerdown", "touchstart", "click", "keydown"].forEach(ev =>
    document.addEventListener(ev, () => requestWake(), { passive: true }));

  setInterval(() => {
    if (!wakeLock) requestWake();
    if (nsVideo && nsVideo.paused) { const p = nsVideo.play(); if (p && p.catch) p.catch(() => {}); }
  }, 5000);

  /* ---------- Lock-screen info / controls ---------- */
  function setMediaSession(label) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: label, artist: currentReciter().name, album: "സൂറത്തുൽ ഫാതിഹ"
      });
      navigator.mediaSession.setActionHandler("pause", () => stopAll());
      navigator.mediaSession.setActionHandler("stop", () => stopAll());
    } catch (e) {}
  }

  function mark(key) {
    clearMark();
    activeKey = key;
    const btn = $("btn-" + key);
    const item = $("item-" + key);
    if (btn) { btn.textContent = "■"; btn.classList.add("playing"); }
    if (item) {
      item.classList.add("reading");
      if (continuous) item.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function clearMark() {
    if (!activeKey) return;
    const btn = $("btn-" + activeKey);
    const item = $("item-" + activeKey);
    if (btn) { btn.textContent = "▶"; btn.classList.remove("playing"); }
    if (item) item.classList.remove("reading");
    activeKey = null;
  }

  function stopAll() {
    token++;
    continuous = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    clearMark();
    masterBtn.textContent = MASTER_TEXT;
    masterBtn.classList.remove("playing");
    statusEl.textContent = "";
  }

  function fail(my, msg) {
    if (my !== token) return;
    stopAll();
    statusEl.textContent = msg;
  }

  /* =====================================================
     ARABIC: recitation MP3
     ===================================================== */
  function playArabic(n, my, done) {
    if (my !== token) return;
    const r = currentReciter();

    const audio = new Audio();
    audio.preload = "auto";
    currentAudio = audio;
    audio.onended = () => { if (my === token) done(); };
    audio.onerror = () => fail(my, r.name + " – ആയത്ത് " + ayahRef(n) +
      (navigator.onLine ? ": ഓഡിയോ ലോഡ് ചെയ്യാനായില്ല. ഇന്റർനെറ്റ് / ലിങ്ക് പരിശോധിക്കുക."
                        : ": ഓഫ്‌ലൈനാണ്. ഈ ഓഡിയോ മുമ്പ് കേട്ടിട്ടില്ല."));
    audio.src = audioUrl(n);
    audio.play().catch(e => {
      if (my !== token) return;
      if (e && (e.name === "NotSupportedError" || e.name === "AbortError")) return;
      fail(my, "Could not play audio. Tap the button again.");
    });
  }

  /* =====================================================
     MALAYALAM: text to speech
     Best available Malayalam voices are chosen automatically:
     one for the meaning (സാരം), a different one for the explanation (വിവരണം).
     ===================================================== */
  const MALE_HINT   = /midhun|\bmale\b|ravi|prabhat|hemant|madhur/i;
  const FEMALE_HINT = /female|sobhana|swara|lekha|heera|soumya/i;
  const gender = v => FEMALE_HINT.test(v.name) ? "f" : (MALE_HINT.test(v.name) ? "m" : "?");

  function mlVoices() {
    const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    return vs.filter(v => v.lang.toLowerCase().replace("_", "-").startsWith("ml"));
  }

  // Higher = better: neural / natural / Google voices first; offline → only voices stored on the device
  function quality(v) {
    let s = 0;
    if (/neural|natural|online/i.test(v.name)) s += 3;
    if (/google/i.test(v.name)) s += 2;
    if (!v.localService && navigator.onLine) s += 1;
    return s;
  }

  function pickVoices() {
    let vs = mlVoices();
    if (!navigator.onLine) { const local = vs.filter(v => v.localService); if (local.length) vs = local; }
    if (!vs.length) return null;
    vs.sort((a, b) => quality(b) - quality(a) || a.name.localeCompare(b.name));
    const a = vs[0];
    const b = vs.find(v => v !== a && gender(v) !== gender(a)) || vs.find(v => v !== a);
    return { ml: a, tf: b || a, same: !b };
  }

  function voiceProfile(kind) {
    const p = pickVoices();
    if (!p) return null;
    if (kind === "tf") return { voice: p.tf, pitch: p.same ? 0.75 : 1, rate: 0.85 };   // same voice only → lower pitch so it sounds different
    return { voice: p.ml, pitch: 1, rate: 0.95 };
  }

  function cleanForSpeech(text) {
    return text
      .replace(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+/g, " ")
      .replace(/[()\u2018\u2019\u201C\u201D"]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function splitText(text, max = 120) {
    const sentences = text.match(/[^.,:;!?।]+[.,:;!?।]*/g) || [text];
    const chunks = [];
    let cur = "";
    for (let s of sentences) {
      s = s.trim();
      while (s.length > max) {
        let cut = s.lastIndexOf(" ", max);
        if (cut <= 0) cut = max;
        if (cur) { chunks.push(cur); cur = ""; }
        chunks.push(s.slice(0, cut).trim());
        s = s.slice(cut).trim();
      }
      if (!s) continue;
      if (cur && (cur + " " + s).length > max) { chunks.push(cur); cur = s; }
      else { cur = cur ? cur + " " + s : s; }
    }
    if (cur) chunks.push(cur);
    return chunks.filter(c => /[^\s.,:;!?।]/.test(c));
  }

  // Online fallback: Google Translate voice
  function playChunks(chunks, langCode, my, done, i = 0) {
    if (my !== token) return;
    if (i >= chunks.length) { done(); return; }
    statusEl.textContent = curLabel + " · online voice " + (i + 1) + " / " + chunks.length;
    const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + langCode
                + "&q=" + encodeURIComponent(chunks[i]);
    const audio = new Audio(url);
    currentAudio = audio;
    audio.preservesPitch = false;
    audio.mozPreservesPitch = false;
    audio.webkitPreservesPitch = false;
    audio.playbackRate = curKind === "tf" ? 0.78 : 0.92;
    audio.onended = () => playChunks(chunks, langCode, my, done, i + 1);
    audio.onerror = () => fail(my, "Voice is not available on this device or browser.");
    audio.play().catch(() => fail(my, "Could not play audio. Tap the button again."));
  }

  /* Chunks are spoken ONE AT A TIME (the next is queued only when the previous ends).
     Queuing a whole long explanation at once made the browser hang; a per-chunk
     watchdog also skips a chunk if the engine stalls. */
  function speakMalayalam(text, my, done) {
    const langCode = curLang;
    const chunks = splitText(cleanForSpeech(text));
    if (!chunks.length) { done(); return; }

    const found = voiceProfile(curKind);
    if (!found) {
      statusEl.textContent = curLabel + " · no Malayalam voice found, using online voice...";
      playChunks(chunks, langCode, my, done);
      return;
    }

    setTimeout(() => {
      if (my !== token) return;
      statusEl.textContent = curLabel + " · " + found.voice.name;
      let i = 0, failed = false;

      const next = () => {
        if (my !== token || failed) return;
        if (i >= chunks.length) { done(); return; }
        const idx = i++;
        const u = new SpeechSynthesisUtterance(chunks[idx]);
        u.voice = found.voice;
        u.lang = found.voice.lang;
        u.pitch = found.pitch;
        u.rate = found.rate;
        let settled = false;
        const advance = () => { if (settled) return; settled = true; clearTimeout(guard); next(); };
        const guard = setTimeout(() => {
          if (my !== token || settled) return;
          window.speechSynthesis.cancel();
          advance();
        }, 5000 + chunks[idx].length * 250);

        u.onend = advance;
        u.onerror = (e) => {
          if (my !== token || settled || failed) return;
          if (e.error === "canceled" || e.error === "interrupted") return;
          settled = true; failed = true; clearTimeout(guard);
          window.speechSynthesis.cancel();
          statusEl.textContent = "Browser voice failed (" + e.error + "), trying online voice...";
          playChunks(chunks, langCode, my, done, idx);
        };
        utterances[0] = u;                      // keep a reference so it is not garbage-collected
        window.speechSynthesis.speak(u);
      };
      next();
    }, 100);
  }

  /* =====================================================
     PLAY ONE ITEM (kind: 'in' | 'ar' | 'ml' | 'tf')
     ===================================================== */
  function playItem(kind, n, my, done) {
    requestWake();
    curKind = kind === "tf" ? "tf" : "ml";
    curLabel = kind === "in" ? KIND_NAME.in : "ആയത്ത് " + ayahRef(n) + " – " + KIND_NAME[kind];
    statusEl.textContent = curLabel;
    setMediaSession(curLabel);
    if (kind === "ar") {
      const total = +$("repeat").value || 1;
      const loop = k => {
        if (my !== token) return;
        statusEl.textContent = curLabel + " · " + currentReciter().name +
          (total > 1 ? " · ആവർത്തനം " + k + "/" + total : "");
        playArabic(n, my, () => (k < total ? loop(k + 1) : done()));
      };
      loop(1);
      return;
    }
    let text;
    if (kind === "in") text = introSpeech();
    else text = kind === "ml" ? VERSES[n - 1].ml : VERSES[n - 1].tf;
    speakMalayalam(text, my, done);
  }

  /* =====================================================
     PLAYLIST
     Order: introduction, then for each verse: ayah, meaning, explanation.
     Only parts ticked in "കാണിക്കുക" are included.
     ===================================================== */
  function buildQueue() {
    const on = id => $(id).checked;
    const q = [];
    if (on("show-in")) q.push({ kind: "in", n: 0 });
    VERSES.forEach(v => {
      if (on("show-ar")) q.push({ kind: "ar", n: v.n });
      if (on("show-ml")) q.push({ kind: "ml", n: v.n });
      if (on("show-tf") && v.tf) q.push({ kind: "tf", n: v.n });
    });
    return q;
  }

  // Play queue[start...]; cont = true keeps going to the next items, false stops after the first
  function runQueue(queue, start, cont) {
    stopAll();
    requestWake();
    setPanel(false);
    continuous = cont;
    const my = token;
    if (cont) {
      masterBtn.textContent = "■ നിർത്തുക";
      masterBtn.classList.add("playing");
    }
    const step = i => {
      if (my !== token) return;
      if (i >= queue.length || (!cont && i > start)) {
        stopAll();
        if (cont) statusEl.textContent = "പൂർത്തിയായി.";
        return;
      }
      const { kind, n } = queue[i];
      if (kind === "tf") setTafseerVisible(n, true);
      if (kind === "in") setIntroVisible(true);
      mark(kind + "-" + n);
      playItem(kind, n, my, () => { if (my === token) step(i + 1); });
    };
    step(start);
  }

  // Round button next to each item: play it (and carry on to the following items if "തുടർച്ചയായി" is ticked)
  function toggleItem(kind, n) {
    if (activeKey === kind + "-" + n) { stopAll(); return; }
    if ($("opt-cont").checked) {
      const q = buildQueue();
      const idx = q.findIndex(x => x.kind === kind && x.n === n);
      if (idx >= 0) { runQueue(q, idx, true); return; }
    }
    runQueue([{ kind, n }], 0, false);
  }

  // Main button: start from the beginning / stop
  function toggleContinuous() {
    if (continuous || activeKey) { stopAll(); return; }
    const q = buildQueue();
    if (!q.length) {
      statusEl.textContent = "‘കാണിക്കുക’ എന്നതിൽ ഒന്നെങ്കിലും തിരഞ്ഞെടുക്കുക. (⚙ ഓപ്ഷനുകൾ)";
      return;
    }
    runQueue(q, 0, true);
  }

  /* =====================================================
     OPTIONS PANEL
     ===================================================== */
  const controlsEl = $("controls");
  const optBtn = $("opt-toggle");

  function setPanel(open) {
    controlsEl.classList.toggle("open", open);
    optBtn.classList.toggle("open", open);
    optBtn.textContent = OPT_TEXT + (open ? " ▴" : " ▾");
  }
  function togglePanel(e) {
    e.stopPropagation();
    setPanel(!controlsEl.classList.contains("open"));
  }
  document.addEventListener("pointerdown", e => {
    if (!controlsEl.contains(e.target)) setPanel(false);
  });

  /* =====================================================
     LESSONS SUMMARY, QUESTIONS (AI) AND QUIZ
     ===================================================== */
  const AI_RULE = "Answer in Malayalam, only from the text below. Be short and clear.\n\n";
  const pageText = () => VERSES.map(v => `ആയത്ത് ${v.n}: ${v.ml}\n${v.tf || ""}`).join("\n\n");
  const cleanJson = t => t.replace(/```json|```/g, "").trim();

  async function askAI(prompt) {
    const res = await fetch(AI_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });
    if (!res.ok) throw new Error(res.status);
    return (await res.json()).text;
  }

  function renderQuestions(list) {
    $("q-list").innerHTML = "";
    list.forEach(q => {
      const b = document.createElement("button");
      b.className = "q-btn"; b.textContent = q;
      b.onclick = () => answerQuestion(q);
      $("q-list").appendChild(b);
    });
  }

  async function showSummary() {
    const out = $("ai-summary");
    if (!AI_ENDPOINT) { out.textContent = LESSONS; return; }
    out.textContent = "⏳ ...";
    try {
      out.textContent = await askAI(AI_RULE + "Summarise the key lessons of this page in 5-7 short numbered points.\n\n" + pageText());
      const qs = JSON.parse(cleanJson(await askAI(AI_RULE +
        "Return ONLY a JSON array of 5 short Malayalam questions a learner may ask about this page.\n\n" + pageText())));
      if (Array.isArray(qs) && qs.length) renderQuestions(qs);
    } catch (e) { out.textContent = LESSONS; }
  }





  async function startQuiz() {
    let qs = QUIZ;
    if (AI_ENDPOINT) {
      $("quiz").textContent = "⏳ ...";
      try {
        const r = JSON.parse(cleanJson(await askAI(AI_RULE +
          'Return ONLY a JSON array of 5 multiple-choice questions in Malayalam: [{"q":"","o":["","","",""],"c":0,"e":""}] where c is the index of the correct option.\n\n' + pageText())));
        if (Array.isArray(r) && r.length) qs = r;
      } catch (e) {}
    }
    renderQuiz(qs);
  }

  function renderQuiz(qs) {
    let score = 0, answered = 0;
    const box = $("quiz"); box.innerHTML = "";
    qs.forEach((q, qi) => {
      const d = document.createElement("div"); d.className = "quiz-q";
      d.innerHTML = `<p>${qi + 1}. ${q.q}</p>`;
      q.o.forEach((t, oi) => {
        const b = document.createElement("button"); b.className = "quiz-opt"; b.textContent = t;
        b.onclick = () => {
          if (d.dataset.done) return;
          d.dataset.done = 1; answered++;
          d.querySelectorAll(".quiz-opt")[q.c].classList.add("right");
          if (oi === q.c) score++; else b.classList.add("wrong");
          if (q.e) { const e = document.createElement("div"); e.className = "quiz-exp"; e.textContent = q.e; d.appendChild(e); }
          if (answered === qs.length) res.textContent = `🎉 സ്കോർ: ${score} / ${qs.length}`;
        };
        d.appendChild(b);
      });
      box.appendChild(d);
    });
    const res = document.createElement("div"); res.className = "ai-out"; box.appendChild(res);
  }

  /* ===== PATCH: shared audio + follow page translation ===== */
const sharedAudio = new Audio();
let curLang = "ml";

function silentWavUrl() {
  const n = 800, b = new DataView(new ArrayBuffer(44 + n)), w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, 8000, true); b.setUint32(28, 8000, true); b.setUint16(32, 1, true); b.setUint16(34, 8, true); w(36, "data"); b.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
const SILENT = silentWavUrl();
const _run = runQueue;
runQueue = function (...a) { try { sharedAudio.src = SILENT; sharedAudio.play().catch(() => {}); } catch (e) {} return _run(...a); };

/* Malayalam by default; if the page was translated, use the translated language */
function pageLang() {
  const h = document.documentElement, l = (h.lang || "ml").toLowerCase().split("-")[0];
  const translated = l !== "ml" || !/[\u0D00-\u0D7F]/.test($("verse-1").textContent);
  if (!translated) return "ml";
  return l !== "ml" ? l : (navigator.language || "en").toLowerCase().split("-")[0];
}
function mlVoices() {   // voices for the language being spoken (name kept so the picker still works)
  const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  return vs.filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(curLang));
}
function spokenText(kind, n, lang) {
  if (lang === "ml") return kind === "in" ? introSpeech() : (kind === "ml" ? VERSES[n - 1].ml : VERSES[n - 1].tf);
  const el = document.querySelector("#item-" + kind + "-" + (kind === "in" ? 0 : n) + " " + (kind === "tf" ? ".pl" : ".text"));
  if (!el) return "";
  const c = el.cloneNode(true); c.querySelectorAll(".tag,.isti-ar").forEach(x => x.remove());
  return c.textContent;   // the translated text currently on screen
}

function stopAll() {
  token++; continuous = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  sharedAudio.onended = sharedAudio.onerror = null; sharedAudio.pause(); currentAudio = null;
  clearMark();
  masterBtn.textContent = MASTER_TEXT; masterBtn.classList.remove("playing"); statusEl.textContent = "";
}
function playArabic(n, my, done) {
  if (my !== token) return;
  const a = sharedAudio, r = currentReciter();
  a.onended = () => { if (my === token) done(); };
  a.onerror = () => fail(my, r.name + " – ആയത്ത് " + ayahRef(n) + ": ഓഡിയോ ലോഡ് ചെയ്യാനായില്ല.");
  a.preservesPitch = true; a.playbackRate = 1; a.src = audioUrl(n); currentAudio = a;
  a.play().catch(e => {
    if (my !== token || (e && (e.name === "NotSupportedError" || e.name === "AbortError"))) return;
    fail(my, "Could not play audio. Tap the button again.");
  });
}
function playChunks(chunks, langCode, my, done, i = 0) {   // online fallback voice
  if (my !== token) return;
  if (i >= chunks.length) { done(); return; }
  statusEl.textContent = curLabel + " · online voice " + (i + 1) + " / " + chunks.length;
  const a = sharedAudio;
  a.onended = () => playChunks(chunks, langCode, my, done, i + 1);
  a.onerror = () => fail(my, "Online voice is blocked or offline. Try Edge, or Chrome on Android with the language's voice installed.");
  a.preservesPitch = false; a.src = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + langCode + "&q=" + encodeURIComponent(chunks[i]);
  a.playbackRate = curKind === "tf" ? 0.78 : 0.92; currentAudio = a;
  a.play().catch(() => fail(my, "Could not play audio. Tap the button again."));
}
function playItem(kind, n, my, done) {
  requestWake();
  curLang = pageLang();
  curKind = kind === "tf" ? "tf" : "ml";
  curLabel = kind === "in" ? KIND_NAME.in : "ആയത്ത് " + ayahRef(n) + " – " + KIND_NAME[kind];
  statusEl.textContent = curLabel; setMediaSession(curLabel);
  if (kind === "ar") {
    const total = +$("repeat").value || 1;
    const loop = k => {
      if (my !== token) return;
      statusEl.textContent = curLabel + " · " + currentReciter().name + (total > 1 ? " · ആവർത്തനം " + k + "/" + total : "");
      playArabic(n, my, () => (k < total ? loop(k + 1) : done()));
    };
    loop(1); return;
  }
  speakMalayalam(spokenText(kind, n, curLang), my, done);
}
  /* ===== PATCH 2: detect translation per item ===== */
function shownText(kind, n) {
  const sel = kind === "in" ? "#item-in-0 .text" : "#item-" + kind + "-" + n + (kind === "tf" ? " .pl" : " .text");
  const el = document.querySelector(sel); if (!el) return "";
  const c = el.cloneNode(true); c.querySelectorAll(".tag,.isti-ar").forEach(x => x.remove());
  return c.textContent.replace(/\s+/g, " ").trim();
}
function targetLang(text) {
  const h = (document.documentElement.lang || "").toLowerCase().split("-")[0];
  if (h && h !== "ml") return h;
  const g = document.cookie.match(/googtrans=\/[^/]*\/([a-z-]+)/i); if (g) return g[1].toLowerCase().split("-")[0];
  if (/[\u0900-\u097F]/.test(text)) return "hi";
  if (/[\u0B80-\u0BFF]/.test(text)) return "ta";
  if (/[\u0C80-\u0CFF]/.test(text)) return "kn";
  const nl = (navigator.language || "en").toLowerCase().split("-")[0];
  return nl === "ml" ? "en" : nl;
}
function playItem(kind, n, my, done) {
  requestWake();
  curKind = kind === "tf" ? "tf" : "ml";
  curLabel = kind === "in" ? KIND_NAME.in : "ആയത്ത് " + ayahRef(n) + " – " + KIND_NAME[kind];
  statusEl.textContent = curLabel; setMediaSession(curLabel);
  if (kind === "ar") {
    const total = +$("repeat").value || 1;
    const loop = k => {
      if (my !== token) return;
      statusEl.textContent = curLabel + " · " + currentReciter().name + (total > 1 ? " · ആവർത്തനം " + k + "/" + total : "");
      playArabic(n, my, () => (k < total ? loop(k + 1) : done()));
    };
    loop(1); return;
  }
  const shown = shownText(kind, n);
  const mlChars = (shown.match(/[\u0D00-\u0D7F]/g) || []).length;
  const translated = shown.length > 0 && mlChars / shown.length < 0.2;   // mostly not Malayalam any more
  curLang = translated ? targetLang(shown) : "ml";
  const original = kind === "in" ? introSpeech() : (kind === "ml" ? VERSES[n - 1].ml : VERSES[n - 1].tf);
  speakMalayalam(translated ? shown : original, my, done);
}
  /* =====================================================
     START
     ===================================================== */
  buildPage();
  initReciters();
  applySettings();
  applyDisplay();
  CHECKS.forEach(id => $(id).addEventListener("change", saveSettings));
  renderQuestions(SUGGESTED.map(x => x.q));
  requestWake();

  if (window.speechSynthesis) window.speechSynthesis.getVoices();   // Chrome loads voices asynchronously

  // Offline support: needs sw.js next to this page (HTTPS hosting). Silently skipped otherwise.
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
